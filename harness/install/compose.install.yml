services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      # 기존 harness/docker-compose.yml과 동일한 realm import 재사용. 대상 파일명은
      # Keycloak DirImportProvider의 "<realm>-realm.json" 명명 요구사항 때문에 it-realm-realm.json이어야
      # 한다(호스트 측 파일명 harness-realm.json과는 무관 — harness/docker-compose.yml에서 실측 검증됨).
      - ../keycloak/harness-realm.json:/opt/keycloak/data/import/it-realm-realm.json:ro
    ports:
      - "8080:8080"
      # 9000(관리 포트)도 호스트에 노출한다 — install-verify.sh의 wait_healthy(curl 폴링)가
      # 호스트에서 /health/ready에 직접 접근하기 위함(기존 harness/docker-compose.yml은 컨테이너 내부
      # 헬스체크만 쓰고 9000을 노출하지 않음 — 이 compose는 호스트 오케스트레이터가 추가로 필요).
      - "9000:9000"
    healthcheck:
      # 26.6은 관리 포트 9000의 /health/ready 제공; curl 미포함 이미지라 bash TCP로 대체.
      # (컨테이너 헬스 상태 — 향후 언어별 consume 컨테이너가 depends_on: condition: service_healthy로 사용)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -qi '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks:
      - install-net

  # ---------------------------------------------------------------------------------------
  # 언어별 로컬 레지스트리 서비스는 여기에 추가한다(각 언어 태스크가 append 또는
  # compose.<lang>.yml override로 결정) — 예: verdaccio(node) · pypiserver(python) ·
  # bagetter(dotnet) · nginx 정적 .m2(java) · 정적 gem repo(ruby) · satis-web(php) ·
  # cargo-local-registry는 볼륨 마운트라 서비스 불필요(go의 file GOPROXY도 동일 — 서비스가
  # 아니라 /proxy 디렉터리). 전부 install-net에 연결해 소비자 컨테이너가 서비스명으로
  # DNS 해석하도록 한다(하드코딩 IP·extra_hosts 금지 — Windows Docker Desktop glibc-DNS 게차 회피).
  # ---------------------------------------------------------------------------------------

  verdaccio:
    image: verdaccio/verdaccio:6.7.4
    volumes:
      - ./registries/verdaccio.yaml:/verdaccio/conf/config.yaml:ro
    ports:
      # install-verify.sh의 wait_healthy(호스트 curl 폴링)가 접근하기 위해 노출(keycloak의 9000과 동일 이유).
      - "4873:4873"
    healthcheck:
      # verdaccio 이미지 자체가 node 런타임(자기 자신을 구동하는 언어)이므로 node로 헬스체크한다 —
      # keycloak의 bash `/dev/tcp` 트릭과 달리 이 이미지(node:*-alpine, busybox ash)는 bash 존재가
      # 보장되지 않으므로, 대신 확실히 존재하는 node의 http 클라이언트로 `/-/ping`을 확인한다.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4873/-/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - install-net

  pypiserver:
    image: pypiserver/pypiserver:latest
    # 리서치 부록 §python: "run -a . -P . /data/packages"(인증 비활성)에 `--overwrite`를 추가했다
    # (원문에 없는 로컬 전용 이탈) — 재게시 기본 거부(부록 게차)를 서버측에서 흡수해 twine upload
    # 커맨드 자체는 그대로 두고도(publish/python.sh) 재실행이 자연히 멱등이 되게 한다. verdaccio처럼
    # 별도 unpublish/재시도 로직이 필요 없다(publish/python.sh에서 실측 확인 — 동일 산출물 2회 연속 성공).
    command: ["run", "-a", ".", "-P", ".", "--overwrite", "/data/packages"]
    ports:
      # install-verify.sh의 wait_healthy(호스트 curl 폴링)가 접근하기 위해 노출(verdaccio 4873과 동일 이유).
      # 8080(keycloak)·4873(verdaccio)·9000(keycloak mgmt) 기 점유 — node app(18090)·python app(18091)에
      # 이어 18092를 신규 할당(부록에 포트 명시 없음).
      - "18092:8080"
    healthcheck:
      # pypiserver 이미지 자체가 python 런타임(자기 자신을 구동하는 언어)이므로 python3로 헬스체크한다 —
      # verdaccio의 node 트릭과 동일 이유(베이스 이미지에 curl 없음). PEP 503 simple index(/simple/)를
      # urllib으로 조회 — 200 아니면(혹은 연결 실패로 예외 발생 시) 비정상.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/simple/', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - install-net

  bagetter:
    image: bagetter/bagetter:latest
    environment:
      ApiKey: "LOCALKEY"
      Storage__Type: FileSystem
      Storage__Path: /var/baget/packages
      Database__Type: Sqlite
      Database__ConnectionString: "Data Source=/var/baget/bagetter.db"
      Mirror__Enabled: "false"
    ports:
      # install-verify.sh의 wait_healthy(호스트 curl 폴링)가 접근하기 위해 노출(verdaccio 4873과 동일
      # 이유). 8090~8097(언어별 하네스 앱 호스트 포트) 대역과 겹치지 않는 값을 고정 사용한다.
      - "18180:8080"
    healthcheck:
      # 실측 확인: 이 이미지(bagetter/bagetter:latest)는 Alpine 기반이라 curl/bash가 없고 wget만
      # 있다(busybox). 기본 HealthCheck 경로(/healthz)는 이 이미지에서 실제로 404를 반환했다
      # (BaGetter 문서상 기본값이지만 별도 설정 없인 미등록) — 대신 항상 응답하는 실제 NuGet V3
      # 서비스 인덱스(/v3/index.json)를 헬스 판정에 쓴다(레지스트리 API가 실제로 동작함을 검증하므로
      # 오히려 더 의미있는 신호). wget --spider -q는 실측으로 200일 때 exit 0, 404일 때 exit 1 확인됨.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/v3/index.json"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - install-net

  mvn-repo:
    image: nginx:1.27-alpine
    volumes:
      - ./registries/java-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./publish/out/java/staging-m2:/usr/share/nginx/html:ro
    ports:
      # install-verify.sh의 wait_healthy(호스트 curl 폴링)가 접근하기 위해 노출(keycloak의 9000·verdaccio의
      # 4873과 동일 이유). 컨테이너 내부에서는 다른 언어들과 마찬가지로 서비스명(mvn-repo:80)으로 DNS 해석.
      - "18080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - install-net

  gemserver:
    build:
      context: ./registries
      dockerfile: ruby-gemserver.Dockerfile
    volumes:
      - ./publish/ruby-repo:/repo
    ports:
      # install-verify.sh의 wait_healthy(호스트 curl 폴링)가 접근하기 위해 노출(verdaccio의 4873과 동일 이유).
      - "18808:8808"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8808/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - install-net

  # php — Satis(정적 type:composer) 산출물을 서빙하는 nginx(publish/php.sh가 output/를 채운 뒤에만
  # 의미 있는 정적 파일 서버 — verdaccio류의 살아있는 서버와 달리 콘텐츠가 있어야 헬스체크가 통과한다.
  # run_lang_php()가 publish 완료 "이후"에 이 서비스를 기동한다 — 다른 언어와 기동 순서가 다름, 의도됨).
  satis-web:
    image: nginx:1.27-alpine
    volumes:
      - ./publish/out/php/output:/usr/share/nginx/html:ro
    ports:
      # install-verify.sh의 wait_healthy(호스트 curl 폴링)가 접근하기 위해 노출(verdaccio의 4873과 동일
      # 이유). 18099: java mvn-repo(18080)·ruby gemserver(18808) 등 다른 언어 레지스트리 포트 대역과
      # 겹치지 않게 선택.
      - "18099:80"
    healthcheck:
      # nginx:alpine(busybox 기반)엔 curl이 없어 wget으로 대체(verdaccio가 curl 대신 node http를 쓴 것과 동일 이유).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/packages.json"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - install-net

networks:
  # 명시적 name을 지정해 compose 프로젝트명 프리픽스와 무관하게 항상 "install-net"으로
  # 고정한다 — 언어별 publish/consume 컨테이너가 `docker run --network install-net`로
  # 안정적으로 참조할 수 있도록(기존 harness/verify.sh가 프로젝트명 가정이 깨질 수 있어
  # 동적 조회로 우회했던 것과 달리, 여기서는 애초에 이름을 고정해 그 문제를 없앤다).
  install-net:
    name: install-net
