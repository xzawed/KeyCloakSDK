# nginx가 staged .m2(harness/install/publish/out/kotlin/staging-m2)를 정적 서빙하기 위한 vhost(Kotlin
# 설치·동작 검증용 로컬 Maven 저장소). java-nginx.conf와 동형 — Kotlin SDK도 Maven 좌표
# (io.github.xzawed:keycloak-sdk-kotlin:0.1.0)라 Gradle 소비자가 maven { url } 로 해석한다.
#
# autoindex on: install-verify.sh(run_lang_kotlin)가 publish/kotlin.sh 실행 전에 컨테이너를 띄우고 루트
# "/"로 wait_healthy를 폴링하므로, 빈 staging-m2에서도 200을 내야 한다(디렉터리 리스팅). 실제 아티팩트
# GET(io/github/xzawed/keycloak-sdk-kotlin/.../*.pom·*.jar·*.module)은 autoindex 여부와 무관하게 서빙된다.
server {
    listen 80 default_server;
    server_name mvn-repo-kotlin;
    root /usr/share/nginx/html;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}
