# nginx가 staged .m2(harness/install/publish/out/java/staging-m2)를 정적 서빙하기 위한 vhost(java
# 설치·동작 검증 참조 구현용 로컬 Maven 저장소).
#
# 리서치 부록(docs/superpowers/specs/2026-07-07-install-recipes-research.md — 태그
# `archive/docs-history-2026-08`에 있다) §java:
#   "레지스트리: nginx:1.27-alpine가 staging-m2를 서빙(http://mvn-repo/). Central=repo1.maven.org도
#    정적 파일 호스트라 프로토콜 동일. 데몬 불요(대안 file:// repo)."
#
# autoindex on은 두 가지 이유로 필요하다:
#  1) install-verify.sh(run_lang_java)가 publish/java.sh 실행 전에 이미 컨테이너를 띄우고 루트 "/"로
#     wait_healthy를 폴링한다 — publish 전에는 staging-m2가 비어 있으므로 index.html이 없어 autoindex
#     없이는 403이 되어 헬스체크가 영원히 실패한다(directory listing이면 빈 디렉터리라도 200).
#  2) 정적 레이아웃엔 index.html이 없다(Maven local-repo 레이아웃 그대로) — autoindex 없이는 publish
#     이후에도 루트 "/"가 여전히 403이다.
# 실제 아티팩트 GET(io/github/xzawed/.../*.pom·*.jar)은 autoindex 여부와 무관하게 정상 서빙된다.
server {
    listen 80 default_server;
    server_name mvn-repo;
    root /usr/share/nginx/html;
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }
}
