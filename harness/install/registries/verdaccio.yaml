# Verdaccio 설정 — node 설치·동작 검증(install-verify.sh) 참조 구현용 로컬 npm 레지스트리.
#
# 레지스트리: verdaccio/verdaccio:6.7.4(node:24-alpine 베이스). config packages.'**'.publish: $all
# (익명 게시 허용). 레시피는 이 파일과 publish/node.sh 가 SSOT.
#
# access/unpublish도 함께 $all로 열어둔다(부록엔 publish만 명시돼 있으나, 이 하네스는 소비자의
# `npm install`(읽기)과 publish/node.sh의 멱등 재실행(`npm unpublish --force`)도 필요하므로
# 세 권한 모두 익명 허용해야 전체 흐름이 성립한다 — publish만 열면 install이 401로 막힌다).
#
# uplinks.npmjs + proxy: npmjs 덕에 소비자는 `npm install @xzawed/keycloak-sdk@0.1.0
# --registry http://verdaccio:4873` 단 하나의 --registry로 트랜지티브 의존성(express·jose·
# openid-client·@keycloak/keycloak-admin-client 등)까지 이 uplink을 거쳐 실 npmjs.org로 프록시된다
# — install-net 안의 소비자 컨테이너는 "verdaccio" 서비스명만 DNS로 해석하면 된다.
#
# ⚠️ **단 하나의 예외 — 이 SDK 자신의 스코프 `@xzawed/*`는 uplink에 물리지 않는다.**
# 예외가 없으면 하네스가 검증하려는 바로 그 게시가 실패한다. Verdaccio는 PUT을 받을 때 uplink
# 메타데이터를 합쳐 **그 버전이 업스트림에 이미 있으면** 거절한다:
#     npm error 409 Conflict - PUT http://verdaccio:4873/@xzawed%2fkeycloak-sdk
#       - this package is already present
# 2026-08-07 14:19에 `node-v0.1.0-rc.2`가 npmjs로 나간 다음날부터 야간 `install-all`이 3연속
# 빨간 이유가 이것이다(08-08·08-09·08-10, node 한 언어만 실패). publish/node.sh의 멱등 폴백
# (`npm unpublish --force`)도 업스트림 버전은 지울 수 없어 재게시까지 함께 죽는다.
#
# ⚠️ **트리거는 "이름"이 아니라 "버전"이다.** verdaccio 6.7.4 로컬 실측(매 케이스 새 스토리지):
#   (A) 이름만 겹치는 `@xzawed/keycloak-sdk@0.1.0` 게시            → **성공**
#   (C) 먼저 `npm view`로 uplink 캐시(0.1.0-rc.2)를 채운 뒤 (A)     → **성공**
#   (D) 업스트림에 실재하는 그 버전 `0.1.0-rc.2` 게시               → **E409**
# 그래서 "패키지 이름이 이미 있으면 실패"로 기억하면 다음에 또 틀린다 — 이름은 무해하고
# 버전 충돌만 죽인다. 또한 이 예외는 버그 회피만이 아니다: proxy가 붙어 있으면 소비자가
# **공개 npmjs의 패키지**를 설치해도 초록이 되어, 이 하네스의 존재 이유인 "방금 만든 산출물의
# 설치 경로 검증"이 조용히 무의미해진다. 로컬 게시 산출물만 보이는 편이 옳다.
storage: /verdaccio/storage/data

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  # ⚠️ 순서가 곧 의미다 — Verdaccio는 **첫 매치**를 쓴다. `@xzawed/*`가 `@*/*`보다 위에 있어야
  # 하고, `proxy:` 줄이 **없어야** 한다(빈 값이 아니라 부재). 이 두 조건 중 하나라도 깨지면
  # 위 게차의 E409가 그대로 돌아온다 — scripts/test/test-harness-registries.sh가 기계로 막는다.
  '@xzawed/*':
    access: $all
    publish: $all
    unpublish: $all

  '@*/*':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs

  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs

# 게시 명령의 ENEEDAUTH는 npm 클라이언트측 사전검사라 실제 인증 여부와 무관하게 토큰 존재만 확인한다
# — publish/node.sh가 더미 `_authToken`을 .npmrc에 심어 통과시키고, 위 $all 권한 덕에 Verdaccio는
# 그 토큰을 검증하지 않고 익명 요청으로 그대로 허용한다.
listen: 0.0.0.0:4873
