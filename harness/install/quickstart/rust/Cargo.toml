# Install-smoke(rust) 매니페스트 — rust/examples/quickstart.rs(무변경 재사용)를 독립 크레이트로
# 감싼다. node의 harness/install/quickstart/node/quickstart.mjs와 동형 목적이지만, rust는 소비
# 이미지에 cargo/rustc 툴체인이 이미 있으므로(node는 TS 툴체인이 없어 .mjs로 축약) 예제 소스 자체는
# 그대로 재사용하고 이 매니페스트만 하네스 전용으로 새로 만든다.
#
# ⚠️ `cargo add keycloak-sdk`는 source-replaced local-registry에서 "no index found"로 실패할 수
# 있다(cargo #10926, open) — 리서치 부록 §rust 게차. 그래서 버전 지정을 Cargo.toml에 직접 기입한다.
[package]
name = "install-quickstart-rust"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "quickstart"
path = "quickstart.rs"

[dependencies]
keycloak-sdk = "0.1.0"
# rust/examples/quickstart.rs가 keycloak::types::UserRepresentation을 직접 구성하므로, keycloak-sdk와
# 동일 버전·피처의 keycloak crate가 필요하다(같은 타입이어야 AdminClient 메서드에 값으로 전달
# 가능 — harness/apps/rust/Cargo.toml의 동일 주석과 같은 이유).
# ⚠️ 요구 문자열이 `rust/Cargo.toml`과 **글자까지 같아야** 한다(위 주석의 "동일 버전"이 뜻하는 것).
# `scripts/check-versions.mjs`가 셋을 대조한다(2026-08-12 문서 감사 C2).
keycloak = { version = "~26.6.2", default-features = false, features = ["tags-all", "resource-builder", "reqwest12"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
