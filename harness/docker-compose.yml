services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      # 대상 파일명은 Keycloak DirImportProvider의 "<realm>-realm.json" 명명 요구사항 때문에
      # it-realm-realm.json이어야 한다(호스트 측 파일명 harness-realm.json과는 무관 — 실측 검증됨).
      - ./keycloak/harness-realm.json:/opt/keycloak/data/import/it-realm-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      # 26.6은 관리 포트 9000의 /health/ready 제공; curl 미포함 이미지라 bash TCP로 대체
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -qi '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  app-go:
    build:
      context: ..            # 리포지토리 루트(go/ SDK 소스 접근 위해)
      dockerfile: harness/apps/go/Dockerfile
    environment:
      KC_SERVER_URL: http://keycloak:8080
      KC_REALM: it-realm
      KC_CLIENT_ID: it-client
      KC_CLIENT_SECRET: it-secret
      APP_PORT: "8090"
    ports:
      - "8090:8090"
    depends_on:
      keycloak:
        condition: service_healthy
    profiles: ["apps"]        # 기본 up에는 keycloak만; 앱은 --profile apps 또는 개별 up

  app-dotnet:
    build:
      context: ..
      dockerfile: harness/apps/dotnet/Dockerfile
      # ⚠️ 로컬 워크스테이션 한정 우회: Docker Desktop(Windows) 내장 DNS 프록시가
      # CNAME 체인 응답(api.nuget.org → Akamai)을 glibc 리졸버에는 실패(getent rc=2,
      # NXDOMAIN류)로 돌려주는 반면 musl(alpine)에는 정상 응답한다(dig/getent 실측
      # 비교로 확인 — CNAME 없는 직접-A 응답(google.com 등)은 glibc에서도 정상이라
      # 리졸버 자체가 아니라 이 프록시의 CNAME 체인 처리 버그로 특정됨). SDK 이미지
      # (Debian/glibc)의 `dotnet restore`가 NU1301(서비스 인덱스 로드 실패)로 막히므로
      # musl로 해석한 IP를 빌드에 고정 주입(BuildKit RUN 중 /etc/hosts는 읽기전용이라
      # extra_hosts로만 주입 가능). 네이티브 Linux Docker(CI)는 이 프록시 버그가 없어
      # 무해(안전 실패: IP가 stale해지면 TLS 인증서 불일치로 명확히 실패하지 자격증명
      # 유출 등 조용한 오작동은 없음). 갱신: `docker run --rm alpine getent hosts api.nuget.org`
      extra_hosts:
        - "api.nuget.org:23.205.46.151"
    environment:
      KC_SERVER_URL: http://keycloak:8080
      KC_REALM: it-realm
      KC_CLIENT_ID: it-client
      KC_CLIENT_SECRET: it-secret
      APP_PORT: "8090"
    ports:
      - "8091:8090"
    depends_on:
      keycloak:
        condition: service_healthy
    profiles: ["apps"]
