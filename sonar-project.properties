# SonarCloud analysis scope for the polyglot Keycloak SDK monorepo.
# SonarCloud Automatic Analysis (GitHub App) reads sonar.exclusions and
# sonar.issue.ignore.* from this file. projectKey/organization/sources are
# managed by Automatic Analysis and intentionally omitted here.

# --- Exclude non-production artifacts from analysis ---
# Build output, dependencies, runnable examples, integration-test fixtures/realm
# JSON, and the k6 harness sample apps are not production SDK code.
sonar.exclusions=**/target/**,**/bin/**,**/obj/**,**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/examples/**,**/testdata/**,**/*-realm.json,harness/**

# --- S2068 "Credentials should not be hard-coded" ---
# Every match in this repo is an intentional, throwaway TEST fixture used to
# exercise the SDK against a disposable Keycloak container (e.g. admin/admin,
# "it-secret", "super-secret", "s", "secret-at"). Production code never hard-codes
# secrets: KeycloakConfig receives them at runtime and masks them in Debug output.
# Rust interleaves #[cfg(test)] modules into its src/ files, so these test literals
# cannot be excluded by directory — S2068 is suppressed for all Rust sources and for
# every language's test code (the SDK's own masking + reviews cover real secret hygiene).
sonar.issue.ignore.multicriteria=cred_rust,cred_tests_dir,cred_test_dir,cred_go,cred_it,cred_java
sonar.issue.ignore.multicriteria.cred_rust.ruleKey=rust:S2068
sonar.issue.ignore.multicriteria.cred_rust.resourceKey=rust/**/*.rs
sonar.issue.ignore.multicriteria.cred_tests_dir.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.cred_tests_dir.resourceKey=**/tests/**
sonar.issue.ignore.multicriteria.cred_test_dir.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.cred_test_dir.resourceKey=**/test/**
sonar.issue.ignore.multicriteria.cred_go.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.cred_go.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.cred_it.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.cred_it.resourceKey=**/*IT.*
sonar.issue.ignore.multicriteria.cred_java.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.cred_java.resourceKey=**/*Test.*
