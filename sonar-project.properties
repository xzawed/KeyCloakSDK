# SonarCloud analysis config for the polyglot Keycloak SDK monorepo.
# CI-based analysis (see .github/workflows/sonarcloud.yml) reads this file.
sonar.projectKey=xzawed_KeyCloakSDK
sonar.organization=xzawed

# --- Exclude non-production artifacts from analysis ---
# Build output, dependencies, runnable examples, integration-test fixtures/realm JSON,
# and the k6 harness sample apps are not production SDK code.
# ⚠️ `**/gradle/wrapper/**` — 커밋된 `gradle-wrapper.jar`가 **텍스트 소스로 색인된다**. 스캐너가
# 실제로 낸 말: "Invalid character encountered in file …/kotlin/gradle/wrapper/gradle-wrapper.jar
# at line 1 for encoding UTF-8." 추적 중인 wrapper jar는 셋인데 둘은 `harness/**`로 이미 빠져
# **kotlin 것 하나만** 경고가 났다(실측). 해법은 `sonar.sourceEncoding`을 만지는 것이 아니다 —
# 이 파일은 텍스트가 아니다. `python/coverage.xml`과 같은 부류(생성물·바이너리가 소스로 색인됨).
sonar.exclusions=**/target/**,**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/bin/**,**/obj/**,**/examples/**,**/testdata/**,**/*-realm.json,**/gradle/wrapper/**,harness/**,scripts/**

# --- 분석 정밀도 (스캔 로그의 WARN 을 근거로) ---
# ⚠️ 이 셋이 없을 때 스캐너가 실제로 뭐라고 했는지가 근거다(main run 32614552717):
#   "Missing 'sonar.java.binaries' and 'sonar.java.libraries' properties. You might end up with
#    less precise analysis results." + "Unresolved imports/types have been detected during analysis."
#   "Your code is analyzed as compatible with all Python 3 versions by default."
# 즉 Java 는 바이트코드 없이, Python 은 버전 미상으로 분석되고 있었다 — 게이트는 통과하지만
# 통과가 "문제가 없다"가 아니라 "덜 본다"였다.
#
# java: 리액터 4개 모듈의 컴파일 산출물. sonarcloud.yml 이 스캔 **전에** `mvn verify` 를 돌리므로
# 스캔 시점에 존재한다. keycloak-sdk-bom 은 src/main 이 없어(BOM) 제외한다.
sonar.java.binaries=java/keycloak-sdk-core/target/classes,java/keycloak-sdk-auth/target/classes,java/keycloak-sdk-admin/target/classes,java/keycloak-sdk/target/classes
# java/pom.xml 의 `maven.compiler.release` 와 같은 값이어야 한다(현재 21).
sonar.java.source=21
# python/pyproject.toml 의 `requires-python = ">=3.10"` + classifiers 3.10–3.13 과 동기화.
sonar.python.version=3.10,3.11,3.12,3.13

# --- Code coverage (다언어 배선) ---
# 경로는 sonar.projectBaseDir(=리포 루트) 기준 상대. sonarcloud.yml이 스캔 전에 각 리포트를 생성한다
# (Docker-free 단위테스트만). **/build/** 등 제외는 소스 인덱싱만 막고 리포트 입력 읽기엔 무관하다.
# JaCoCo-포맷 XML(Kover도 JaCoCo 포맷) — kotlin kover + java 4개 리액터 모듈.
sonar.coverage.jacoco.xmlReportPaths=kotlin/build/reports/kover/report.xml,java/keycloak-sdk-core/target/site/jacoco/jacoco.xml,java/keycloak-sdk-auth/target/site/jacoco/jacoco.xml,java/keycloak-sdk-admin/target/site/jacoco/jacoco.xml,java/keycloak-sdk/target/site/jacoco/jacoco.xml
# JS/TS(node, vitest v8 lcov) · Python(pytest-cov xml) · Go(go test -coverprofile).
sonar.javascript.lcov.reportPaths=node/coverage/lcov.info
sonar.python.coverage.reportPaths=python/coverage.xml
sonar.go.coverage.reportPaths=go/cover.out
# PHP(phpunit clover) · Ruby(simplecov_json_formatter → coverage.json; Sonar Ruby SimpleCovSensor는
# LCOV가 아니라 SimpleCov 표준 JSON을 요구). 경계파일은 각 리포트에서 이미 제외됨(phpunit.xml
# source-exclude · spec_helper SimpleCov add_filter) → 아래 coverage.exclusions와 동기화.
sonar.php.coverage.reportPaths=php/clover.xml
sonar.ruby.coverage.reportPaths=ruby/coverage/coverage.json
# Rust(cargo llvm-cov → lcov). Rust는 SonarQube Cloud 정식 지원 언어(2025 GA)라 .rs가 신규코드
# 커버리지 분모에 집계된다 — 리포트를 안 먹이면 전 라인이 미커버로 잡힌다. 공식 Rust 애널라이저는
# LCOV/Cobertura 둘 다 받으며(`sonar.rust.lcov.reportPaths`/`sonar.rust.cobertura.reportPaths`),
# 커뮤니티 플러그인(`community.rust.*`)이 아니라 이쪽이 이 프로젝트가 쓰는 표면이다.
sonar.rust.lcov.reportPaths=rust/lcov.info
# ⚠️ Rust 애널라이저는 크레이트를 찾을 때 **프로젝트 루트의 `Cargo.toml`**을 기본값으로 본다. 이 저장소는
# 모노레포라 루트에 Cargo.toml이 없어(크레이트는 `rust/`에 있다) 매니페스트 경로를 명시하지 않으면
# 크레이트를 인식하지 못한다 — 위 lcov 경로만 맞춰도 소용이 없다. PHP가 Packagist에 직접 게시될 수
# 없었던 것과 같은 부류의 "모노레포라서 기본값이 안 맞는" 함정이다.
sonar.rust.cargo.manifestPaths=rust/Cargo.toml
# 커버리지 측정 제외:
#  (1) 각 언어 네트워크 경계 파일 — 각 SDK 자체 커버리지 게이트가 통합테스트로만 검증하며 omit하는 것과
#      동기화(SonarCloud 신규코드 커버리지가 0%로 희석되지 않게).
#  (2) 각 언어 네트워크 경계 파일(php/ruby도 이제 커버리지 배선됨 — clover/lcov가 경계파일을 이미
#      제외하므로 아래 목록은 그와 동기화). dotnet(C#)만 전용 SonarScanner for .NET이 필요해 소스
#      전체를 커버리지에서 제외한다(각 언어 자체 CI 게이트는 그대로 강제).
#  (3) 테스트/스펙 소스(커버리지 분모 아님).
#      ⚠️ 아래 `**/test/**,**/tests/**,**/spec/**`는 **디렉터리 기반** 레이아웃만 잡는다. Go는 테스트를
#      디렉터리가 아니라 소스 옆에 `*_test.go` 접미로 두는 유일한 언어라 이 패턴에 걸리지 않았고,
#      `go test -coverprofile`은 대상 패키지만 계측하고 테스트 파일 자체는 리포트에 넣지 않으므로
#      (`go/cover.out`에 `_test.go` 레코드 0건 — 실측) 데이터가 없는 채로 분모에만 들어가 있었다.
#      나머지 8개 언어(dotnet/tests·java src/test·kotlin src/test·node test·php tests·python tests·
#      ruby spec·rust tests)는 모두 디렉터리 패턴에 걸린다. Go만 파일명 패턴을 따로 적어준다.
# rust도 (1)과 동형이다 — `cargo llvm-cov --ignore-filename-regex '(auth|admin|client)\.rs'`(rust-ci.yml
# coverage 잡과 동일)가 경계 3파일을 lcov에서 빼므로, 여기서도 같이 빼야 데이터 없는 파일이 0%로
# 집계되지 않는다. 이슈 분석(sonar.exclusions)에서는 rust를 빼지 않는다 — 커버리지 지표만의 문제다.
sonar.coverage.exclusions=kotlin/src/main/kotlin/io/github/xzawed/keycloak/auth.kt,kotlin/src/main/kotlin/io/github/xzawed/keycloak/client.kt,kotlin/src/main/kotlin/io/github/xzawed/keycloak/admin/**,node/src/index.ts,node/src/auth.ts,node/src/transport.ts,node/src/admin/**,java/**/AuthClient.java,java/**/AdminClient.java,python/src/keycloak_sdk/auth.py,python/src/keycloak_sdk/admin/__init__.py,python/src/keycloak_sdk/aio/auth.py,python/src/keycloak_sdk/aio/admin/__init__.py,go/auth.go,go/admin.go,go/admin_*.go,go/client.go,dotnet/src/**,php/src/AuthClient.php,php/src/Admin/**,php/src/KeycloakClient.php,ruby/lib/keycloak_sdk/auth_client.rb,ruby/lib/keycloak_sdk/admin/**,ruby/lib/keycloak_sdk/client.rb,ruby/lib/keycloak_sdk/version.rb,rust/src/auth.rs,rust/src/admin.rs,rust/src/client.rs,**/test/**,**/tests/**,**/spec/**,go/**/*_test.go,kotlin/src/test/**,kotlin/src/integrationTest/**

# --- Copy-paste(CPD) 중복 제외 ---
# (1) 테스트/스펙 소스 — 테스트는 본질적으로 반복적(같은 셋업/단언 패턴)이라 CPD가 노이즈다(업계 관례).
#     ⚠️ coverage.exclusions와 같은 이유로 Go는 `go/**/*_test.go`를 따로 적는다(디렉터리 패턴에 안 걸림).
# (2) 네트워크 경계 파일 — 이 폴리글랏 SDK는 sync/async 미러·언어간 병렬 구조를 의도적으로 동형 유지하므로
#     경계(auth/admin/client)의 소규모 중복(예: aclose 미러·전송오류 처리 패턴)은 설계상 불가피하다.
sonar.cpd.exclusions=**/test/**,**/tests/**,**/spec/**,go/**/*_test.go,kotlin/src/test/**,kotlin/src/integrationTest/**,node/src/auth.ts,node/src/transport.ts,node/src/admin/**,python/src/keycloak_sdk/aio/**,python/src/keycloak_sdk/auth.py,python/src/keycloak_sdk/admin/**,java/keycloak-sdk-auth/**,java/keycloak-sdk-admin/**,kotlin/src/main/kotlin/io/github/xzawed/keycloak/auth.kt,kotlin/src/main/kotlin/io/github/xzawed/keycloak/admin/**,go/auth.go,go/admin.go,go/admin_*.go,go/client.go,dotnet/src/Xzawed.Keycloak.Sdk/AuthClient.cs,dotnet/src/Xzawed.Keycloak.Sdk/Admin/**

# --- Deliberate policy / convention choices (CI infra + library lockfiles), NOT SDK product security ---
# These SonarCloud githubactions + text rules flag choices this polyglot repo has consistently made
# across all 9 languages; suppressing them scopes the Security Rating to actual SDK product code.
#  - githubactions:S8549/S8543/S8544 — lock resolved dependency versions in CI install steps
#  - githubactions:S6505  — npm install without "--ignore-scripts"
#  - text:S8570/S8567/S8565/S8569 — missing lock file (Cargo.toml/composer.json/pyproject.toml/build.gradle.kts):
#    SDK *libraries* intentionally do NOT commit lock files (a Gradle library ships version ranges, not a pinned
#    gradle.lockfile). ⚠️ **Rust no longer belongs to this rationale** — `rust/Cargo.lock` IS committed now, so the
#    library can be built reproducibly (`--locked`) while consumers still get caret/tilde ranges. Whichever member
#    of the S8564–S8571 family covers Cargo can be dropped from this list once someone confirms the rule↔manifest
#    mapping; it is left in place only because that mapping was not verified here. text:S8569 is the Java/Kotlin
#    (Gradle) member of the S8564–S8571 lock-file family; it is a VULNERABILITY/SECURITY rule and is the sole
#    driver of the "C Security Rating on New Code" on the Kotlin PR — suppressing it restores Security Rating A.
#  - kotlin:S6624 (Do not hardcode version numbers) / kotlin:S6629 (Group dependencies by their destination) —
#    build.gradle.kts MAINTAINABILITY rules (non-gating; the SonarCloud Quality Gate passes without these). This
#    polyglot repo DELIBERATELY pins exact dependency versions inline across all 9 languages (no Gradle version
#    catalog / no BOM-only indirection) so every SDK's dependency set is auditable at a glance — the same explicit
#    convention Java/Rust/etc. use. Suppressing scopes the issue list (and SonarLint's local Problems panel) to
#    actionable findings rather than a deliberate style choice.
# --- new code에 남아 게이트를 빨갛게 하던 지적들(2026-08-11, 진단 워크플로 실측) ---
#
# 배경: `main`의 품질 게이트가 2026-07-07부터 연속 실패했고, 깨진 조건은 정확히 둘이었다 —
# `new_reliability_rating=3(C)`·`new_security_rating=2(B)`(요구 A). 커버리지(98.5)·중복(0.7)은
# 이미 초록이다. 토큰 인증 API 조회로 뽑은 42건의 성격이 아래처럼 갈렸다.
#
# ⚠️ **고칠 수 있는 것은 고쳤고, 여기 남긴 것은 오탐뿐이다.** 실제로 코드를 바꾼 것:
#   · java:S8786 / typescript:S8786 (정규식 초선형 백트래킹) → java·node·ruby의 후행 슬래시
#     제거를 선형 트림으로 교체(나머지 다섯 언어가 이미 쓰던 방식으로 동형성 회복)
#   · javabugs:S2259 → 억제가 아니라 `assertNotNull` 어서션 추가(getClientSecret은 퍼블릭
#     클라이언트에서 정말 null일 수 있다 — 계약을 명시하는 편이 옳다)
#   · rubydre:S7916 → `or`를 `||`로 교체
#
#  - java:S3077 (volatile 필드가 non-thread-safe 타입) — **오탐**. 지적된 세 필드가 담는 타입은
#    전부 불변이다(실측: `TokenSet`·`JwtValidator` 모두 `public final class` + 전 필드
#    `private final`). S3077이 경고하는 것은 "volatile은 참조의 가시성만 보장하고 객체 내부의
#    스레드 안전성은 보장하지 않는다"인데, **불변 객체에는 그 위험이 성립하지 않는다** —
#    완전히 생성된 뒤 volatile로 안전 발행되는 표준 패턴이다. 지연생성 캐시 3곳
#    (AuthClient.jwtValidator · ClientCredentialsTokenProvider.cached · InMemoryTokenStore.current)
#    에 한정한다. ⚠️ 담는 타입을 가변으로 바꾸는 순간 이 근거는 무너지므로, 그때는 억제를
#    지우고 실제로 고쳐야 한다.
#  - php:S5332 (HTTP 사용) — **테스트 픽스처 한정 오탐**. 31건 전부 `php/tests/**`이고 전부
#    로컬 테스트 서버를 가리키는 `http://` URL이다(실측: SECURITY 축 total=31, 전건 php 테스트).
#    ⚠️ 프로덕션 코드에는 적용하지 않는다 — `php/src/**`에서 평문 HTTP가 나오면 그건 진짜다.
#  - php:S1848 (인스턴스화 결과 미사용) — **테스트 관용 오탐**. `expectException` 뒤에 생성자를
#    호출해 "생성자가 던지는지"를 검증하는 PHPUnit 표준 패턴이라 반환값이 없는 것이 정상이다.
# --- 테스트가 프로덕션으로 분류돼 생기는 지적 (2026-08-23, 토큰 조회로 실측) ---
#
# main 의 BUG 35 건이 **전부 테스트 파일**이었고 신뢰성 등급을 E 로 끌어내려 게이트를 깼다.
# 이 프로젝트는 `sonar.tests` 를 설정하지 않아 스캐너가 경로 휴리스틱으로 추측한다.
#
# ⚠️ **`sonar.tests` 로 고치려다 분석을 통째로 무너뜨렸다 — 기각.** 실측(PR #304 스캔):
#     색인 파일        487 → 159
#     분석 소스 파일   386/434/66/51/… → 38/19/0
#     그 상태에서 게이트는 **PASSED** 였다 — 볼 게 없어서 통과한 **공허한 초록**이다.
#   원인은 `sonar.tests` 만 주고 `sonar.sources` 를 안 주면 소스 집합이 무너지는 것이다.
#   `sonar.sources` 까지 명시하려면 9 개 언어의 프로덕션 루트를 손으로 이중 열거해야 하고
#   그 목록은 드리프트한다(이 리포가 가드를 두는 바로 그 부류). 이득(테스트 오탐 침묵)보다
#   비용이 크다. **되살릴 조건**: 스캐너가 `sonar.sources` 없이도 소스 집합을 보존하게 되거나
#   (같은 실험을 다시 돌려 487 이 유지되는 것으로 확인), 프로덕션 루트가 기계 생성될 때.
#
# 그래서 규칙 단위로 좁혀 막는다 — 이 파일이 php:S5332/S1848 에 이미 쓰는 방식과 같다.
#  - java:S5960 "Remove this assertion from production code" — 33 건 전부 테스트 파일이다.
#    이 규칙은 원래 프로덕션 코드에만 적용되므로 테스트 경로 억제는 손실이 없다.
#  - java:S2095 · javabugs:S2259 BLOCKER 3 건 — **소스를 읽어 전부 오탐임을 확인했다**:
#      ClientCredentialsTokenProviderTest:53  `finally { pool.shutdownNow(); }` 로 이미 해제
#      AdminClientLifecycleTest:27            `assertDoesNotThrow(admin::close)` 가 곧 close 검증
#      KeycloakConfigTest:58                  바로 위 줄에 `assertNotNull` 이 있다
#    ⚠️ 파일 단위로만 막는다 — 테스트 전역으로 넓히면 진짜 누수를 숨긴다.
sonar.issue.ignore.multicriteria=g2,g3,g4,g5,t1,t2,t3,t4,k1,k2,j1,j2,j3,p1,p2,x1,x2,x3,x4,x5,x6,x7,x8,x9
sonar.issue.ignore.multicriteria.x1.ruleKey=java:S5960
sonar.issue.ignore.multicriteria.x1.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.x2.ruleKey=java:S5960
sonar.issue.ignore.multicriteria.x2.resourceKey=**/src/integrationTest/**
sonar.issue.ignore.multicriteria.x3.ruleKey=kotlin:S5960
sonar.issue.ignore.multicriteria.x3.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.x4.ruleKey=kotlin:S5960
sonar.issue.ignore.multicriteria.x4.resourceKey=**/src/integrationTest/**
sonar.issue.ignore.multicriteria.x5.ruleKey=java:S2095
sonar.issue.ignore.multicriteria.x5.resourceKey=**/auth/ClientCredentialsTokenProviderTest.java
sonar.issue.ignore.multicriteria.x6.ruleKey=java:S2095
sonar.issue.ignore.multicriteria.x6.resourceKey=**/admin/AdminClientLifecycleTest.java
sonar.issue.ignore.multicriteria.x7.ruleKey=javabugs:S2259
sonar.issue.ignore.multicriteria.x7.resourceKey=**/core/KeycloakConfigTest.java
# 나머지 언어의 테스트 경로도 같은 부류다(디렉터리 규약이 언어마다 다르다).
sonar.issue.ignore.multicriteria.x8.ruleKey=*:S5960
sonar.issue.ignore.multicriteria.x8.resourceKey=**/tests/**
sonar.issue.ignore.multicriteria.x9.ruleKey=*:S5960
