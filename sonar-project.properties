# SonarCloud analysis config for the polyglot Keycloak SDK monorepo.
# CI-based analysis (see .github/workflows/sonarcloud.yml) reads this file.
sonar.projectKey=xzawed_KeyCloakSDK
sonar.organization=xzawed

# --- Exclude non-production artifacts from analysis ---
# Build output, dependencies, runnable examples, integration-test fixtures/realm JSON,
# and the k6 harness sample apps are not production SDK code.
sonar.exclusions=**/target/**,**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/bin/**,**/obj/**,**/examples/**,**/testdata/**,**/*-realm.json,harness/**

# --- Code coverage (Kotlin, first language analyzed by SonarCloud as "new code") ---
# Kover(koverXmlReport)는 JaCoCo-포맷 XML을 낸다 → SonarCloud는 JaCoCo importer로 그대로 읽는다(속성명 동일).
# 경로는 sonar.projectBaseDir(=리포 루트) 기준 상대. **/build/** 제외는 소스 인덱싱만 막고 리포트 입력 읽기엔
# 무관하다. sonarcloud.yml이 스캔 전에 `./gradlew koverXmlReport`(Docker-free 단위테스트)로 이 파일을 생성한다.
sonar.coverage.jacoco.xmlReportPaths=kotlin/build/reports/kover/report.xml
# 커버리지 분모를 Kover 게이트(라인90/브랜치85)와 일치시킨다: (1) 네트워크 경계 클래스(auth/client/admin)는
# Kover가 리포트에서 omit하므로 SonarCloud도 커버리지 측정에서 제외해야 0% 오집계로 신규코드 커버리지가
# 희석되지 않는다(Kover exclude와 동기화). (2) 테스트 소스는 커버리지 분모가 아니다(방어적 제외).
sonar.coverage.exclusions=kotlin/src/main/kotlin/io/github/xzawed/keycloak/auth.kt,kotlin/src/main/kotlin/io/github/xzawed/keycloak/client.kt,kotlin/src/main/kotlin/io/github/xzawed/keycloak/admin/**,kotlin/src/test/**,kotlin/src/integrationTest/**

# --- Deliberate policy / convention choices (CI infra + library lockfiles), NOT SDK product security ---
# These SonarCloud githubactions + text rules flag choices this polyglot repo has consistently made
# across all 7 languages; suppressing them scopes the Security Rating to actual SDK product code.
#  - githubactions:S7637  — pin Actions to a full commit SHA (repo uses version tags @vN, like the 6 prior SDKs)
#  - githubactions:S8549/S8543/S8544 — lock resolved dependency versions in CI install steps
#  - githubactions:S6505  — npm install without "--ignore-scripts"
#  - text:S8570/S8567/S8565/S8569 — missing lock file (Cargo.toml/composer.json/pyproject.toml/build.gradle.kts):
#    SDK *libraries* intentionally do NOT commit lock files (Cargo.lock gitignored per Rust convention; a Gradle
#    library ships version ranges, not a pinned gradle.lockfile — same policy). text:S8569 is the Java/Kotlin
#    (Gradle) member of the S8564–S8571 lock-file family; it is a VULNERABILITY/SECURITY rule and is the sole
#    driver of the "C Security Rating on New Code" on the Kotlin PR — suppressing it restores Security Rating A.
sonar.issue.ignore.multicriteria=g1,g2,g3,g4,g5,t1,t2,t3,t4
sonar.issue.ignore.multicriteria.g1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.g1.resourceKey=**/*
sonar.issue.ignore.multicriteria.g2.ruleKey=githubactions:S8549
sonar.issue.ignore.multicriteria.g2.resourceKey=**/*
sonar.issue.ignore.multicriteria.g3.ruleKey=githubactions:S8543
sonar.issue.ignore.multicriteria.g3.resourceKey=**/*
sonar.issue.ignore.multicriteria.g4.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.g4.resourceKey=**/*
sonar.issue.ignore.multicriteria.g5.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.g5.resourceKey=**/*
sonar.issue.ignore.multicriteria.t1.ruleKey=text:S8570
sonar.issue.ignore.multicriteria.t1.resourceKey=**/*
sonar.issue.ignore.multicriteria.t2.ruleKey=text:S8567
sonar.issue.ignore.multicriteria.t2.resourceKey=**/*
sonar.issue.ignore.multicriteria.t3.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.t3.resourceKey=**/*
sonar.issue.ignore.multicriteria.t4.ruleKey=text:S8569
sonar.issue.ignore.multicriteria.t4.resourceKey=**/*
