# SonarCloud analysis config for the polyglot Keycloak SDK monorepo.
# CI-based analysis (see .github/workflows/sonarcloud.yml) reads this file,
# including the sonar.exclusions and sonar.issue.ignore.* scope rules below.
sonar.projectKey=xzawed_KeyCloakSDK
sonar.organization=xzawed

# --- Exclude non-production + all test code from analysis ---
# Build output, dependencies, runnable examples, integration-test fixtures/realm JSON,
# the k6 harness sample apps, and every language's test suites are not production SDK code.
sonar.exclusions=**/target/**,**/bin/**,**/obj/**,**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/examples/**,**/testdata/**,**/*-realm.json,harness/**,**/tests/**,**/test/**,**/src/test/**,**/*_test.go,**/*IT.php

# --- Credential/secret false positives (test fixtures) ---
# The repo's only credential literals are intentional, throwaway TEST fixtures
# (admin/admin, "it-secret", "super-secret", "s", "secret-at") used to exercise the SDK
# against a disposable Keycloak container. Production code never hard-codes secrets:
# KeycloakConfig receives them at runtime and masks them in Debug output.
# Rust interleaves #[cfg(test)] modules into its src/ files, so these literals cannot be
# excluded by directory — suppress BOTH the hard-coded-credentials rule (S2068) and
# SonarCloud secret-detection (secrets:*) on Rust sources. Test-file globs covered too.
sonar.issue.ignore.multicriteria=r_s2068,r_secrets,t_s2068,t_secrets
sonar.issue.ignore.multicriteria.r_s2068.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.r_s2068.resourceKey=rust/**/*.rs
sonar.issue.ignore.multicriteria.r_secrets.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.r_secrets.resourceKey=rust/**/*.rs
sonar.issue.ignore.multicriteria.t_s2068.ruleKey=*:S2068
sonar.issue.ignore.multicriteria.t_s2068.resourceKey=**/*Test.*
sonar.issue.ignore.multicriteria.t_secrets.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.t_secrets.resourceKey=**/*Test.*
