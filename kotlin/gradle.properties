org.gradle.jvmargs=-Xmx2g
kotlin.code.style=official

# ⚠️ KGP는 기본적으로 자기 버전(2.4.10)의 kotlin-stdlib를 의존성으로 자동 추가하고, 그 좌표가
# 게시 POM에 그대로 실린다. stdlib 2.4.10의 바이너리 메타데이터는 2.4.0이라 **Kotlin 2.2 소비자의
# 컴파일러가 읽지 못한다** — `languageVersion`/`apiVersion`으로 우리 클래스만 2.2로 낮춰도
# 전이 stdlib가 2.4를 강제하면 소비자는 여전히 컴파일할 수 없다(하네스 install 잡 실측:
# "Class 'kotlin.Unit' ... actual metadata version is 2.4.0, but the compiler version 2.2.0
# can read versions up to 2.3.0"). 자동 주입을 끄고 build.gradle.kts에서 소비자 하한 버전으로
# 명시 선언한다 — 상위 Kotlin 소비자는 자기 KGP가 더 높은 stdlib를 가져오므로(Gradle이 최고
# 버전 선택) 손해가 없다.
kotlin.stdlib.default.dependency=false
