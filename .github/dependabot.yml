# Dependabot — dependency update monitoring for all nine language SDKs plus
# GitHub Actions. Each ecosystem is scoped to its language directory. Weekly
# schedule; minor/patch updates grouped to reduce PR noise.
#
# ⚠️ **`harness/` 는 의도적으로 없다 — 기각이지 누락이 아니다.** 하네스 경보가 51일간 침묵한
# 뒤 이 목록에 `harness/apps/*` 를 더하는 안을 검토했고, 실측 후 기각했다:
#   - 앱 매니페스트 13개 중 **5개는 dependabot 도 해석하지 못한다** — 이미지 안에만 있는 경로를
#     참조한다(`path: "/src/ruby"` · `replace => /sdk` · `url: "/src/php"` · `file:./*.tgz` ·
#     `http://mvn-repo-kotlin/`). 그 경로가 곧 하네스가 증명하려는 것이라 레지스트리 좌표로
#     바꾸면 하네스의 존재 이유가 사라진다.
#   - **2개는 Gradle 이라 의존성 그래프가 아예 안 본다**(공식 표의 Gradle 행은 비어 있다).
#     ⚠️ 그래프가 못 본다 ≠ 감사 안 된다 — 그 둘은 `security-audit.yml` 의 `harness-kotlin`
#     매트릭스 두 레그가 `runtimeClasspath` → OSV 로 직접 본다(좌표 129개씩, 2026-08-28).
#   - **2개(`install/*/dotnet`)는 선언된 의존성이 0개**다 — PackageReference 를 런타임에 붙인다.
#   - 남는 자리(하네스 rust·python)는 `security-audit.yml` 의 `harness-rust`·`harness-python`
#     잡이 **직접** 감사한다 — 버전 PR 을 기다리지 않고 락파일·requirements 를 그날 본다.
#   - 화석화 걱정은 이번 원인이었으나(`~> 6.4` 가 패치 라인에 닿지 못했다) 그 Gemfile 은 이제
#     상한이 없다. 상한 없는 제약은 dependabot 이 올릴 것이 없다.
# 즉 이득은 거의 0인데, 이 파일은 **한 항목의 문법 오류가 파일 전체를 죽여** 아홉 SDK 의 버전
# 업데이트가 통째로 멈춘다(실패는 Insights → Dependency graph → Dependabot 에만 뜨고 CI 는
# 초록이다). 되살릴 조건: 하네스 매니페스트가 컨테이너 경로 없이 표현 가능해지면 다시 본다.
version: 2
updates:
  - package-ecosystem: maven # Java
    directory: /java
    schedule: { interval: weekly }
    groups:
      java-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: gradle # Kotlin
    directory: /kotlin
    schedule: { interval: weekly }
    groups:
      kotlin-minor-patch:
        update-types: [minor, patch]
        # ⚠️ **Gradle 래퍼는 독립적인 의존성이 아니다 — 상한을 같은 그룹의 다른 항목(KGP)이 정한다.**
        # kotlinlang.org의 KGP↔Gradle 호환표가 KGP 버전마다 "완전지원 밴드"를 주고(실측:
        # `2.2.20–2.2.21 | 7.6.3–8.14`, `2.4.0–2.4.10 | 7.6.3–9.5.0`), 래퍼는 그 안에 있어야 한다.
        # 그런데 723d0a4가 KGP `2.2.20→2.4.10`과 래퍼 `9.5.0→9.6.1`을 **한 PR에** 올리면서 밴드를
        # 확인할 계기 자체가 사라졌다 — 두 값이 같은 diff 안에서 함께 움직이면 "어느 쪽이 어느 쪽의
        # 제약인가"가 보이지 않는다. 그렇게 한 달간 밴드 밖에 있었고 아무도 몰랐다.
        # 빼면 dependabot이 이것만 **단독 PR**로 올린다(문서: "Any outdated dependencies that do not
        # match a rule are updated in individual pull requests") — 사람이 밴드를 확인할 자리가 생긴다.
        # 선례: 단독으로 온 #183(`9.6.1→9.7.0`)은 실제로 검토되어 기각됐다.
        # ⚠️ `ignore`로 막지 않는 이유: 래퍼 범프는 **밴드가 허용하는 한 정당하다**(rust-toolchain·
        # gh-action-pypi-publish 처럼 구조적으로 항상 틀리는 부류가 아니다). 막아버리면 Gradle의
        # 패치·보안 릴리스를 영영 듣지 못하게 되어, 보이는 결정 지점을 침묵과 맞바꾸는 것이 된다.
        # ⚠️ 격리는 단언을 대신하지 못한다 — 단독 PR은 사람이 **알아채야** 동작한다. 기계 쪽 백스톱은
        # `scripts/check-versions.mjs`의 래퍼↔KGP 밴드 검사이고, 그쪽이 `kgp=` 기록을 실제 KGP 선언과
        # 대조해 KGP가 움직이면 밴드 재확인을 강제한다. 둘은 서로를 대체하지 않는다.
        exclude-patterns: ['gradle-wrapper']
    ignore:
      # kotlin-stdlib 버전은 게시 아티팩트의 **소비자 하한**이다 — build.gradle.kts에서 KGP 자동주입을
      # 끄고(`kotlin.stdlib.default.dependency=false`) compilerOptions의 languageVersion/apiVersion
      # (=KOTLIN_2_2)에 맞춰 손수 선언한 값이라, 이것만 올라가면 메타데이터는 "Kotlin 2.2 가능"이라
      # 주장하면서 전이 stdlib는 2.4를 요구하는 상태로 조용히 갈라진다(2.2 소비자는 "newer Kotlin
      # compiler로 컴파일되어 읽을 수 없다"로 빌드 실패 — d6f1729가 고친 그 상태로 되돌아간다).
      # 패치(2.2.x)는 같은 언어버전 라인이라 받되, 마이너/메이저는 languageVersion과 함께 사람이
      # 올린다. 하한을 올릴 때 이 ignore도 함께 재검토한다. (PR #110 close 근거)
      - dependency-name: 'org.jetbrains.kotlin:kotlin-stdlib'
        update-types:
          ['version-update:semver-minor', 'version-update:semver-major']

  - package-ecosystem: pip # Python
    directory: /python
    schedule: { interval: weekly }
    groups:
      python-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm # Node
    directory: /node
    schedule: { interval: weekly }
    groups:
      node-minor-patch: { update-types: [minor, patch] }
    ignore:
      # @types/node는 "최신 Node"가 아니라 package.json의 engines 하한을 따라간다. 하한을 올리는 것은
      # 소비자 가시적 결정이라(CI 매트릭스·하네스 이미지·문서가 함께 움직인다) 사람이 판단해야 하며,
      # 타입 bump가 그 결정을 대신 끌고 가서는 안 된다. engines를 올릴 때 이 핀도 같이 올린다.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # vitest 4는 `vi.mock` 팩토리 시맨틱이 바뀌어(팩토리가 돌려주는 모킹 클래스를 더 이상 생성자로
      # 취급하지 않는다) client.test.ts·admin.test.ts의 클래스 모킹이 전부 깨진다 — 4.1.10에서 재측정한
      # 결과 29건 실패(PR #52·#90에서 동일 수치). 받으려면 두 파일의 vi.mock 팩토리를 v4 시맨틱으로
      # 이관하는 선행 작업이 필요하다. 그때 이 항목을 지운다.
      # ⚠️ **auth.test.ts 는 세지 말 것 — 「두 파일」이 맞다.** 그 파일의 유일한 `vi.mock(` 팩토리는
      # `discovery: vi.fn()` 류 **함수 목**이라 이 시맨틱 변경에 걸리지 않는다. 나머지 19건은
      # `vi.mocked(` 이고 `vi.mock` 이 그 부분문자열이라 `grep -c 'vi\.mock'` 이 20으로 부풀린다 —
      # 이 오독으로 「주석이 파일 하나를 빠뜨렸다」는 오탐이 실제로 제기됐다. 셀 때 `vi\.mock\(` 로 센다.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']

  - package-ecosystem: gomod # Go
    directory: /go
    schedule: { interval: weekly }
    groups:
      go-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: nuget # C#/.NET
    directory: /dotnet
    schedule: { interval: weekly }
    groups:
      dotnet-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: composer # PHP
    directory: /php
    schedule: { interval: weekly }
    groups:
      php-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: cargo # Rust
    directory: /rust
    schedule: { interval: weekly }
    groups:
      rust-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: bundler # Ruby
    directory: /ruby
    schedule: { interval: weekly }
    groups:
      ruby-minor-patch: { update-types: [minor, patch] }
    ignore:
      # parallel 2.x 는 `required_ruby_version >= 3.3` 인데 ruby-ci 매트릭스에는 **3.2** 가 있다.
      # 락을 3.4 에서 뜨면 2.x 가 들어오고 frozen 모드의 3.2 레그가 `bundle install` 에서 죽는다
      # (그래서 Gemfile 에 `gem "parallel", "< 2"`). dependabot 은 그 제약과 충돌하면 **스킵이 아니라
      # 에러**로 끝나 bundler 잡 전체가 주간으로 빨개진다(실측 job 1544357846: parallel /
      # dependency_file_not_resolvable). 여기서 막아 그 소음을 없앤다.
      # 지우는 조건: `required_ruby_version` 하한(gemspec `>= 3.2`)이 3.3 이상으로 올라가고
      # ruby-ci 매트릭스에서 3.2 가 빠질 때 — 그때 Gemfile 의 `< 2` 도 함께 지운다.
      - dependency-name: 'parallel'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-all: { patterns: ["*"] }
    ignore:
      # dtolnay/rust-toolchain은 **ref 이름이 곧 설치할 toolchain**이다(`@stable`·`@1.88`). 그래서
      # 우리 핀은 `stable` 브랜치의 헤드 SHA이고 `# stable` 주석이 그 의미를 보존한다. dependabot은
      # 이 주석을 semver 태그로만 해석해 브랜치 이름은 못 읽고 기본 브랜치(master) 헤드로 SHA를
      # 갈아끼우는데, master 커밋에는 toolchain을 고를 ref 이름이 없어 액션이 첫 스텝에서
      # `'toolchain' is a required input`으로 즉시 죽는다(PR #111에서 rust 잡 3종 동시 실패 실측).
      # 즉 이 액션의 자동 bump는 구조적으로 항상 틀린다 — `stable` 브랜치 헤드를 직접 확인해
      # 사람이 올린다(`gh api repos/dtolnay/rust-toolchain/branches/stable --jq .commit.sha`).
      # taiki-e/install-action도 ref가 설치대상을 고르지만 태그(`cargo-llvm-cov`·`cargo-audit`)라
      # dependabot이 애초에 손대지 않으므로 여기 넣지 않는다.
      - dependency-name: 'dtolnay/rust-toolchain'
      # pypa/gh-action-pypi-publish도 **ref가 브랜치**다(`# release/v1`) — rust-toolchain과 같은
      # 부류다. 다만 실패 방식이 다르다: 여기서 ref 이름은 액션의 입력이 아니라 **안정성 채널**이고,
      # 이 저장소의 기본 브랜치는 이름 그대로 `unstable/v1`이다. 즉 dependabot이 기본 브랜치 헤드로
      # 갈아끼우면 액션이 죽는 대신 **PyPI 게시가 unstable 채널로 조용히 넘어간다** — 훨씬 늦게,
      # 그리고 되돌릴 수 없는 자리(게시)에서 드러난다.
      #
      # ⚠️ **이것은 예방 조치이고, dependabot이 실제로 그렇게 한다고 실측하지 못했다.** 2026-08-08
      # 시점에 `release/v1` 헤드와 `unstable/v1` 헤드가 **같은 커밋**(dc37677)이라 PR #154가 제안한
      # SHA만으로는 어느 쪽을 따랐는지 구분되지 않는다. 근거는 (a) 같은 저장소에서 실측된
      # rust-toolchain 선례 (b) 두 브랜치가 갈리는 순간 손해가 비대칭이라는 점이다.
      # 올릴 때는 브랜치 헤드를 직접 확인한다:
      #   gh api repos/pypa/gh-action-pypi-publish/branches/release/v1 --jq .commit.sha
      - dependency-name: 'pypa/gh-action-pypi-publish'
