name: Python CI
on:
  push: { branches: [main], paths: ['python/**', '.github/workflows/python-ci.yml'] }
  pull_request: { branches: [main], paths: ['python/**', '.github/workflows/python-ci.yml'] }
  # 주간 레인 건강검진(환경 드리프트) — 근거는 .claude/rules/ci.md, 슬롯 표는 ci.yml 옆 주석.
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * 1'
# 최소권한: 이 워크플로의 잡은 소스를 읽고 빌드/검사만 한다(체크·코멘트·릴리스 쓰기 없음).
permissions:
  contents: read
jobs:
  test:
    name: Lint + unit test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      # ⚠️ 하한 레그가 취소되면 그날 하한 검증이 사라진다 — 근거는 node-ci.yml 주석.
      fail-fast: false
      # 3.14 는 현 최신 안정판. 하한 3.10 은 그대로 둔다 — 상류 EOL 이 가까워도 소비자를 자르지 않는다.
      matrix: { python: ['3.10', '3.11', '3.12', '3.13', '3.14'] }
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '${{ matrix.python }}' }
      # ⚠️ `--only-binary :all:` 는 **index 후보에만** 걸린다(pip FormatControl). `-e .` 는 로컬 경로
      #    요구라 finder 를 건너뛰고 PEP 660 으로 빌드되므로 둘은 충돌하지 않는다 — "editable 과 안
      #    맞는다"고 지우지 말 것. 막는 대상은 **다운로드된 서드파티 sdist** 의 setup.py 실행이고
      #    (sonar `githubactions:S8541`), 휠 없는 전이가 생기면 조용히 sdist 를 빌드하는 대신
      #    **fail-closed** 로 죽는다 — 그것이 의도다.
      #    실측(pip 26.1.2 · 빈 venv 에서 index 왕복): 39 패키지 전부 휠 해석 · exit 0.
      # ⚠️ **작은따옴표를 지우지 말 것** — `:all:` 뒤의 `: `(콜론+공백)이 YAML 평문 스칼라를 끊어
      #    `mapping values are not allowed here` 로 워크플로가 파싱조차 안 된다(실측). 블록
      #    스칼라(`run: |`) 안에서는 리터럴이라 인용이 필요 없다 — 그래서 두 형태가 섞여 있다.
      - run: 'python -m pip install --only-binary :all: -e ".[dev]"'
      - name: ruff (lint — 보안 S/bandit 포함 확장 룰셋)
        run: ruff check src tests examples
      - name: ruff (format check)
        run: ruff format --check src tests examples
      - name: pytest (unit + 커버리지 게이트 100%)
        run: pytest -m "not integration" --cov=keycloak_sdk   # 임계값은 pyproject [tool.coverage.report] fail_under=100
      - name: mypy (strict)
        run: mypy src
      - name: pip-audit (의존성 취약점 감사)
        # editable 로컬 패키지(keycloak-sdk, PyPI 미배포)는 감사 불가로 skip되고, pip-audit는
        # skip이 하나라도 있으면 종료코드 1(불완전 감사 신호)을 낸다(--skip-editable도 라벨만 바꿈).
        # 환경 대신 editable을 제외한 frozen requirements를 감사해 실 의존성만 커버한다.
        run: |
          python -m pip install --only-binary :all: pip-audit
          python -m pip freeze --exclude-editable > audit-reqs.txt
          pip-audit -r audit-reqs.txt

  integration:
    name: Integration tests (testcontainers, 실제 Keycloak)
    runs-on: ubuntu-latest   # ubuntu 러너는 Docker 내장 → testcontainers 동작
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.12' }
      - run: 'python -m pip install --only-binary :all: -e ".[dev]"'
      - name: pytest (integration, Docker)
        run: pytest -m integration

  api-compat:
    name: griffe (공개 API 파괴적 변경)
    runs-on: ubuntu-latest
    # ⚠️ **이 잡만 `working-directory: python` 을 쓰지 않는다.** griffe 는 기준선 태그를 임시
    # 워크트리로 꺼내고 `--search` 를 **그 워크트리 루트** 기준으로 해석한다 — `python` 안에서
    # 돌리며 `--search src` 를 주면 `<워크트리>/src` 를 뒤져 패키지를 못 찾는다(실측:
    # `ModuleNotFoundError: No module named 'keycloak_sdk'`). 양쪽 다 저장소 루트 기준이어야 맞다.
    # ⚠️ 1.0 은 「파괴적 변경 없이는 major 를 올리지 않는다」는 약속이고, 지킬 수단 없이 하는
    # 약속은 이 저장소가 거절하는 부류다(「기계만 셀 수 있다」). rust 의 cargo-semver-checks 와
    # 같은 자리다 — 기준선은 **직전 릴리스 태그**이고, 거기서 공개 시그니처가 사라지거나
    # 바뀌면 실패한다. ⚠️ griffe 는 아티팩트가 아니라 **git ref** 를 기준선으로 받으므로
    # `fetch-depth: 0` 이 필요하다(얕은 체크아웃이면 태그를 못 찾고 조용히 비교를 건너뛴다).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.12' }
      - run: 'python -m pip install --only-binary :all: griffe'
      - name: griffe check (직전 릴리스 태그 대비)
        run: griffe check keycloak_sdk --search python/src --against py-v1.0.1
