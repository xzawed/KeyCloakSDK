name: Python CI
on:
  push: { branches: [main], paths: ['python/**', '.github/workflows/python-ci.yml'] }
  pull_request: { branches: [main], paths: ['python/**', '.github/workflows/python-ci.yml'] }
jobs:
  test:
    name: Lint + unit test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ['3.10', '3.11', '3.12', '3.13'] }
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m pip install -e ".[dev]"
      - name: ruff (lint — 보안 S/bandit 포함 확장 룰셋)
        run: ruff check src tests examples
      - name: ruff (format check)
        run: ruff format --check src tests examples
      - name: pytest (unit + 커버리지 게이트 100%)
        run: pytest -m "not integration" --cov=keycloak_sdk   # 임계값은 pyproject [tool.coverage.report] fail_under=100
      - name: mypy (strict)
        run: mypy src

  integration:
    name: Integration tests (testcontainers, 실제 Keycloak)
    runs-on: ubuntu-latest   # ubuntu 러너는 Docker 내장 → testcontainers 동작
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -e ".[dev]"
      - name: pytest (integration, Docker)
        run: pytest -m integration
