name: rust-ci
on:
  push:
    paths: ['rust/**', '.github/workflows/rust-ci.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-ci.yml']
permissions:
  contents: read
jobs:
  build-test:
    name: Build + fmt + clippy + test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ['1.88', 'stable'] # 1.88 = MSRV(Cargo.toml rust-version, edition 2024 + let-chains 요구) · stable = 최신 회귀 확인
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ⚠️ dtolnay/rust-toolchain은 브랜치/태그 이름이 곧 기본 toolchain이다(`@master`는 toolchain
      # 입력을 요구하는 판, `@stable`은 stable 고정 판) — SHA는 그 **브랜치의 커밋**을 가리켜야
      # 의미가 보존된다. 뒤 주석의 ref 이름을 SHA와 함께 유지할 것.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: '${{ matrix.rust }}'
          components: clippy,rustfmt
      # `--locked`: 커밋된 rust/Cargo.lock을 그대로 쓰고, 락을 갱신해야만 하는 상태(매니페스트와
      # 어긋남)면 조용히 고쳐 쓰는 대신 실패한다 — 락을 커밋해 놓고 CI가 아무 데서도 강제하지
      # 않으면 재현성이 이름뿐이다. MSRV(1.88) 레그에도 붙인다: 락이 이미 있으면 cargo는 재해석을
      # 하지 않으므로 이 플래그가 컴파일되는 버전 집합을 바꾸지 않고("락을 고쳐야 하면 실패"만
      # 추가한다), lockfile v4는 cargo 1.78+가 읽는다 — MSRV 레그가 이 락을 못 쓰는 상황이 아니다.
      - run: cargo build --locked --all-targets
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  coverage:
    name: Coverage gate (logic modules ≥90% lines)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # taiki-e/install-action도 ref 이름이 설치 대상을 고른다(`@cargo-llvm-cov`/`@cargo-audit`) —
      # 해당 브랜치의 SHA로 핀하고 ref 이름을 주석으로 남긴다.
      - uses: taiki-e/install-action@face1f3efc4b60bb08e253dcbd8306cbc8487e68 # cargo-llvm-cov
      # 네트워크 경계(auth.rs/admin.rs/client.rs)는 통합테스트로 검증 → 커버리지 게이트에서 제외.
      - run: cargo llvm-cov --ignore-filename-regex '(auth|admin|client)\.rs' --fail-under-lines 90

  audit:
    name: cargo audit (의존성 취약점)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@3e67821ec5b3a2f80d412686dab9e9d496ea6a23 # cargo-audit
      # RUSTSEC-2023-0071(rsa "Marvin" 타이밍 사이드채널)은 dev-dependency rsa(테스트 키 생성
      # 전용)에 대한 것으로, 런타임(jsonwebtoken 공개키 서명검증만)에 영향 경로가 없다 —
      # 문서화된 예외로 무시한다(게차 참조).
      - run: cargo audit --ignore RUSTSEC-2023-0071

  integration:
    name: Integration (testcontainers, 실제 Keycloak 26.6)
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → testcontainers-rs 동작
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo test --locked --test integration_test -- --ignored
