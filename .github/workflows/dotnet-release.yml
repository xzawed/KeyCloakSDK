name: dotnet-release
on:
  push:
    tags: ['dotnet-v*']

# 최소권한: 워크플로 레벨 기본값을 두지 않고 **모든 잡이 자기 권한을 직접 선언**한다. 워크플로 레벨에
# `contents: read`를 두면 그 스코프를 실제로 쓰지 않는 잡까지 토큰에 읽기 권한을 갖기 때문이다
# (SonarQube `githubactions:S7637`. 이 저장소에서 그 규칙이 걸린 워크플로는 정확히 "체크아웃 없는 잡을
# 가진 넷" — java·dotnet·go·php — 이었다. 나머지 다섯은 모든 잡이 체크아웃해서 걸리지 않았다).
# ⚠️ 새 잡에는 반드시 `permissions:`를 함께 적을 것 — 빠뜨리면 워크플로 레벨 기본값이 아니라
# **저장소 기본 권한**(Settings → Actions)을 물려받는다. 그 값은 이 파일 바깥에서 바뀔 수 있다.
jobs:
  # 태그 접미사 = 릴리스 버전. 이 워크플로에서 버전을 유도하는 **유일한** 지점이다 — install-smoke와
  # pack이 각자 태그를 파싱하면 "게이트가 검증한 버전"과 "실제로 게시하는 버전"이 갈릴 수 있다.
  # ⚠️ dotnet에는 다른 언어 같은 태그↔매니페스트 가드가 없다. csproj가 `<Version>`을 선언하기는
  # 하지만 pack이 `-p:Version`으로 **덮어쓰므로**(아래 release 잡) 그 선언값은 게시 산출물에
  # 반영되지 않는다 — 즉 태그와 csproj가 어긋나도 이 워크플로 안에서는 아무도 알아채지 못한다
  # (언어 간 SSOT인 `scripts/check-versions.mjs`가 install-smoke 안에서 잡아주는 것이 전부다).
  # 그래서 install-smoke가 버전을 넘겨받지 못하면 그냥 실패하는 게 아니라 **조용히 다른 버전을
  # 검증하고 통과한다** — 하네스의 publish/dotnet.sh도 같은 `-p:Version` 덮어쓰기를 하기 때문이다.
  version:
    runs-on: ubuntu-latest
    # 태그 문자열만 파싱한다 — 체크아웃도 API 호출도 없어 토큰 스코프가 전혀 필요없다
    permissions: {}
    outputs:
      version: ${{ steps.derive.outputs.version }}
      # 프리릴리스 여부도 **버전과 같은 지점에서 한 번만** 유도한다. 릴리스 잡이 태그를 다시
      # 파싱하면 "게이트가 검증한 버전"과 "GitHub Release에 붙는 표시"가 갈릴 수 있다 —
      # 버전 스레딩과 정확히 같은 원칙이다(그리고 이 잡은 체크아웃이 없어 공유 스크립트를
      # 부를 수 없다 — `permissions: {}`를 지키려면 판정은 인라인이어야 한다).
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - id: derive
        name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#dotnet-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME}에서 'dotnet-v' 접두를 벗겨내지 못했다 — 버전 유도 불가(fail-closed)."
            exit 1
          fi
          # >>> prerelease-classify — 세 릴리스 워크플로(go·dotnet·php)가 **글자 그대로** 공유하는 블록이다.
          # scripts/test/test-release-prerelease.sh가 이 마커 사이를 떼어내 셋의 동일성을 대조하고 분류표를
          # 실행한다 — 한 곳만 고치면 자가테스트가 빨개진다.
          #
          # 접미사 목록을 박지 않는다. 아홉 언어의 표기가 서로 다르고(SemVer `0.1.0-rc.1` · Maven/Kotlin
          # `0.1.0-RC1`·`-SNAPSHOT` · PEP 440 `0.1.0rc1` · RubyGems `0.1.0.rc1` — DEPLOY.md §7) 목록은
          # 표기가 바뀌는 순간 **조용히** 틀린다. 대신 정식 릴리스의 모양을 정의하고 나머지를 판별한다:
          #   1) 빌드 메타데이터(`+…`)를 먼저 떼어낸다 — SemVer에서 `+` 뒤는 프리릴리스가 아니고
          #      `1.0.0+incompatible`은 **정식** go 모듈 버전이다. 정식이 프리릴리스로 오분류되는 경로는
          #      이것뿐이라, 이 한 줄이 곧 오탐 방지책이다(오탐은 이 커밋이 고치는 버그보다 나쁘다 —
          #      정식 0.1.0이 releases/latest에서 사라진다).
          #   2) 남은 것이 숫자와 점뿐이면(`0.1.0`·`1.0.0`·`0.10.0`·NuGet 4마디 `1.2.3.4`) 정식이다.
          #   3) 하이픈(SemVer 프리릴리스 구분자)이나 알파벳(PEP 440·RubyGems·Maven 표기)이 있으면
          #      프리릴리스다.
          #   4) 둘 다 아니면 판정하지 않고 **실패한다**. 모르는 표기를 정식으로 넘기면 RC가 저장소의
          #      Latest release가 되고(php-v0.1.0-rc.1에서 실제로 일어난 일), 프리릴리스로 넘기면 정식이
          #      숨는다. 어느 쪽으로도 추측하지 않는다.
          CORE="${VERSION%%+*}"
          case "$CORE" in
            '' | *[!0-9.]*) NUMERIC_ONLY=false ;;
            *) NUMERIC_ONLY=true ;;
          esac
          case "$CORE" in
            *-* | *[A-Za-z]*) HAS_MARKER=true ;;
            *) HAS_MARKER=false ;;
          esac
          if [ "$NUMERIC_ONLY" = true ]; then
            PRERELEASE=false
          elif [ "$HAS_MARKER" = true ]; then
            PRERELEASE=true
          else
            echo "::error::버전 '${VERSION}'을 정식(숫자 마디)으로도 프리릴리스(하이픈/알파벳)로도 판정할 수 없다 — GitHub Release 표시를 추측하지 않고 중단한다(fail-closed)."
            exit 1
          fi
          # <<< prerelease-classify
          echo "releasing Xzawed.Keycloak.Sdk ${VERSION} (from tag ${GITHUB_REF_NAME}) — prerelease=${PRERELEASE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  # 게시 직전 마지막 게이트 — 패키징된 산출물을 로컬 레지스트리에 올린 뒤 모노레포 바깥의 깨끗한
  # 컨테이너에서 설치해 quickstart를 돌린다. 소스 테스트가 통과해도 패키징 층(매니페스트 메타데이터·
  # 파일 포함규칙·게시 아티팩트 호환성)의 결함은 여기서만 드러난다 — 레지스트리에 태우기 전 마지막 기회다.
  install-smoke:
    needs: version
    # 호출되는 install-smoke.yml이 체크아웃한다. ⚠️ 재사용 워크플로를 부르는 잡에서 `permissions:`를
    # 생략하면 호출된 워크플로는 저장소 기본 권한을 상한으로 받는다(GitHub 문서: "If jobs.<job_id>.permissions
    # is not specified in the calling job, the called workflow will have the default permissions for the
    # GITHUB_TOKEN"). 즉 여기 한 줄이 곧 호출된 워크플로의 권한 상한이다.
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
    with:
      lang: dotnet
      version: ${{ needs.version.outputs.version }}

  # 발행 전 게이트(2): 단위테스트는 `Category!=Integration`이라 auth/admin 네트워크 경계를
  # 건드리지 않는다 — dotnet-ci.yml의 integration 잡과 동일한 실 Keycloak E2E를 태그 경로에서도 돌린다.
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 이 잡은 체크아웃만 필요(GitHub Release는 release 잡의 몫)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Integration tests (Docker)
        run: dotnet test dotnet/Keycloak.Sdk.sln -c Release --filter "Category=Integration"

  release:
    needs: [version, integration, install-smoke] # 통합 E2E + 게시 산출물 설치 스모크 통과 후에만 pack/push
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release create` — 이 잡만 쓰기가 필요하다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Verify (build + unit tests)
        run: |
          dotnet build dotnet/Keycloak.Sdk.sln -c Release
          dotnet test dotnet/Keycloak.Sdk.sln -c Release --filter "Category!=Integration"
      - name: Pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet pack dotnet/src/Xzawed.Keycloak.Sdk/Xzawed.Keycloak.Sdk.csproj -c Release -o artifacts -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
      # ⚠️ 시크릿 미설정은 "건너뛸 상황"이 아니라 실패다 — NUGET_API_KEY 없이 태그가 push되었다는 것은
      # 사람이 사전등록 전에 태그를 밀었다는 뜻이고, 그때 잡이 green으로 끝나면 게시되지 않은 버전이
      # 게시된 것처럼 보인다. 또한 `--skip-duplicate`는 이미 존재하는 버전에 대한 push를 성공으로
      # 위장해 "태워버린 버전"을 숨기므로 쓰지 않는다(중복이면 실패해야 사람이 알아챈다).
      - name: Publish to NuGet (human-gated; requires NUGET_API_KEY secret)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY 미설정 — 시크릿 사전등록 전에 dotnet-v 태그가 push되었다. 배포를 중단한다."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
      # ⚠️ `--prerelease`를 붙이지 않으면 GitHub은 RC를 저장소의 **Latest release**로 내건다
      # (php-v0.1.0-rc.1의 첫 실행에서 실제로 그랬다 — 파이프라인은 전부 green이었고 이것만 틀렸다).
      # 불리언은 `--prerelease=true|false`로 **명시**한다: 값이 비거나 오염되면 gh의 pflag가
      # `strconv.ParseBool` 오류로 즉사하므로, 판정이 깨졌을 때 조용히 "정식"으로 흘러가지 않는다.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --prerelease="${PRERELEASE}" --title "${GITHUB_REF_NAME}" --generate-notes
