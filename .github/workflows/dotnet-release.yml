name: dotnet-release
on:
  push:
    tags: ['dotnet-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify (build + unit tests)
        run: |
          dotnet build dotnet/Keycloak.Sdk.sln -c Release
          dotnet test dotnet/Keycloak.Sdk.sln -c Release --filter "Category!=Integration"
      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#dotnet-v}"
          dotnet pack dotnet/src/Xzawed.Keycloak.Sdk/Xzawed.Keycloak.Sdk.csproj -c Release -o artifacts -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true
      - name: Publish to NuGet (human-gated; requires NUGET_API_KEY secret)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "NUGET_API_KEY not set — skipping NuGet publish (human-gated)"; exit 0; fi
          dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --title "${GITHUB_REF_NAME}" --generate-notes
