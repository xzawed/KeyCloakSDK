name: sonarcloud
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate new-code / blame attribution

      # --- Kotlin 커버리지 리포트를 스캔 전에 생성한다(Kover→JaCoCo XML) ---
      # koverXmlReport는 Docker-free 단위 `test`만 트리거한다(integrationTest는 disabledForTestTasks로 계측
      # 제외됨) → Docker 불필요. 스캔 스텝은 반드시 이 뒤에 와야 한다(스캐너가 이미 존재하는 리포트를 읽음).
      # 단위테스트 실패 시 이 스텝이 실패해 스캔이 안 돌고 stale 리포트도 안 올라간다(fail-closed, 의도).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate Kotlin Kover XML coverage
        working-directory: kotlin
        run: ./gradlew koverXmlReport

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
