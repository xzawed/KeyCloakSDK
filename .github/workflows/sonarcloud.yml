name: sonarcloud
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Dependabot이 트리거한 run에는 Actions 시크릿이 노출되지 않는다(별도 Dependabot 시크릿 스토어만
    # 보이며, 이 저장소의 그 스토어는 비어 있다). SONAR_TOKEN이 빈 문자열로 보간되어 스캐너가
    # "Not authorized or project not found" + exit 3으로 **반드시** 실패한다 — 코드 신호가 아니라
    # 환경 산물이므로 Dependabot PR에서는 스캔을 건너뛴다.
    # 토큰을 Dependabot 시크릿 스토어에 복제하는 방안은 기각했다: 이 잡은 PR head에서 npm ci ·
    # composer install · bundle install · pip install -e · mvn verify · gradlew를 실행하므로,
    # 방금 bump된 미검토 패키지의 임의 코드가 토큰과 같은 잡에서 돌게 된다.
    # push 이벤트는 첫 논리항에서 항상 참이라 main 스캔은 구조적으로 스킵될 수 없다(PR0 fail-closed 유지).
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history for accurate new-code / blame attribution

      # --- 언어별 커버리지 리포트를 스캔 전에 생성한다(Docker-free 단위테스트만) ---
      # 스캔 스텝은 반드시 이 뒤에 온다(스캐너가 이미 존재하는 리포트를 읽음). 각 생성 스텝이 실패하면
      # 스캔이 안 돌고 stale 리포트도 안 올라간다(fail-closed, 의도). 경로/제외는 sonar-project.properties.
      # php(phpunit clover, pcov) · ruby(simplecov-lcov) · rust(cargo llvm-cov lcov)도 배선됨.
      # dotnet(C#)만 전용 SonarScanner for .NET이 필요해 커버리지 미배선(properties에서 소스 제외).

      # Kotlin(Kover→JaCoCo XML) + Java(JaCoCo, 4 리액터 모듈)
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Generate Kotlin Kover XML coverage
        working-directory: kotlin
        run: ./gradlew koverXmlReport
      - name: Generate Java JaCoCo XML coverage (단위, -DskipITs)
        run: mvn -B -f java/pom.xml verify -DskipITs=true

      # Node(vitest v8 → lcov). vitest lcov의 SF 경로는 node/ 기준 상대라 SonarCloud(루트 baseDir)가
      # 못 찾는다 → `node/` 접두를 붙여 루트 기준으로 정규화한다(모노레포 lcov 경로 정합).
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Generate Node lcov coverage
        working-directory: node
        run: |
          npm ci
          npm run test:unit
          sed -i 's|^SF:|SF:node/|' coverage/lcov.info

      # Python(pytest-cov → Cobertura XML)
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Generate Python coverage XML
        working-directory: python
        run: |
          python -m pip install -e ".[dev]"
          pytest -m "not integration" --cov=keycloak_sdk --cov-report=xml

      # Go(go test -coverprofile)
      - name: Set up Go 1.26
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - name: Generate Go coverage profile
        working-directory: go
        run: go test ./... -coverprofile=cover.out

      # PHP(phpunit → Clover XML, pcov 드라이버). 경계파일은 phpunit.xml source-exclude로 이미 빠짐.
      - name: Set up PHP 8.3 (pcov)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: pcov
      - name: Generate PHP clover coverage
        working-directory: php
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpunit --testsuite unit --coverage-clover clover.xml

      # Ruby(simplecov_json_formatter → coverage/coverage.json; Sonar SimpleCovSensor가 파싱).
      # JSON은 절대경로를 담고 SonarQube가 baseDir 하위로 해석하므로 경로 정규화 불필요(lcov와 차이).
      - name: Set up Ruby 3.4
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby
      - name: Generate Ruby JSON coverage
        working-directory: ruby
        run: bundle exec rspec

      # Rust(cargo llvm-cov → lcov). rust-ci.yml의 `coverage` 잡과 **동일한 툴·동일한 제외 정규식**을
      # 쓴다 — 라인 게이트(`--fail-under-lines 90`)는 그 잡이 이미 강제하므로 여기선 리포트 생성만 한다.
      # ⚠️ dtolnay/rust-toolchain·taiki-e/install-action은 ref 이름이 곧 toolchain/설치대상이라 SHA가
      # 그 브랜치의 커밋이어야 의미가 보존된다 — rust-ci.yml과 같은 SHA·같은 ref 주석을 유지할 것.
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@face1f3efc4b60bb08e253dcbd8306cbc8487e68 # cargo-llvm-cov
      - name: Generate Rust lcov coverage
        working-directory: rust
        run: |
          cargo llvm-cov --ignore-filename-regex '(auth|admin|client)\.rs' --lcov --output-path lcov.info
          # llvm-cov는 SF에 절대경로를 쓰고 그 경로는 baseDir 하위 실파일이라 SonarQube가 그대로
          # 해석한다(ruby JSON과 동일) → 그 판에서 아래 sed는 no-op다. 크레이트 루트 기준 상대경로
          # (`src/...`)로 나오는 판이면 Node lcov와 같이 `rust/` 접두를 붙여 루트 기준으로 만든다.
          # 이미 `/` 또는 `rust/`로 시작하는 SF는 건드리지 않는다(중복 접두 방지 — 멱등).
          sed -i '/^SF:\(\/\|rust\/\)/!s|^SF:|SF:rust/|' lcov.info

      # ⚠️ `sonar.qualitygate.wait`가 없으면 이 잡은 **품질 게이트가 빨개도 구조적으로 절대
      # 실패하지 않는다** — 스캐너는 리포트를 업로드하고 판정을 기다리지 않은 채 `EXECUTION SUCCESS`
      # 로 끝난다. 실제 결과: main의 게이트가 2026-07-07부터 08-11까지 **100커밋 이상 연속 실패**
      # 했는데 아무도 보지 못했다(Actions 잡은 초록이고, required 체크도 아니라 아무것도 막지
      # 않았다 — 이슈 #165). 두 체크가 서로 다른 말을 하고 있었다:
      #   `SonarCloud`(github-actions) = success · `SonarCloud Code Analysis`(sonarqubecloud) = failure
      # 이제 스캐너가 서버 판정까지 기다리고, 게이트가 빨가면 이 잡도 빨개진다.
      #
      # 저장소를 잠그지 않는다: required 체크는 `doc-facts`·`shell-exec-bits` 둘뿐이고 여기에
      # 언어 CI·스캔 잡을 넣으면 안 된다(.claude/rules/ci.md — `paths:` 필터 잡은 체크가 생성조차
      # 되지 않아 Pending 영구 차단). 이 잡은 신호를 **보이게** 만들 뿐 머지를 막지 않는다.
      # Dependabot PR은 위 `if:`로 애초에 스킵된다(시크릿 미노출 → 스캔은 반드시 실패한다).
      # 대기 타임아웃은 스캐너 기본값 300초를 쓴다 — 서버측 백그라운드 태스크가 그보다 오래 걸리면
      # 통과가 아니라 **실패**로 끝난다(fail-closed).
      # ⚠️ `sonar.java.libraries`는 **여기에만** 둘 수 있다 — 값이 러너의 절대경로라
      # `sonar-project.properties`(이식 가능해야 한다)에 박으면 안 된다. `sonar.java.binaries`를
      # 넣은 뒤에도(#300) 남은 WARN 둘이 이것 때문이다:
      #   "Unresolved imports/types have been detected during analysis."
      #   "Use of preview features have been detected during analysis."
      # 둘은 **같은 밀리초에 같은 분석기**가 냈고, 이 리포는 `--enable-preview`를 쓰지 않으며
      # 스캐너 스스로 `enablePreview: false`라고 찍는다 — 즉 후자는 타입을 못 푼 데서 온 오탐이라는
      # 가설이고, 이 스텝이 그 실험이다(둘 다 사라지면 뿌리가 하나였다는 뜻).
      # ⚠️ 첫 판은 `$HOME/.m2/repository/**/*.jar` 와일드카드였다. **엉성한 계측기였다** —
      # m2 에는 Maven 플러그인들이 끌어온 같은 아티팩트의 여러 버전이 함께 산다(로컬 실측:
      # commons-io 8개 · plexus-utils 6개 · commons-lang3 5개 · asm 5개). 타입 해석을 그중
      # 아무 버전에나 붙일 수 있는 클래스패스는 "상위집합이라 무방"하지 않다.
      # 리액터가 실제로 쓰는 compile 스코프 의존만 뽑아 준다. 빈 값이면 정밀도만 조용히
      # 떨어지므로 여기서 죽인다(fail-closed).
      - name: Build Java dependency classpath for Sonar
        run: |
          mvn -B -q -f java/pom.xml dependency:build-classpath \
            -Dmdep.outputFile=target/sonar-cp.txt -Dmdep.includeScope=compile
          LIBS="$(cat java/*/target/sonar-cp.txt 2>/dev/null | tr ':' '\n' | grep -E '\.jar$' | sort -u | paste -sd, -)"
          [ -n "$LIBS" ] || { echo "::error::sonar.java.libraries 가 비었다 — 클래스패스 산출 실패"; exit 1; }
          echo "Java libraries for Sonar: $(printf '%s' "$LIBS" | tr ',' '\n' | wc -l) jars"
          echo "SONAR_JAVA_LIBS=$LIBS" >> "$GITHUB_ENV"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.java.libraries=${{ env.SONAR_JAVA_LIBS }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
