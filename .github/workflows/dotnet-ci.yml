name: dotnet-ci
on:
  # `scripts/integration-coverage.*` — integration 잡의 리포트가 그 둘로 돈다. 리포트 로직·핀만 고친 PR 에서도
  # 실제 데이터로 재야 한다(자가테스트는 픽스처만 본다 — 통합 리포트를 붙인 다른 레인과 같다).
  push:
    branches: [main]
    paths: ['dotnet/**', '.github/workflows/dotnet-ci.yml', 'scripts/check-hp-attest.mjs', 'scripts/check-canaries-ran.mjs', 'scripts/test/test-lane-canaries.sh', 'scripts/test/test-security-defaults.sh', 'scripts/check-rendered-docs-hangul.mjs', 'scripts/integration-coverage.mjs', 'scripts/integration-coverage.json', 'scripts/check-dotnet-vulnerable.mjs', 'scripts/dotnet-tfms.mjs', 'scripts/lib/dotnet-tfm.mjs']
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet-ci.yml', 'scripts/check-hp-attest.mjs', 'scripts/check-canaries-ran.mjs', 'scripts/test/test-lane-canaries.sh', 'scripts/test/test-security-defaults.sh', 'scripts/check-rendered-docs-hangul.mjs', 'scripts/integration-coverage.mjs', 'scripts/integration-coverage.json', 'scripts/check-dotnet-vulnerable.mjs', 'scripts/dotnet-tfms.mjs', 'scripts/lib/dotnet-tfm.mjs']
  # 주간 레인 건강검진(환경 드리프트) — 근거는 .claude/rules/ci.md, 슬롯 표는 ci.yml 옆 주석.
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 1'
permissions:
  contents: read
jobs:
  # 대상 목록의 원천은 `dotnet/Directory.Build.props` 하나다 — 레그를 여기 다시 적지 않는다(대상을 늘리고 레그를 잊으면
  # 그 대상은 시험 없이 게시된다). 읽는 규칙은 scripts/lib/dotnet-tfm.mjs(check-docs 의 하한 · doctor 의 요구 SDK 와 같다).
  tfms:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: read
        run: |
          list=$(node scripts/dotnet-tfms.mjs)
          echo "list=$list" >> "$GITHUB_OUTPUT"
  build-test:
    needs: tfms
    runs-on: ubuntu-latest
    strategy:
      # 대상(TFM)마다 레그 하나. 레그마다 같은 SDK 로 **두 대상을 다** 빌드하고(아래 pack 의 Package Validation 이 두 대상을
      # 함께 본다) 그 레그의 대상 시험만 돈다(`-f`) — 시험 실행 하나에 trx · attest · 커버리지가 하나씩이라는 아래 세 단계의
      # 전제를 지킨다(한 잡에서 두 대상을 돌리면 canaries.trx 이름 · attest 가 겹치고 커버리지 합이 두 대상을 섞는다).
      # ⚠️ 가장 낮은 대상(net8.0) 레그가 소비자 하한이 실제로 도는지 보는 유일한 자리다.
      # `AnalysisLevel 8.0` 이 분석기 밴드를 고정해 warnaserror 가 SDK 판올림으로 흔들리지 않는다(Directory.Build.props 주석).
      fail-fast: false
      matrix:
        tfm: ${{ fromJSON(needs.tfms.outputs.list) }}
    name: build + test (${{ matrix.tfm }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # SDK 10 이 두 대상을 빌드한다(SDK 8 은 net10.0 을 복원조차 못 한다 — NETSDK1045). 8.0.x 는 net8.0 시험이 도는
          # .NET 8 런타임을 함께 깔려고 둔다 — SDK 10 만 깔면 테스트 호스트가 `Microsoft.NETCore.App 8.0` 을 못 찾아 죽는다.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore dotnet/Keycloak.Sdk.sln
      - name: Build (warnaserror)
        run: dotnet build dotnet/Keycloak.Sdk.sln --no-restore -c Release
      # 그려지는 문서(패키지에 실려 IDE 호버에 뜨는 XML 문서 파일 — Directory.Build.props 의 GenerateDocumentationFile)에
      # 한글 0 — 등록부 korean-api-docs-in-published-packages. TFM 마다 하나씩 모은다(파일이 없으면 cp 가 실패한다).
      - name: 그려지는 문서(XML 문서 파일) 한글 0
        run: |
          mkdir -p "$RUNNER_TEMP/xmldoc"
          for f in dotnet/src/Xzawed.Keycloak.Sdk/bin/Release/*/Xzawed.Keycloak.Sdk.xml; do
            cp "$f" "$RUNNER_TEMP/xmldoc/$(basename "$(dirname "$f")").xml"
          done
          node scripts/check-rendered-docs-hangul.mjs "$RUNNER_TEMP/xmldoc" --ext=.xml --min-files=1
      - name: Format check
        run: dotnet format dotnet/Keycloak.Sdk.sln --verify-no-changes
      # ⚠️ 커버리지는 coverlet **컬렉터**로 수집한다(msbuild 통합 `/p:CollectCoverage`가 아니다).
      # msbuild 통합은 히트를 테스트 호스트의 AppDomain.ProcessExit 핸들러에서 flush하는데, VSTest가
      # 호스트 종료를 짧게만 기다려서 종료가 느린 실행에서는 hits 파일이 남지 않는다. 그러면 coverlet은
      # 분모(계측된 라인)를 그대로 둔 채 분자만 0으로 리포트하고, 내장 임계값 게이트가 그것을
      # "The minimum line coverage is below the specified 90"이라고 보고한다 — 진짜 하락과 문구가
      # 같아 구분이 불가능하다. run 30676360497이 이 문구로 실패했는데 같은 커밋 재실행은 96.68%로
      # 통과했다(로컬 45회는 무재현 — CI 러너 종료 타이밍에만 걸리는 경로였다).
      # 컬렉터는 테스트 호스트 안에서 VSTest의 SessionEnd 콜백에 flush하므로 이 경로가 아예 없다.
      # 제외 필터는 dotnet/coverlet.runsettings로 옮겼다(문법 동일, 측정 수치 무변경을 실측 확인:
      # 두 방식 모두 lines 175/181 · branches 45/50).
      - name: Unit tests + coverage
        # attest — 적대 경로 행렬은 마지막 Assert 뒤에만 $HP_ATTEST_DIR/dotnet.json 을 쓴다(근거: ci.yml 의 같은 단계).
        env:
          HP_ATTEST_DIR: ${{ runner.temp }}/hp-attest
          HP_ATTEST_NONCE: ${{ github.run_id }}.${{ github.run_attempt }}.${{ github.job }}.${{ strategy.job-index }}
        # trx 는 아래 카나리아 단계가 읽는다(--results-directory 아래 canaries.trx). `-f` 가 이 레그의 대상 하나만 돌린다.
        run: >
          dotnet test dotnet/Keycloak.Sdk.sln --no-build -c Release -f ${{ matrix.tfm }}
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --settings dotnet/coverlet.runsettings
          --logger "trx;LogFileName=canaries.trx"
          --results-directory ${{ runner.temp }}/coverage
      - name: 적대 경로 행렬 attest — 이 실행에서 돌았는가(scripts/check-hp-attest.mjs)
        env:
          HP_ATTEST_DIR: ${{ runner.temp }}/hp-attest
          HP_ATTEST_NONCE: ${{ github.run_id }}.${{ github.run_attempt }}.${{ github.job }}.${{ strategy.job-index }}
        run: node scripts/check-hp-attest.mjs "$HP_ATTEST_DIR" --nonce "$HP_ATTEST_NONCE" --lang dotnet
      # 보안 카나리아가 이 실행에서 돌아 통과했는가(근거: ci.yml 의 같은 단계).
      - name: 보안 카나리아 — 이 실행에서 돌아 통과했는가(scripts/check-canaries-ran.mjs)
        run: node scripts/check-canaries-ran.mjs --lang dotnet --report "$RUNNER_TEMP/coverage/canaries.trx"
      # 임계값 비교 **전에** 측정이 실제로 일어났는지부터 판정한다 — 분모는 있는데 히트가 0인 실행은
      # 커버리지 하락이 아니라 측정 실패이고, 그 둘을 다른 문구로 보고해야 사람이 헛수고하지 않는다.
      - name: Coverage gate
        run: node scripts/check-coverage.mjs "${{ runner.temp }}/coverage" --min-line 90 --min-branch 85
      - name: 취약 패키지 감사 (배포 SDK 프로젝트)
        # 배포되는 SDK 프로젝트의 (전이 포함) 취약 패키지만 게이트한다 — 테스트 전용 의존성
        # (예: WireMock 경유 Scriban Moderate)은 배포물이 아니라 감사 대상에서 제외.
        # ⚠️ 판정은 JSON 으로 한다 — 텍스트 grep 은 대상이 여럿이면 깨끗한 대상의 줄에 걸려 취약 보고서를 통과시킨다
        # (실측 · 종료코드 0/1/2: scripts/check-dotnet-vulnerable.mjs 머리). `dotnet list` 의 종료코드는 판정 뒤에 따로 본다.
        run: |
          f="$RUNNER_TEMP/dotnet-vulnerable.json"
          rc=0
          dotnet list dotnet/src/Xzawed.Keycloak.Sdk/Xzawed.Keycloak.Sdk.csproj package --vulnerable --include-transitive --format json > "$f" || rc=$?
          cat "$f"
          node scripts/check-dotnet-vulnerable.mjs "$f"
          test "$rc" -eq 0 || { echo "::error::dotnet list exited $rc"; exit 1; }
      # ⚠️ **공개 API 파괴적 변경 게이트.** SDK 내장 Package Validation 이 `dotnet pack` 시점에
      # NuGet 의 기준선 패키지(`PackageValidationBaselineVersion`)를 받아 공개 표면을 대조한다 —
      # 별도 도구(ApiCompat CLI)를 들이지 않는다. rust `cargo-semver-checks` · python `griffe` ·
      # go `gorelease` 와 같은 자리이고, 1.0 의 「파괴적 변경 없이는 major 를 올리지 않는다」를
      # 지킬 수단이다. ⚠️ **`pack` 없이는 이 검증이 돌지 않는다** — `dotnet test` 만으로는 조용히
      # 건너뛴다. 그래서 이 스텝이 필요하다.
      # 실측(변이 3요건): `JwtValidatorOptions.ClockSkewSeconds` 를 public → internal 로 바꾸면
      # `error CP0002 … API 중단 변경` 으로 실패하고(exit 1), 되돌리면 오류 0 · exit 0 이다.
      # 대조: **internal 멤버 변경은 통과**한다 — 공개 표면만 본다는 증거.
      - name: 공개 API 파괴적 변경 (Package Validation, 기준선 = 직전 게시본)
        run: dotnet pack dotnet/src/Xzawed.Keycloak.Sdk/Xzawed.Keycloak.Sdk.csproj -c Release
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # build-test 와 같다 — SDK 10 이 두 대상을 빌드하고, net8.0 통합은 SDK 8 이 함께 까는 .NET 8 런타임에서 돈다.
          dotnet-version: |
            8.0.x
            10.0.x
      # 같은 해 · 구성 · 필터(`--filter "Category=Integration"`)에 경계 커버리지만 더한다. 명령(거르지 않는 json 컬렉터 설정 · trx ·
      # 경계 파일 sha1 기록)은 `scripts/integration-coverage.mjs` 의 run 이 소유한다 — 로컬(`node scripts/integration-coverage.mjs
      # dotnet`)과 CI 가 같은 명령을 쓰게 여기 다시 적지 않는다. 종료코드는 테스트의 것이다. 대상이 여럿이면 run 이 **가장 낮은
      # 대상 하나**만 돈다(첨부 하나 — 그 run 의 주석).
      - name: Integration tests (Docker) + 경계 커버리지 수집 — 가장 낮은 대상
        run: node scripts/integration-coverage.mjs run dotnet --out "$RUNNER_TEMP/integration-coverage"
      # 나머지 대상의 통합은 커버리지 없이 돈다. 목록은 레그 매트릭스와 같은 원천(scripts/dotnet-tfms.mjs)에서 받는다 — ⚠️ 대입으로
      # 받는 것이 요점이다: `for t in $(…)` 에 바로 넣으면 그 명령이 실패해도 빈 목록으로 돌아 초록이 된다.
      # ⚠️ `TreatNoTestsAsError` — `--filter` 에 맞는 시험이 0 개여도 `dotnet test` 는 0 으로 끝난다(실측: 없는 Category 로
      # 0, 이 설정으로 1). 가장 낮은 대상은 report 가 「시험 0 개 실행」을 거부하지만 이 단계에는 그런 판정이 없다.
      - name: Integration tests (Docker) — 나머지 대상
        run: |
          rest=$(node scripts/dotnet-tfms.mjs | jq -r '.[1:][]')
          for tfm in $rest; do
            echo "::group::integration — $tfm"
            dotnet test dotnet/Keycloak.Sdk.sln -c Release -f "$tfm" --filter "Category=Integration" -- RunConfiguration.TreatNoTestsAsError=true
            echo "::endgroup::"
          done
      # ⚠️ 하한 — 값은 `scripts/integration-coverage.json` 의 `floor` 에만 둔다(등록부 `integration-coverage-never-measured`
      # 4 걸음째). exit 3(하한 아래)과 exit 2(무결성 실패 — 무엇이 그런지는 `scripts/integration-coverage.mjs` 머리의
      # 종료코드 표가 소유한다)가 잡을 실패시킨다. exit 1(소유 문제 — 같은 표)은 경고다.
      - name: 통합 전용 경계 커버리지 — 하한(scripts/integration-coverage.json 의 floor)
        run: |
          rc=0
          node scripts/integration-coverage.mjs report dotnet --out "$RUNNER_TEMP/integration-coverage" || rc=$?
          if [ "$rc" -eq 1 ]; then echo "::warning::통합 전용 커버리지의 소유 문제 — 위 DRIFT 줄(경고 — 게이트가 아니다)"; fi
          if [ "$rc" -eq 3 ]; then echo "::error::통합 전용 경계 커버리지가 하한 아래 — 위 BELOW 줄"; fi
          [ "$rc" -le 1 ]
