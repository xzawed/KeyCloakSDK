name: dotnet-ci
on:
  push:
    paths: ['dotnet/**', '.github/workflows/dotnet-ci.yml']
  pull_request:
    paths: ['dotnet/**', '.github/workflows/dotnet-ci.yml']
  # 주간 레인 건강검진(환경 드리프트) — 근거는 .claude/rules/ci.md, 슬롯 표는 ci.yml 옆 주석.
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * 1'
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      # ⚠️ 이 레인에는 매트릭스가 **없었다** — SDK 8.0.x 하나로만 돌아서, net8.0 패키지를
      # .NET 10(현 LTS) 런타임에서 소비하는 사용자가 검증 0 이었다.
      # TFM(`Directory.Build.props` 의 net8.0)은 **건드리지 않는다** — 소비자 하한은 그대로이고
      # 여기서 넓히는 것은 「어떤 SDK 로 빌드·테스트해도 통과하는가」다.
      # `AnalysisLevel 8.0` 이 분석기 밴드를 이미 고정해 두어 warnaserror 가 SDK 판올림으로
      # 흔들리지 않는다(Directory.Build.props 주석이 그 의도를 명시한다).
      fail-fast: false
      matrix:
        dotnet: ['8.0.x', '10.0.x']
    name: build + test (.NET SDK ${{ matrix.dotnet }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # net8.0 타깃을 빌드·실행하려면 8.0 런타임이 필요하다 — SDK 10 만 깔면 테스트 호스트가
          # `Microsoft.NETCore.App 8.0` 을 못 찾아 죽는다(조사 중 실측된 실패 모드).
          dotnet-version: |
            8.0.x
            ${{ matrix.dotnet }}
      - name: Restore
        run: dotnet restore dotnet/Keycloak.Sdk.sln
      - name: Build (warnaserror)
        run: dotnet build dotnet/Keycloak.Sdk.sln --no-restore -c Release
      - name: Format check
        run: dotnet format dotnet/Keycloak.Sdk.sln --verify-no-changes
      # ⚠️ 커버리지는 coverlet **컬렉터**로 수집한다(msbuild 통합 `/p:CollectCoverage`가 아니다).
      # msbuild 통합은 히트를 테스트 호스트의 AppDomain.ProcessExit 핸들러에서 flush하는데, VSTest가
      # 호스트 종료를 짧게만 기다려서 종료가 느린 실행에서는 hits 파일이 남지 않는다. 그러면 coverlet은
      # 분모(계측된 라인)를 그대로 둔 채 분자만 0으로 리포트하고, 내장 임계값 게이트가 그것을
      # "The minimum line coverage is below the specified 90"이라고 보고한다 — 진짜 하락과 문구가
      # 같아 구분이 불가능하다. run 30676360497이 이 문구로 실패했는데 같은 커밋 재실행은 96.68%로
      # 통과했다(로컬 45회는 무재현 — CI 러너 종료 타이밍에만 걸리는 경로였다).
      # 컬렉터는 테스트 호스트 안에서 VSTest의 SessionEnd 콜백에 flush하므로 이 경로가 아예 없다.
      # 제외 필터는 dotnet/coverlet.runsettings로 옮겼다(문법 동일, 측정 수치 무변경을 실측 확인:
      # 두 방식 모두 lines 175/181 · branches 45/50).
      - name: Unit tests + coverage
        run: >
          dotnet test dotnet/Keycloak.Sdk.sln --no-build -c Release
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --settings dotnet/coverlet.runsettings
          --results-directory ${{ runner.temp }}/coverage
      # 임계값 비교 **전에** 측정이 실제로 일어났는지부터 판정한다 — 분모는 있는데 히트가 0인 실행은
      # 커버리지 하락이 아니라 측정 실패이고, 그 둘을 다른 문구로 보고해야 사람이 헛수고하지 않는다.
      - name: Coverage gate
        run: node scripts/check-coverage.mjs "${{ runner.temp }}/coverage" --min-line 90 --min-branch 85
      - name: 취약 패키지 감사 (배포 SDK 프로젝트)
        # 배포되는 SDK 프로젝트의 (전이 포함) 취약 패키지만 게이트한다 — 테스트 전용 의존성
        # (예: WireMock 경유 Scriban Moderate)은 배포물이 아니라 감사 대상에서 제외.
        run: |
          report=$(dotnet list dotnet/src/Xzawed.Keycloak.Sdk/Xzawed.Keycloak.Sdk.csproj package --vulnerable --include-transitive 2>&1)
          echo "$report"
          echo "$report" | grep -qi "no vulnerable packages" || { echo "::error::vulnerable packages in shipped SDK"; exit 1; }
      # ⚠️ **공개 API 파괴적 변경 게이트.** SDK 내장 Package Validation 이 `dotnet pack` 시점에
      # NuGet 의 기준선 패키지(`PackageValidationBaselineVersion`)를 받아 공개 표면을 대조한다 —
      # 별도 도구(ApiCompat CLI)를 들이지 않는다. rust `cargo-semver-checks` · python `griffe` ·
      # go `gorelease` 와 같은 자리이고, 1.0 의 「파괴적 변경 없이는 major 를 올리지 않는다」를
      # 지킬 수단이다. ⚠️ **`pack` 없이는 이 검증이 돌지 않는다** — `dotnet test` 만으로는 조용히
      # 건너뛴다. 그래서 이 스텝이 필요하다.
      # 실측(변이 3요건): `JwtValidatorOptions.ClockSkewSeconds` 를 public → internal 로 바꾸면
      # `error CP0002 … API 중단 변경` 으로 실패하고(exit 1), 되돌리면 오류 0 · exit 0 이다.
      # 대조: **internal 멤버 변경은 통과**한다 — 공개 표면만 본다는 증거.
      - name: 공개 API 파괴적 변경 (Package Validation, 기준선 = 직전 게시본)
        run: dotnet pack dotnet/src/Xzawed.Keycloak.Sdk/Xzawed.Keycloak.Sdk.csproj -c Release
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Integration tests (Docker)
        run: dotnet test dotnet/Keycloak.Sdk.sln -c Release --filter "Category=Integration"
