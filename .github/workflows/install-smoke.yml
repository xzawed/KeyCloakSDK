name: install-smoke

# 게시 **직전** 게이트: 모노레포 소스가 아니라 **패키징된 산출물**이 실제로 설치되고 동작하는지 본다.
#
# 왜 별도 게이트인가 — 단위·통합 테스트는 소스 트리 안에서 돈다. 그래서 매니페스트 메타데이터,
# 파일 포함/제외 규칙, 게시 아티팩트의 바이너리 호환성처럼 "패키징 층"에서만 드러나는 결함은
# 전부 통과시킨다. Kotlin의 게시 메타데이터 사고가 정확히 그 층이었다(languageVersion 미설정으로
# 소비자 하한이 갈라진 건). 이 워크플로는 로컬 레지스트리에 실제로 게시한 뒤 **모노레포 바깥의
# 깨끗한 컨테이너**에서 설치해 quickstart를 돌린다 — 레지스트리에 태우기 전에 잡을 마지막 기회다.
#
# 구현은 이미 야간 CI에서 검증된 것을 그대로 재사용한다(`harness.yml`의 install-all 잡과 동일한
# 레시피: checkout + setup-node + install-verify.sh). 언어 하나만 넘기면 그 언어만 돈다.
# `install-verify.sh`는 마지막에 `--strict`로 매트릭스를 판정해 ✗가 하나라도 있으면 exit 1이다.
#
# ⚠️ Docker 이미지 빌드가 포함돼 느리다. 릴리스 경로에서만 쓰고 PR에는 걸지 않는다.

on:
  workflow_call:
    inputs:
      lang:
        description: '검증할 언어 하나 (go|dotnet|node|python|java|php|rust|ruby|kotlin)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-smoke:
    name: Install smoke (게시 산출물을 깨끗한 환경에서 설치·실행)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22' }
      # 언어 간 버전 SSOT. 각 릴리스 워크플로의 태그↔매니페스트 가드는 **자기 언어만** 본다 —
      # python만 올리고 node를 두면 어떤 게이트도 잡지 못한 채 태그가 밀린다. `check-versions.mjs`가
      # 그걸 잡지만 지금까지 `repo-hygiene.yml`(머지 게이트)에서만 돌았고, 태그는 임의 커밋에
      # 붙일 수 있으므로 릴리스 경로에는 이 검사가 없었다.
      # ⚠️ 아홉 릴리스 워크플로에 각각 넣지 않고 여기 한 곳에 두는 이유: 아홉 전부가 이 워크플로를
      # `needs:`로 부르므로 한 번의 편집이 아홉을 게이트한다(9곳 복제는 곧 9곳 드리프트다).
      # ⚠️ 이 가드는 **기저 X.Y.Z 일치**만 요구한다(프리릴리스 표기는 레지스트리마다 달라도 됨).
      # 즉 락스텝 정책을 강제한다. 언어별 독립 버저닝으로 전환하는 날 — SECURITY.md가 보안 수정
      # 이후 버전이 갈릴 수 있다고 말하는 그 시점 — 이 스텝과 그 문장을 함께 정리해야 한다.
      - name: 언어 간 버전 SSOT (반쯤 적용된 범프로 태그가 밀리는 것을 막는다)
        run: node scripts/check-versions.mjs
      - name: 로컬 레지스트리 게시 → 깨끗한 소비자에서 설치·실행
        run: cd harness/install && ./install-verify.sh ${{ inputs.lang }}
      - name: 설치 매트릭스 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: install-matrix-${{ inputs.lang }}
          path: harness/install/report/INSTALL-MATRIX.md
          if-no-files-found: warn
