name: rust-release

# crates.io는 GitHub 웹훅 자동게시가 없다 — `cargo publish`로 직접 업로드해야 한다.
# ⚠️ 거버넌스: 실제 배포는 사람이 `rust-v*` 태그를 push해야만 실행된다(human-gated).
# `CARGO_REGISTRY_TOKEN` 시크릿 미설정 시 publish 스텝은 인증 실패로 종료한다.
on:
  push:
    tags: ['rust-v*']
permissions:
  contents: read
jobs:
  # 태그 접미사 = 릴리스 버전. 이 워크플로에서 버전을 유도하는 **유일한** 지점이다 — install-smoke와
  # publish가 각자 태그를 파싱하면 "게이트가 검증한 버전"과 "실제로 게시하는 버전"이 갈릴 수 있다.
  # 태그↔매니페스트 정합성 가드도 여기로 옮겼다: crates.io는 되돌릴 수 없으므로(yank만 가능) 이
  # 검증은 어떤 게이트보다 앞에 있어야 의미가 있다.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 추출 실패(빈 문자열)도 실패로 취급한다 — 조용히 빈 값이 되면 어떤 값과도 "다르다"고
      # 판정되지 않는 오검증이 생기기 때문이다. (행 앵커 `^version`은 의존성 테이블의 인라인
      # `version = "..."`과 겹치지 않는다.)
      - id: derive
        name: Derive version from tag and verify it matches Cargo.toml
        run: |
          VERSION="${GITHUB_REF_NAME#rust-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME}에서 'rust-v' 접두를 벗겨내지 못했다 — 버전 유도 불가(fail-closed)."
            exit 1
          fi
          ACTUAL=$(grep -m1 -E '^version[[:space:]]*=' rust/Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' || true)
          if [ -z "$ACTUAL" ]; then
            echo "::error::rust/Cargo.toml에서 [package] version을 추출하지 못했다 — 정합성 검증 불가(fail-closed)."
            exit 1
          fi
          if [ "$VERSION" != "$ACTUAL" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${VERSION} but rust/Cargo.toml declares ${ACTUAL}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} ↔ rust/Cargo.toml ${ACTUAL} 일치"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 게시 직전 마지막 게이트 — 패키징된 산출물을 로컬 레지스트리에 올린 뒤 모노레포 바깥의 깨끗한
  # 컨테이너에서 설치해 quickstart를 돌린다. 소스 테스트가 통과해도 패키징 층(매니페스트 메타데이터·
  # 파일 포함규칙·게시 아티팩트 호환성)의 결함은 여기서만 드러난다 — 레지스트리에 태우기 전 마지막 기회다.
  # ⚠️ `version`을 넘기지 않으면 이 게이트는 태그와 무관한 기본 버전을 검증한다(install-smoke.yml 주석 참고).
  install-smoke:
    needs: version
    uses: ./.github/workflows/install-smoke.yml
    with:
      lang: rust
      version: ${{ needs.version.outputs.version }}

  # 발행 전 게이트(2): `cargo test`는 `#[ignore]`된 E2E를 돌리지 않아 auth/admin 네트워크 경계를
  # 건드리지 않는다 — rust-ci.yml의 integration 잡과 동일한 실 Keycloak E2E를 태그 경로에서도 돌린다.
  integration:
    name: Integration (testcontainers, 실제 Keycloak 26.6)
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → testcontainers-rs 동작
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo test --locked --test integration_test -- --ignored

  publish:
    needs: [version, integration, install-smoke] # 통합 E2E + 설치 스모크 통과 후에만 crates.io로 나간다
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # 발행 전 게이트: 태그된 커밋이 green이 아니면 릴리스하지 않는다.
      # `--locked`는 이 경로에서 특히 중요하다 — 태그가 가리키는 커밋의 rust/Cargo.lock을 그대로
      # 쓰지 않으면, 게이트가 검증한 의존성 트리와 `cargo publish`의 검증 빌드가 쓰는 트리가
      # 조용히 달라질 수 있다. crates.io는 되돌릴 수 없으므로(yank만 가능) 락이 갱신되어야 하는
      # 상태면 실패해야 한다.
      - run: cargo build --locked && cargo test --locked
      - name: cargo publish (crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}"
