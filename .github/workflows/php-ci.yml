name: php-ci
on:
  push:
    paths: ['php/**', '.github/workflows/php-ci.yml']
  pull_request:
    paths: ['php/**', '.github/workflows/php-ci.yml']
  # 주간 레인 건강검진(환경 드리프트) — 근거는 .claude/rules/ci.md, 슬롯 표는 ci.yml 옆 주석.
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * 1'
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: ['8.3', '8.4'] }
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: pcov
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: vendor/bin/phpstan analyse
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes
      - run: vendor/bin/phpunit --testsuite unit --coverage-clover clover.xml
      # 커버리지 게이트: 로직 라인 ≥90%(경계는 phpunit.xml source exclude — AuthClient/Admin/KeycloakClient)
      - name: coverage gate
        # ⚠️ fail-open 금지: statements가 0이면(clover 리포트가 비었거나 생성 실패) 커버리지를
        # 100%로 계산해 게이트를 통과시키던 버그가 있었다. 측정 실패는 통과가 아니라 실패다.
        run: |
          php -r '
            $f = "clover.xml";
            if (!is_file($f)) { fwrite(STDERR, "clover.xml 없음 — 커버리지 측정 실패\n"); exit(1); }
            $x = simplexml_load_file($f);
            if ($x === false || !isset($x->project->metrics)) { fwrite(STDERR, "clover.xml 파싱 실패\n"); exit(1); }
            $m = $x->project->metrics;
            $c = (int)$m["coveredstatements"];
            $t = (int)$m["statements"];
            if ($t <= 0) { fwrite(STDERR, "statements=0 — 커버리지가 측정되지 않았다(fail-closed)\n"); exit(1); }
            $p = $c / $t * 100;
            printf("line coverage: %.2f%% (%d/%d statements)\n", $p, $c, $t);
            exit($p >= 90 ? 0 : 1);
          '
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      # IT는 `docker` CLI를 exec()로 셸아웃해 실제 Keycloak 26.6 컨테이너를 구동한다(Windows native PHP의
      # unix:// 스트림 미지원 폴백 — KeycloakContainerTrait). ubuntu-latest는 Docker가 내장되어 그대로 동작한다.
      - run: vendor/bin/phpunit --testsuite integration

  api-compat:
    name: php-semver-checker (공개 API 파괴적 변경)
    runs-on: ubuntu-latest
    # ⚠️ **Roave/BackwardCompatibilityCheck 는 이 저장소 구조에서 쓸 수 없다** — 소스를 읽어 확인:
    # `CheckedOutRepository::fromPath` 가 `$cwd/.git` 디렉터리를, `LocateDependenciesViaComposer` 가
    # `$installationPath/composer.json` 을 요구한다. 우리는 `.git` 이 저장소 루트이고 매니페스트는
    # `php/composer.json` 이라 둘이 같은 자리에 없다. `--from/--to` 는 git ref 뿐이고 경로 옵션이
    # 없다(v8.21.0). 게다가 PHP `~8.4||~8.5` 를 요구하고 phar·PHIVE·공식 Docker 배포가 없다.
    #
    # 그래서 **디렉터리 대 디렉터리**로 비교하는 `tomzx/php-semver-checker` 를 쓴다 — `.git` 도
    # 루트 composer.json 도 요구하지 않아 서브디렉터리 패키지에 그대로 맞는다. 격리 설치
    # (`composer create-project`)라 `php/composer.json` 을 오염시키지 않는다(Roave 는 로컬에서
    # `ext-intl` + `-W` 충돌로 설치 자체가 실패했다).
    #
    # ⚠️ **이 도구의 종료코드는 게이트가 될 수 없다** — gorelease 와 같은 함정이다. 실측(변이:
    # `Masking::mask` → `maskRenamed`): `Suggested semantic versioning change: MAJOR` 를 정확히
    # 출력하고도 **exit 0** 이었다. 그래서 리포트 본문을 근거로 삼는다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer
      - name: 도구 격리 설치 (php/composer.json 을 건드리지 않는다)
        run: composer create-project --no-interaction --quiet tomzx/php-semver-checker "$RUNNER_TEMP/semver"
      - name: 직전 릴리스 태그의 src 추출
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          git archive php-v0.2.0 php/src | tar -x -C "$RUNNER_TEMP/base"
          n=$(find "$RUNNER_TEMP/base" -name '*.php' | wc -l)
          echo "기준선 파일 $n 개"
          # ⚠️ 추출이 비면 비교가 「전부 동일」로 조용히 통과한다 — 공허성 검사.
          [ "$n" -gt 0 ] || { echo "::error::기준선 추출이 비었다 — 태그가 바뀌었나?"; exit 1; }
      - name: 비교 (MAJOR 면 실패)
        run: |
          set -euo pipefail
          out="$(php "$RUNNER_TEMP/semver/bin/php-semver-checker" compare "$RUNNER_TEMP/base/php/src" php/src 2>&1)"
          echo "$out"
          printf '%s' "$out" | grep -q 'Suggested semantic versioning change:' || {
            echo "::error::판정 줄이 없다 — 비교가 일어나지 않았다"; exit 1; }
          if printf '%s' "$out" | grep -q 'Suggested semantic versioning change: MAJOR'; then
            echo "::error::직전 릴리스 대비 파괴적 변경이 있다 — 1.0 은 major 없이 허용하지 않는다"
            exit 1
          fi
