name: php-ci
on:
  push:
    paths: ['php/**', '.github/workflows/php-ci.yml']
  pull_request:
    paths: ['php/**', '.github/workflows/php-ci.yml']
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { php: ['8.3', '8.4'] }
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: pcov
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: vendor/bin/phpstan analyse
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff --allow-risky=yes
      - run: vendor/bin/phpunit --testsuite unit --coverage-clover clover.xml
      # 커버리지 게이트: 로직 라인 ≥90%(경계는 phpunit.xml source exclude — AuthClient/Admin/KeycloakClient)
      - name: coverage gate
        # ⚠️ fail-open 금지: statements가 0이면(clover 리포트가 비었거나 생성 실패) 커버리지를
        # 100%로 계산해 게이트를 통과시키던 버그가 있었다. 측정 실패는 통과가 아니라 실패다.
        run: |
          php -r '
            $f = "clover.xml";
            if (!is_file($f)) { fwrite(STDERR, "clover.xml 없음 — 커버리지 측정 실패\n"); exit(1); }
            $x = simplexml_load_file($f);
            if ($x === false || !isset($x->project->metrics)) { fwrite(STDERR, "clover.xml 파싱 실패\n"); exit(1); }
            $m = $x->project->metrics;
            $c = (int)$m["coveredstatements"];
            $t = (int)$m["statements"];
            if ($t <= 0) { fwrite(STDERR, "statements=0 — 커버리지가 측정되지 않았다(fail-closed)\n"); exit(1); }
            $p = $c / $t * 100;
            printf("line coverage: %.2f%% (%d/%d statements)\n", $p, $c, $t);
            exit($p >= 90 ? 0 : 1);
          '
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      # IT는 `docker` CLI를 exec()로 셸아웃해 실제 Keycloak 26.6 컨테이너를 구동한다(Windows native PHP의
      # unix:// 스트림 미지원 폴백 — KeycloakContainerTrait). ubuntu-latest는 Docker가 내장되어 그대로 동작한다.
      - run: vendor/bin/phpunit --testsuite integration
