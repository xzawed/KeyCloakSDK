name: ruby-release

# 태그 드리븐 RubyGems 릴리스. ruby-v로 시작하는 태그 push에서만 트리거된다.
# ⚠️ 거버넌스: 실제 배포는 사람이 `ruby-v*` 태그를 push해야만 실행된다(human-gated).
# 인증은 저장된 API 키가 아니라 RubyGems Trusted Publishing(OIDC)을 사용한다 —
# https://guides.rubygems.org/trusted-publishing/ 에서 이 저장소(owner/repo), 워크플로 파일명
# (`ruby-release.yml`), environment(`release`), gem `keycloak-sdk`를 rubygems.org에 사전 등록해야
# 동작한다. 미설정 시 `Configure RubyGems Credentials` 스텝에서 OIDC 클레임이 등록된 publisher와
# 일치하지 않아 인증 실패로 종료된다. 저장소에 별도로 추가해야 하는 GitHub Secret은 없다.
#
# ⚠️ `rubygems/release-gem`(=`bundle exec rake release`) 미사용: 이 리포의 Rakefile은 bundler
# gem_tasks(`release` rake task)를 정의하지 않고, `rake release`는 그 자체로 버전 git 태그를
# 생성해 push한다(`contents: write` 필요) — 우리는 이미 사람이 `ruby-v*` 태그를 push해 트리거하므로
# 그와 별개로 `v<version>` 태그가 하나 더 생기는 이중태깅을 원치 않는다. 대신
# `rubygems/configure-rubygems-credentials`로 OIDC Trusted Publishing 자격증명만 구성한 뒤
# `gem build` + `gem push`로 직접 게시한다 — git 태그를 만들거나 push하지 않으므로
# `contents: write` 권한이 불필요하다(read-only로 충분).
#
# ⚠️ 첫 게시 선행(1회): gem이 rubygems.org에 존재하기 전에는 Trusted Publisher를 붙일 수 없다 —
# 최초 1회는 API 키로 `gem push`하거나 rubygems.org UI에서 gem을 생성한 뒤 Trusted Publisher를
# 등록한다(owner `xzawed` · repo `KeyCloakSDK` · workflow `ruby-release.yml` · environment `release`).
# 이후에는 `ruby-v*` 태그 push만으로 시크릿 없이 릴리스된다.
on:
  push:
    tags: ['ruby-v*']

# 최소권한 기본값. release 잡만 OIDC용 `id-token: write`를 추가로 선언한다.
permissions:
  contents: read

jobs:
  # 태그 접미사 = 릴리스 버전. 이 워크플로에서 버전을 유도하는 **유일한** 지점이다 — install-smoke와
  # publish가 각자 태그를 파싱하면 "게이트가 검증한 버전"과 "실제로 게시하는 버전"이 갈릴 수 있다.
  # 태그↔매니페스트 정합성 가드도 여기로 옮겼다: 45분짜리 install-smoke를 태우기 전에 실패한다.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # gemspec이 `KeycloakSdk::VERSION`을 그대로 읽어 gem 파일명/버전을 정한다. 추출 실패(빈
      # 문자열)도 실패로 취급한다 — 조용히 빈 값이 되면 어떤 값과도 "다르다"고 판정되지 않는
      # 오검증이 생기기 때문이다.
      - id: derive
        name: Derive version from tag and verify it matches KeycloakSdk::VERSION
        run: |
          VERSION="${GITHUB_REF_NAME#ruby-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME}에서 'ruby-v' 접두를 벗겨내지 못했다 — 버전 유도 불가(fail-closed)."
            exit 1
          fi
          ACTUAL=$(grep -m1 -E 'VERSION[[:space:]]*=' ruby/lib/keycloak_sdk/version.rb | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$ACTUAL" ]; then
            echo "::error::ruby/lib/keycloak_sdk/version.rb에서 VERSION을 추출하지 못했다 — 정합성 검증 불가(fail-closed)."
            exit 1
          fi
          if [ "$VERSION" != "$ACTUAL" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${VERSION} but ruby/lib/keycloak_sdk/version.rb declares ${ACTUAL}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} ↔ KeycloakSdk::VERSION ${ACTUAL} 일치"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 게시 직전 마지막 게이트 — 패키징된 산출물을 로컬 레지스트리에 올린 뒤 모노레포 바깥의 깨끗한
  # 컨테이너에서 설치해 quickstart를 돌린다. 소스 테스트가 통과해도 패키징 층(매니페스트 메타데이터·
  # 파일 포함규칙·게시 아티팩트 호환성)의 결함은 여기서만 드러난다 — 레지스트리에 태우기 전 마지막 기회다.
  # ⚠️ `version`을 넘기지 않으면 이 게이트는 태그와 무관한 기본 버전을 검증한다(install-smoke.yml 주석 참고).
  install-smoke:
    needs: version
    uses: ./.github/workflows/install-smoke.yml
    with:
      lang: ruby
      version: ${{ needs.version.outputs.version }}

  # 발행 전 게이트: 단위테스트(release 잡 내부 rspec)만으로는 admin/auth 네트워크 경계를 검증할 수
  # 없다 — ruby-ci.yml의 integration 잡과 동일한 실 Keycloak 컨테이너 E2E를 태그 경로에서도 돌린다.
  integration:
    name: Integration (docker CLI 셸아웃, 실제 Keycloak 26.6)
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → KeycloakContainer(docker run 셸아웃) 동작
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby
      # RUN_INTEGRATION=1 → spec_helper의 SimpleCov minimum_coverage 게이트를 억제(통합 단독 실행 시
      # 브랜치 커버리지가 낮게 나와 process-wide 게이트가 오탐 실패하는 것을 방지 — unit 게이트는 불변).
      - run: RUN_INTEGRATION=1 bundle exec rspec spec/integration --tag integration

  release:
    needs: [version, integration, install-smoke] # 통합 E2E + 설치 스모크 통과 후에만 rubygems.org로 나간다
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write          # RubyGems Trusted Publishing(OIDC) — 저장 시크릿 없음
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby
      # 발행 전 게이트: 태그된 커밋이 green이 아니면 릴리스하지 않는다.
      - run: bundle exec rubocop
      - run: bundle exec rspec
      - run: bundle exec bundler-audit check --update
      # OIDC로 rubygems.org Trusted Publisher 자격증명을 구성(저장 시크릿 없음) — `gem push`가
      # 이 자격증명을 사용한다. rake release는 쓰지 않으므로 git 태그 push는 일어나지 않는다.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Build and push gem
        run: |
          gem build keycloak-sdk.gemspec
          gem push keycloak-sdk-*.gem
