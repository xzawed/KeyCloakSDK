name: repo-hygiene

on:
  push:
  pull_request:

# 최소권한: 세 잡 모두 워킹트리를 읽고 검사만 한다(쓰기 없음). repo-config 잡이 쓰는
# `gh`도 공개 정보 조회 + 404 경로 확인이 전부라 contents: read로 충분하다 —
# 룰셋 조회 권한은 애초에 주지 않는다(아래 repo-config 잡 주석 참조).
permissions:
  contents: read

jobs:
  shell-exec-bits:
    # 추적되는 모든 *.sh는 실행비트(100755)를 가져야 한다.
    #
    # 왜 예외 없이 전부인가: `harness/install/lib.sh`와 `scripts/lib/deploy-facts.sh`는
    # `.`(source)로만 쓰이므로 원칙적으로 실행비트가 필요 없다. 그러나 "source 전용"과
    # "실행 전용"을 사람이 구분해 유지하는 규칙은 반드시 썩는다 — 실제로 이 리포에서
    # `harness/verify.sh`(명백한 실행 스크립트)가 100644로 커밋되어 야간 CI가 3개월간
    # exit 126으로 죽어 있었다. 예외 없는 규칙이 유지 비용이 0이고, source되는 파일에
    # 실행비트가 붙어도 해롭지 않다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: 추적되는 *.sh 의 실행비트 확인
        run: |
          NON_EXEC="$(git ls-files -s -- '*.sh' | awk '$1 == "100644" { print $4 }')"
          if [ -n "$NON_EXEC" ]; then
            echo "::error::실행비트가 없는 셸 스크립트가 있습니다. \`git update-index --chmod=+x <file>\` 로 고치세요."
            echo "$NON_EXEC" | sed 's/^/  /'
            exit 1
          fi
          echo "추적되는 *.sh $(git ls-files -- '*.sh' | wc -l)개 전부 실행비트 있음"

  doc-facts:
    # 문서가 주장하는 버전이 빌드 파일과 일치하는지 검사한다 — 그리고 이름과 달리 지금은
    # "저장소의 사실이 드리프트하지 않는가"를 보는 가드 전체가 여기 모여 있다(문서·툴체인
    # 진단기·커버리지 게이트·버전 SSOT·CI 권한).
    #
    # ⚠️ 새 가드를 별도 잡으로 빼지 않고 이 잡에 붙이는 이유: 룰셋 PRIMARY의 required 체크는
    # `doc-facts`·`shell-exec-bits` **둘뿐**이고 그 목록을 늘리는 것은 저장소 설정 변경이다
    # (CONTRIBUTING §4). 새 잡으로 빼면 눈에는 보이되 머지를 막지 못한다 — 차단해야 하는
    # 가드는 이 잡 안에 스텝으로 넣는 것이 현재 유일한 방법이다.
    #
    # 경로 필터를 두지 않는 이유: 드리프트는 문서가 아니라 `pom.xml`에서 시작한다.
    # 의존성만 올리고 문서를 안 고친 PR이 정확히 이 잡이 잡아야 할 대상인데,
    # 경로 필터를 `**.md`로 걸면 그 PR에서 잡이 아예 돌지 않는다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: 가드 자가테스트(변이 3종이 전부 잡히는지)
        run: sh scripts/test/test-check-docs.sh
      - name: 툴체인 진단기 자가테스트(요구버전을 빌드파일에서 읽는지)
        # doctor.mjs는 "이 PC에 툴체인이 있는가"를 답하는 도구라 CI에서 그 결과 자체는
        # 의미가 없다(러너마다 다르다). 여기서 검사하는 것은 진단기가 요구 버전을
        # 하드코딩하지 않고 빌드 파일에서 읽는가 + 좌표가 깨졌을 때 침묵 통과하지
        # 않는가다 — check-docs와 같은 종류의 자기기만 방지다.
        run: sh scripts/test/test-doctor.sh
      - name: 문서-소스 대조
        # --min-facts/--min-anchors는 저장소 루트의 현재 실측치(50 facts / 19 anchors)를
        # 하한으로 강제한다 — 앵커 주석을 지우면서 그 표를 남겨두면(검사 대상 자체가
        # 조용히 사라지면) 위쪽 검사들만으로는 잡히지 않고 exit 0이 새 나간다. 앵커·
        # 표를 늘리면 이 값도 함께 올려야 한다(내리는 PR은 곧 커버리지 축소이므로
        # 리뷰에서 그 자체가 신호가 된다).
        # ⚠️ 이 값은 한때 14/4에 머물러 있었고 실측은 이미 28/7이었다 — **앵커 절반이
        # 사라져도 CI가 통과하는 상태**였다. 하한을 올리는 것을 잊으면 가드가 조용히
        # 헐거워지므로, 앵커를 추가하는 PR은 이 줄을 함께 고쳐야 한다.
        run: node scripts/check-docs.mjs . --strict --min-facts=50 --min-anchors=19

      - name: 커버리지 게이트 가드 자가테스트(측정 실패와 하락을 구분하는지)
        # 이 가드의 가치는 임계값 비교가 아니라 판별이다 — 둘 다 exit 1이라 종료코드만 보는
        # 테스트는 판별자를 지워도 통과한다. 자가테스트가 stderr 문구까지 고정하는 이유다.
        run: sh scripts/test/test-check-coverage.sh

      # ⚠️ 배포 문서·헬퍼의 자가테스트 6종. 이들은 오래 **어떤 워크플로에도 배선돼 있지 않았고**,
      # 그래서 DEPLOY.md가 실제와 어긋나도 아무도 몰랐다 — 첫 태그(`php-v0.1.0-rc.1`)를 민 뒤
      # 문서가 "zero tags"라고 주장하는 상태가 그대로 통과했다(오히려 test-deploy-md.sh의
      # 어서션이 그 낡은 주장을 강제하고 있었다). 자가테스트가 CI에서 돌지 않으면 그건
      # 문서일 뿐 가드가 아니다.
      # ⚠️ 이 잡의 셸은 dash다(우분투의 /bin/sh). 로컬 Git Bash와 동작이 갈리는 지점이 실제로
      # 있었다 — `. "$SH" --lib`(dash는 dot의 인자를 무시한다)와 `echo`의 백슬래시 확장이다.
      # 이 목록을 고칠 때는 로컬 통과로 만족하지 말고 dash로 한 번 돌릴 것(각 테스트 상단 참고).
      - name: 배포 문서·헬퍼 자가테스트(DEPLOY.md ↔ deploy-facts SSOT · readiness · trigger · request · dispatch)
        run: |
          sh scripts/test/test-deploy-facts.sh
          sh scripts/test/test-deploy-md.sh
          sh scripts/test/test-publication-claims.sh
          sh scripts/test/test-release-readiness.sh
          sh scripts/test/test-release-trigger.sh
          sh scripts/test/test-release-request.sh
          sh scripts/test/test-dispatch-release.sh

      # ⚠️ 보안 파라미터 기본값의 단일 진실(아홉 언어 코드 ↔ 소비자 문서). 이 값(JWKS 최소
      # 재조회 간격)은 DoS 증폭 상한이라 문서가 틀리면 소비자가 틀린 전제로 자기 rate-limit을
      # 설계한다. 실제로 `ruby/README.ko.md`가 `10.0`(코드는 30)이라고 3배 낮게 알려주고 있었고
      # 리포에 이 불변식을 겨누는 가드는 0건이었다(2026-08-12 문서 감사).
      - name: 보안 기본값 자가테스트(9언어 코드 ↔ 문서 정합)
        run: sh scripts/test/test-security-defaults.sh

      # ⚠️ 출처 게이트를 **실행해** 판정한다(계획서 Task B0). 자매 가드
      # `test-harness-registries.sh`는 같은 스크립트를 정적으로 렉싱하는데, 그 방식으로 7종
      # 우회를 닫은 뒤에도 적대적 재리뷰가 4종을 더 찾았다 — 정적으로 임의 POSIX 셸의 의미를
      # 증명하려는 시도라 수렴하지 않는다. 실측: 그 4종 중 **3종을 정적 가드는 못 잡고 런타임이
      # 잡는다**. 둘 다 돌린다(정적=존재·배선, 런타임=판정의 옳음).
      - name: 출처 게이트 런타임 행동 테스트(8언어 게이트를 실제로 실행)
        run: sh scripts/test/test-provenance-gate.sh

      # ⚠️ `install-verify.sh`의 순수 로직(버전 파생·형식 검증). 이 로직은 1000줄짜리 Docker
      # 오케스트레이터 안에 있어 레그를 통째로 돌리기 전에는 시험할 방법이 없었고, 실제로 거기서
      # 사고가 났다 — 폴백이 루프가 덮어쓰는 전역을 읽어 직전 언어의 버전이 다음 언어로 샜다.
      # 기본 순서에서는 안 물려 **야간이 초록이었다**(부분집합 실행에서만 나타났다).
      # ⚠️ 대상이 bash 스크립트(연관배열)라 이 테스트만 `bash`로 돌린다 — 나머지는 dash다.
      - name: install-verify 순수 로직 자가테스트(Docker 불필요)
        run: bash scripts/test/test-install-verify.sh

      # ⚠️ 하네스 로컬 레지스트리 설정. 이 설정이 낡으면 야간 `install-all`만 조용히 빨개지고
      # PR/푸시 CI는 전부 초록이라 며칠씩 안 보인다 — 실제로 3연속(08-08·08-09·08-10) 그랬다.
      # 원인은 저장소 밖이었다: node 패키지가 공개 npmjs에 게시되자 Verdaccio uplink이 같은
      # 버전을 이미 아는 상태가 되어 로컬 게시가 E409로 죽었다. 리포를 겨누는 가드는 전부
      # 초록이었으므로, 그 설정을 겨누는 가드가 따로 필요하다.
      - name: 하네스 레지스트리 설정 가드(자기 스코프 uplink 격리 · 전이 의존성 프록시 유지)
        run: sh scripts/test/test-harness-registries.sh

      # ⚠️ 이 세 파일은 하네스의 헤드라인 회귀 테스트(판정 공허성 제거·스코어링·보안 판정)인데
      # 어떤 워크플로에도 배선되지 않은 채 존재만 하고 있었다(최종 리뷰 I1) — `grep -rn
      # "install-matrix.test\|score.test\|verdict.test" .github/ scripts/`가 아무것도 못
      # 찾았다. `test-selftest-hygiene.sh`의 CI 배선 규칙은 `scripts/test/test-*.sh`만 보고
      # `harness/**/*.test.mjs`는 스코프 밖이라 이 누락을 못 잡았다 — 그 스코프를 넓혔다.
      - name: 하네스 회귀 테스트(판정 공허성·스코어링·보안 판정)
        run: |
          node harness/install/report/install-matrix.test.mjs
          node harness/report/score.test.mjs
          node harness/security/verdict.test.mjs

      # ⚠️ 자가테스트 자신의 위생 — "테스트가 있다"가 "테스트가 돈다"를 뜻하지 않는 두 경로를 막는다.
      # (1) `assert.sh`의 어서션은 `_A_FAIL`만 누적하고 종료코드를 바꾸지 않는다 — 종료코드를 내는
      # 것은 `assert_report`뿐이라, 빠뜨린 테스트는 전부 실패해도 exit 0으로 CI를 초록으로 만든다.
      # (2) 파일이 존재하는 것과 이 워크플로에 배선된 것은 다르다(위 79행 주석의 사고 참조).
      # 두 규칙은 계획 문서의 미체크 항목 안에만 산문으로 있었다 — 가드로 옮겼다.
      - name: 자가테스트 위생(assert_report 호출 · CI 배선)
        run: sh scripts/test/test-selftest-hygiene.sh

      - name: 버전 SSOT 가드 자가테스트(반쯤 적용된 범프를 잡는지 + 오탐 없는지)
        run: sh scripts/test/test-check-versions.sh
      - name: 버전 SSOT 대조
        # 버전 범프가 **반쯤 적용되는 것**이 첫 배포의 실제 위험이다. Java는 버전이 7개 POM에
        # 있고, 릴리스 워크플로의 태그↔매니페스트 가드는 **자기 언어만** 본다 — python만 올리고
        # node를 두면 어떤 게이트도 잡지 못한 채 태그가 밀리고 그 좌표는 태워버린 것이 된다.
        run: node scripts/check-versions.mjs

      - name: 릴리스 프리릴리스 판정 자가테스트(세 워크플로 동일성 + 분류표)
        # 태그를 태우지 않고 검증할 수 있는 유일한 대상이 판정 로직이다. php-v0.1.0-rc.1의
        # 첫 실행은 다섯 잡이 전부 green이면서도 RC를 Latest release로 걸었다 — 파이프라인
        # 성공은 이 결함에 대해 아무 말도 하지 않는다. 이 테스트는 워크플로에서 판정 블록을
        # **그대로 떼어내** 실행하므로, 복사본만 맞고 배포되는 문자열이 틀린 상태가 될 수 없다.
        run: sh scripts/test/test-release-prerelease.sh

      - name: CI 권한 가드 자가테스트(잡 권한 누락·워크플로 레벨 블록을 잡는지 + 오탐 없는지)
        run: sh scripts/test/test-check-ci-permissions.sh
      - name: CI 권한 대조
        # 릴리스 워크플로의 잡이 `permissions:`를 빠뜨리면 그 토큰은 워크플로가 아니라
        # **저장소 기본 권한**(Settings → Actions)을 물려받는다 — 이 저장소의 어떤 파일에도
        # 없고, PR 리뷰를 거치지 않으며, UI 토글 하나로 바뀌는 값이다. 릴리스 워크플로의
        # 권한을 잡 레벨로 내린 뒤(S7637) 남은 안전망은 각 파일 헤더의 **주석**뿐이었다.
        # 주석은 잡을 추가하는 사람이 읽어야만 동작한다.
        #
        # --min-release=10은 현재 실측치다(9개 언어 릴리스 워크플로 + dispatch-release.yml).
        # glob으로 범위를 좁힌 가드는 대상이 0건이어도 통과하므로(릴리스 워크플로를 개명하면
        # 그대로 침묵한다) 하한을 명시로 못박는다 — check-docs의 --min-facts/--min-anchors와
        # 같은 관용이다. 릴리스 워크플로를 늘리면 이 값도 함께 올린다(내리는 PR은 곧 커버리지
        # 축소라 리뷰 신호가 된다).
        run: node scripts/check-ci-permissions.mjs . --min-release=10

  repo-config:
    # 저장소 설정(브랜치 룰셋) 대조기의 자가테스트.
    #
    # ⚠️ 이 잡은 **required 상태체크가 아니다**, 그리고 그렇게 두는 것이 의도다.
    # 룰셋 PRIMARY는 `bypass_actors: []`라 required 체크가 한 번 멈추면 소유자도
    # 못 푼다. 그래서 required는 네트워크·외부 상태에 의존하지 않는 최소 집합
    # (doc-facts·shell-exec-bits)으로 유지하고, gh API를 건드리는 이 검사는
    # 눈에는 보이되 머지를 막지는 않는 자리에 둔다.
    #
    # 라이브 설정과의 실제 드리프트 대조(`repo-config.mjs check`)는 관리자 권한
    # 토큰이 필요해 CI에 넣지 않는다 — 이 저장소는 그런 토큰을 저장하지 않는다.
    # 유지자가 로컬에서 돌린다(CONTRIBUTING §4).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: 룰셋 대조기 자가테스트(거짓 드리프트·공허한 통과 방지)
        # GH_TOKEN을 준다: 없으면 gh가 "미인증"으로 죽어서, "접근 불가 저장소는 exit 2"
        # 검사가 의도한 404 경로가 아니라 인증 실패 경로로 통과해버린다(= 검사가 무의미해짐).
        # 이 토큰으로 읽을 수 있는 것은 공개 정보뿐이고 룰셋 조회 권한은 없다 — 그래서
        # 라이브 드리프트 대조는 여전히 CI가 아니라 유지자 로컬 작업이다.
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/test/test-repo-config.sh
