name: Python Release

# 태그 드리븐 PyPI 릴리스 (WBS 7.1). py-v로 시작하는 태그 push에서만 트리거된다.
# ⚠️ 거버넌스: 실제 배포는 사람이 `py-v*` 태그를 push해야만 실행된다(human-gated).
# 인증은 저장된 토큰/시크릿이 아니라 PyPI Trusted Publisher(OIDC)를 사용한다 —
# https://docs.pypi.org/trusted-publishers/ 에서 이 저장소(repo owner/name),
# 워크플로 파일명(`python-release.yml`), environment(미사용 시 비움)를 PyPI 프로젝트
# `keycloak-sdk`에 사전 등록해야 동작한다. 미설정 시 publish 스텝에서 OIDC 클레임이
# PyPI에 등록된 publisher와 일치하지 않아 인증 실패로 종료된다. 저장소에 별도로
# 추가해야 하는 GitHub Secret은 없다.
on:
  push:
    tags: ['py-v*']

jobs:
  # 발행 전 게이트: 태그된 커밋이 green이 아니면 PyPI로 나가지 않는다(무회귀 보증).
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy src
      - run: pytest -m "not integration" --cov=keycloak_sdk

  release:
    needs: verify        # verify 통과 시에만 발행
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # PyPI Trusted Publisher(OIDC)에 필요 — 다른 권한 불필요
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build backend
        run: python -m pip install build

      - name: Build sdist + wheel
        working-directory: python
        run: python -m build

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
