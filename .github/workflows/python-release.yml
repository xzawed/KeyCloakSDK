name: Python Release

# 태그 드리븐 PyPI 릴리스 (WBS 7.1). py-v로 시작하는 태그 push에서만 트리거된다.
# ⚠️ 거버넌스: 실제 배포는 사람이 `py-v*` 태그를 push해야만 실행된다(human-gated).
# 인증은 저장된 토큰/시크릿이 아니라 PyPI Trusted Publisher(OIDC)를 사용한다 —
# https://docs.pypi.org/trusted-publishers/ 에서 이 저장소(repo owner/name),
# 워크플로 파일명(`python-release.yml`), environment(미사용 시 비움)를 PyPI 프로젝트
# `keycloak-sdk`에 사전 등록해야 동작한다. 미설정 시 publish 스텝에서 OIDC 클레임이
# PyPI에 등록된 publisher와 일치하지 않아 인증 실패로 종료된다. 저장소에 별도로
# 추가해야 하는 GitHub Secret은 없다.
on:
  push:
    tags: ['py-v*']

# 최소권한 기본값. release 잡만 OIDC용 `id-token: write`를 추가로 선언한다.
permissions:
  contents: read

jobs:
  # 태그 접미사 = 릴리스 버전. 이 워크플로에서 버전을 유도하는 **유일한** 지점이다 — install-smoke와
  # publish가 각자 태그를 파싱하면 "게이트가 검증한 버전"과 "실제로 게시하는 버전"이 갈릴 수 있다.
  # 태그↔매니페스트 정합성 가드도 여기로 옮겼다: 45분짜리 install-smoke를 태우기 전에 실패한다.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 태그↔소스 정합성(fail-fast): 태그가 함의하는 버전과 pyproject.toml이 선언한 버전이
      # 다르면 어떤 게이트도 돌기 전에 중단한다. 추출 실패(빈 문자열)도 실패로 취급한다 —
      # 조용히 빈 값이 되면 어떤 값과도 "다르다"고 판정되지 않는 오검증이 생기기 때문이다.
      - id: derive
        name: Derive version from tag and verify it matches pyproject
        run: |
          VERSION="${GITHUB_REF_NAME#py-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME}에서 'py-v' 접두를 벗겨내지 못했다 — 버전 유도 불가(fail-closed)."
            exit 1
          fi
          ACTUAL=$(grep -m1 -E '^version[[:space:]]*=' python/pyproject.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' || true)
          if [ -z "$ACTUAL" ]; then
            echo "::error::python/pyproject.toml에서 [project] version을 추출하지 못했다 — 정합성 검증 불가(fail-closed)."
            exit 1
          fi
          if [ "$VERSION" != "$ACTUAL" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${VERSION} but python/pyproject.toml declares ${ACTUAL}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} ↔ python/pyproject.toml ${ACTUAL} 일치"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 게시 직전 마지막 게이트 — 패키징된 산출물을 로컬 레지스트리에 올린 뒤 모노레포 바깥의 깨끗한
  # 컨테이너에서 설치해 quickstart를 돌린다. 소스 테스트가 통과해도 패키징 층(매니페스트 메타데이터·
  # 파일 포함규칙·게시 아티팩트 호환성)의 결함은 여기서만 드러난다 — 레지스트리에 태우기 전 마지막 기회다.
  # ⚠️ `version`을 넘기지 않으면 이 게이트는 태그와 무관한 기본 버전을 검증한다(install-smoke.yml 주석 참고).
  install-smoke:
    needs: version
    uses: ./.github/workflows/install-smoke.yml
    with:
      lang: python
      version: ${{ needs.version.outputs.version }}

  # 발행 전 게이트: 태그된 커밋이 green이 아니면 PyPI로 나가지 않는다(무회귀 보증).
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.12' }
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy src
      - run: pytest -m "not integration" --cov=keycloak_sdk

  # 발행 전 게이트(2): 단위테스트만으로는 admin/auth 네트워크 경계를 검증할 수 없다 —
  # python-ci.yml의 integration 잡과 동일한 실 Keycloak 컨테이너 E2E를 태그 경로에서도 돌린다.
  integration:
    name: Integration tests (testcontainers, 실제 Keycloak)
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → testcontainers 동작
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: '3.12' }
      - run: python -m pip install -e ".[dev]"
      - name: pytest (integration, Docker)
        run: pytest -m integration

  release:
    needs: [version, verify, integration, install-smoke] # 단위 + 통합 + 설치 스모크 전부 통과해야 발행
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      id-token: write # PyPI Trusted Publisher(OIDC)에 필요 — 다른 권한 불필요
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install build backend
        run: python -m pip install build twine

      - name: Build sdist + wheel
        working-directory: python
        run: python -m build

      # 업로드 전 메타데이터 검증. install-smoke는 **로컬** pypiserver에 올려보는데 그건 관대해서
      # Warehouse(PyPI)의 검증을 대신하지 못한다 — 즉 "설치되고 동작한다"가 증명돼도 "PyPI가
      # 받아준다"는 별개다. PyPI 업로드는 재시도가 아니라 **버전을 태우는** 일이므로 거절 사유는
      # 업로드 전에 알아야 한다. `--strict`는 경고까지 실패로 올린다(README 렌더링 포함).
      - name: Validate package metadata (twine check)
        working-directory: python
        run: python -m twine check --strict dist/*

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: python/dist
