name: published-floor

# 레지스트리에서 **게시된 jar 를 실제로 받아** 클래스파일 버전을 읽는다.
#
# 사슬의 마지막 칸이다. 나머지 둘은 저장소 안만 본다:
#   문서 ↔ 태그          `check-docs.mjs` 의 `kind=runtime` 앵커 (doc-facts, required)
#   태그 ↔ 소스 핀       `check-jvm-api-surface-pins.mjs`        (doc-facts, required)
#   태그 ↔ **게시 바이트**  이 워크플로                            (예약·수동, required 아님)
# 릴리스가 다른 JDK 로 빌드했거나 업로드가 부분 실패했으면 **소비자가 받는 것만 다르고 저장소는
# 전부 초록**이다. 그 칸은 바이트를 받아야만 닫힌다.
#
# ⚠️ **required 가 되어서는 안 된다.** 룰셋 PRIMARY 가 요구하는 것은 `doc-facts`·`shell-exec-bits`
# 둘뿐이고 `bypass_actors: []` 라 required 가 한 번 막히면 소유자도 못 푼다(CONTRIBUTING §4).
# 네트워크에 의존하는 검사를 거기 넣으면 Central 이 흔들릴 때 저장소가 잠긴다.
#
# ⚠️ **릴리스 워크플로 안의 단계로 넣지 않는다.** Portal Publish 는 사람 클릭이라 릴리스가
# 끝난 시점에 레지스트리에는 아직 아무것도 없다 — 거기 넣은 검사는 언제나 공허하다.
#
# ⚠️ 오라클의 대조 대상은 SSOT 가 **아니라** 레지스트리다. `df_published_version` 은 런북 §4
# 1단계에서 태그보다 **먼저** 올라가므로 그것은 의도이지 현재 사실의 주장이 아니다. 그래서
# 검사 대상은 `maven-metadata.xml` 이 실제로 싣는 버전이고, 각 버전의 하한은 그 버전의
# **태그**가 소유한다. 사람이 Publish 를 누르기 전 구간에 거짓 빨강이 나지 않는 이유가 이것이다.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 2' # 매주 화요일 05:30 UTC (harness 야간 03:00 · security-audit 월 04:00 과 겹치지 않게)

# 최소권한: 소스와 태그를 읽고 공개 레지스트리에 GET 만 한다.
permissions:
  contents: read

jobs:
  published-floor:
    name: 게시된 JVM 아티팩트의 클래스파일 하한
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # ⚠️ 하한의 소유자가 **태그**다 — 태그가 없으면 오라클이 대조할 선언이 없고,
          # 그러면 `vacuous-run` 으로 실패한다(조용한 초록이 되지 않는다).
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - name: 게시본 대조
        run: node scripts/check-published-jvm-floor.mjs

  registry-truth:
    name: 게시 SSOT ↔ 살아 있는 레지스트리(아홉 언어)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # ⚠️ 유예의 시계가 **태그 시각**과 SSOT 커밋 시각이다 — 태그가 없으면 게시 전 구간이
          # 전부 UNTAGGED 로 읽혀 거짓 빨강이 난다.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22'
      - name: 레지스트리 대조
        # 종료코드 2(판정 불가)도 실패로 둔다 — 통과로 읽지 않는다는 것이 이 가드의 계약이다.
        run: node scripts/check-registry-truth.mjs
