name: kotlin-ci
on:
  push:
    paths: ['kotlin/**', '.github/workflows/kotlin-ci.yml']
  pull_request:
    paths: ['kotlin/**', '.github/workflows/kotlin-ci.yml']
  # 주간 레인 건강검진(환경 드리프트) — 근거는 .claude/rules/ci.md, 슬롯 표는 ci.yml 옆 주석.
  workflow_dispatch:
  schedule:
    - cron: '47 7 * * 1'
permissions:
  contents: read
jobs:
  build-test:
    name: build + unit test + kover + ktlint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      # 단위테스트 100개 + 커버리지 게이트(로직 모듈 라인≥90/브랜치≥85 — 네트워크 경계
      # AuthClient/admin.*/KeycloakClient omit) + ktlint(무경고). Docker 불필요(integrationTest는 별도 잡).
      - run: ./gradlew build test koverVerify ktlintCheck

  integration:
    name: Integration (testcontainers, 실제 Keycloak 26.6)
    needs: build-test
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → testcontainers-keycloak 동작
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Integration E2E (Docker, 실제 Keycloak 26.6 — FullFlowIT)
        run: ./gradlew integrationTest

  # SECURITY.md가 약속하는 "언어별 의존성 취약점 감사"의 Kotlin 구현 — ci.yml(Java)의 동형 잡이다.
  # OWASP dependency-check(Gradle 플러그인)를 쓰지 않는 이유는 ci.yml의 dependency-audit 주석과 같다
  # (NVD API 키 없이는 레이트리밋으로 상시 실패 — 이 저장소엔 Actions 시크릿이 없다). 덧붙여 그
  # 플러그인은 build.gradle.kts 수정을 요구하지만, 키 없는 OSV 대조는 워크플로만으로 완결된다.
  dependency-audit:
    name: Dependency CVE audit (OSV — Kotlin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: 해석된 런타임 의존성 좌표 수집(runtimeClasspath)
        # `dependencies` 리포트의 트리 출력을 파싱한다: `|    +--- g:a:v (*)` 꼴이며 (*)/(c)/(n)
        # 마커는 버리고, 버전 충돌 표기(`g:a:1.0 -> 1.2`)가 있으면 해석된 오른쪽 버전을 쓴다.
        run: |
          set -euo pipefail
          ./gradlew -q dependencies --configuration runtimeClasspath > dep-tree.txt
          grep -e '--- ' dep-tree.txt \
            | sed -e 's/^.*--- //' -e 's/ (\*)$//' -e 's/ (c)$//' -e 's/ (n)$//' \
            | awk -F' -> ' '{ if (NF == 2) { split($1, b, ":"); print b[1]":"b[2]":"$2 } else { print $0 } }' \
            | awk -F: 'NF == 3 && $1 != "" && $3 != "" { print $1":"$2":"$3 }' \
            | sort -u > pkgs.txt
          echo "수집한 Maven 좌표 $(wc -l < pkgs.txt)개"
      - name: OSV.dev 대조(알려진 취약점 있으면 실패)
        # ⚠️ fail-open 금지(php-ci.yml 커버리지 게이트와 같은 원칙): 목록이 비었거나 응답 개수가
        # 어긋나면 "취약점 없음"이 아니라 **측정 실패**이므로 통과시키지 않는다.
        run: |
          set -euo pipefail
          test -s pkgs.txt || { echo "::error::의존성 좌표 목록이 비었다 — 감사 실패(fail-closed)"; exit 1; }
          jq -Rn '{queries: [inputs | split(":") | {package: {ecosystem: "Maven", name: (.[0] + ":" + .[1])}, version: .[2]}]}' \
            < pkgs.txt > osv-query.json
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
            --data @osv-query.json https://api.osv.dev/v1/querybatch > osv-result.json
          n_q=$(wc -l < pkgs.txt)
          n_r=$(jq '.results | length' osv-result.json)
          [ "$n_q" -eq "$n_r" ] || { echo "::error::OSV 응답 수($n_r) != 질의 수($n_q) — 감사 실패(fail-closed)"; exit 1; }
          hits=$(paste pkgs.txt <(jq -r '.results[] | ((.vulns // []) | map(.id) | join(","))' osv-result.json) \
            | awk -F'\t' '$2 != ""')
          if [ -n "$hits" ]; then
            echo "::error::알려진 취약점이 있는 의존성이 있습니다(좌표 <TAB> OSV/GHSA id):"
            echo "$hits"
            exit 1
          fi
          echo "OK: Maven 좌표 ${n_q}개에 알려진 OSV 취약점 없음"

  api-compat:
    name: japicmp (공개 API 파괴적 변경)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    # ⚠️ **BCV 도 KGP 내장 abiValidation 도 쓰지 않는다** — 둘 다 기준선이 **커밋된 `.api` 덤프**라
    # 「직전 게시본 대비」가 아니다(실측 확인). 덤프는 개발자가 다시 뜨면 그만이라, 나머지 여섯
    # 레인과 **보증의 종류가 다르다**. 게다가 BCV 는 유지보수 모드다.
    #
    # 대신 java 레인과 **같은 도구**(japicmp)로 게시된 JAR 과 직접 대조한다. Gradle 플러그인
    # (`me.champeau.gradle.japicmp`, 최종 릴리스 18개월 전)은 GAV 가 아니라 FileCollection 을 받아
    # 기준선을 직접 해석해야 하므로, CLI 로 두 JAR 을 비교하는 쪽이 단순하고 의존이 없다.
    #
    # ⚠️ Kotlin JAR 은 `kotlin.Metadata` 어노테이션 변경 잡음을 낸다 — 실측으로 갈랐다:
    # 그 잡음만으로는 실패하지 않고(복원 상태 `No changes` · exit 0), 공개 메서드가 사라지면
    # `REMOVED METHOD` 로 exit 1 이다. 그래서 별도 exclude 가 필요 없다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: 현재 JAR 빌드
        run: ./gradlew --no-daemon jar
      - name: 기준선(직전 정식 릴리스) JAR + japicmp CLI 내려받기
        env:
          # ⚠️ **직전 정식 릴리스**를 적는다(RC 가 아니다). 릴리스마다 함께 올린다.
          # java 레인에서 실측된 함정이다 — 자동 추론에 맡기면 RC 를 고를 수 있다.
          BASELINE: '1.0.0'
          JAPICMP: '0.26.1'
        run: |
          set -euo pipefail
          B="https://repo1.maven.org/maven2/io/github/xzawed/keycloak-sdk-kotlin/${BASELINE}/keycloak-sdk-kotlin-${BASELINE}.jar"
          J="https://repo1.maven.org/maven2/com/github/siom79/japicmp/japicmp/${JAPICMP}/japicmp-${JAPICMP}-jar-with-dependencies.jar"
          # ⚠️ `--proto '=https'` 가 있어야 `-L` 이 HTTP 로 강등되는 리다이렉트를 거부한다
          # (SonarCloud githubactions:S6506 이 잡은 실제 결함 — 억제하지 않고 고쳤다).
          curl -sSfL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/base.jar" "$B"
          curl -sSfL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/japicmp.jar" "$J"
          # `-f` 로 404 는 실패다 — 기준선이 없으면 조용히 통과시키지 않는다.
          ls -l "$RUNNER_TEMP/base.jar" "$RUNNER_TEMP/japicmp.jar"
      - name: japicmp (게시본 대비 바이너리 비호환이면 실패)
        run: |
          set -euo pipefail
          new=$(ls build/libs/keycloak-sdk-kotlin-*.jar | grep -vE -- '-(sources|javadoc)\.jar$' | head -1)
          echo "현재 JAR: $new"
          [ -n "$new" ] || { echo "::error::현재 JAR 을 찾지 못했다"; exit 1; }
          java -jar "$RUNNER_TEMP/japicmp.jar" \
            -o "$RUNNER_TEMP/base.jar" -n "$new" \
            --only-modified --ignore-missing-classes --error-on-binary-incompatibility
