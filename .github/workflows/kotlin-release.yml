name: kotlin-release

# 태그 드리븐 Maven Central(Central Portal) 릴리스. kotlin-v로 시작하는 태그 push에서만 트리거된다.
# ⚠️ 거버넌스: 실제 배포는 사람이 `kotlin-v*` 태그를 push해야만 실행되며(human-gated), publish 잡은
# 아래 4개 GitHub Secrets이 설정되어 있어야 동작한다. 미설정 시 publish 스텝이 스스로 건너뛴다(fail-open
# 아님 — verify는 항상 실행되고, publish만 조건부. dotnet-release.yml의 "NUGET_API_KEY 미설정 시 push
# 스텝 스킵" 관용과 동형 — ⚠️ GitHub Actions는 job-level `if:`에 secrets 컨텍스트를 노출하지 않아
# (github/needs/vars/inputs만) 반드시 스텝의 env-매핑된 값으로 가드해야 실제 동작한다):
#   - MAVEN_CENTRAL_USERNAME       : Central Portal(https://central.sonatype.com) 발급 토큰 username
#   - MAVEN_CENTRAL_PASSWORD       : 위 토큰 password
#   - SIGNING_IN_MEMORY_KEY        : 아티팩트 서명용 GPG 개인키(ASCII-armored, 키서버에 공개키 배포 완료 상태)
#   - SIGNING_IN_MEMORY_KEY_PASSWORD : 위 개인키의 패스프레이즈
# 4개 시크릿은 vanniktech `com.vanniktech.maven.publish` 플러그인(build.gradle.kts의 `mavenPublishing`
# 블록 — `publishToMavenCentral()` + `signAllPublications()`)이 인메모리 GPG 서명 + Central Portal 업로드에
# 그대로 소비하는 Gradle 프로젝트 프로퍼티(`mavenCentralUsername`/`mavenCentralPassword`/
# `signingInMemoryKey`/`signingInMemoryKeyPassword`)로, `ORG_GRADLE_PROJECT_` 접두 환경변수를 통해 주입한다
# (Gradle 관용 — `.gitignore`된 `gradle.properties`를 CI에서 대체).
# ⚠️ `publishToMavenCentral`은 Central Portal에 업로드까지만 수행한다 — 실제 공개(release) 버튼은
# Central Portal 콘솔에서 사람이 수동으로 누른다(Java `release.yml`과 동일한 2단계 사람 게이트:
# 1) 태그 push, 2) Portal에서 수동 릴리스).
on:
  push:
    tags: ['kotlin-v*']

jobs:
  # 발행 전 게이트: 태그된 커밋이 green이 아니면 릴리스하지 않는다.
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build test koverVerify ktlintCheck
      - name: Integration E2E (Docker, 실제 Keycloak 26.6)
        run: ./gradlew integrationTest

  publish:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # --no-configuration-cache: vanniktech maven.publish의 서명/업로드 태스크가 구성 캐시와
      # 완전히 호환되지 않는 알려진 제약(플러그인 문서 권고) — 릴리스 1회성 실행이라 비용 무시 가능.
      - name: Publish to Maven Central (Central Portal, in-memory GPG)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        # ⚠️ 시크릿 미설정(예: 사전등록 전 실수로 태그를 push) 시 스텝 내부에서 건너뛴다 — job-level `if:`는
        # secrets를 못 읽으므로(위 헤더 주석) env-매핑된 값으로 가드해야 실제로 스킵된다(dotnet 관용 동형).
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ]; then
            echo "::warning::MAVEN_CENTRAL_USERNAME 미설정 — Central Portal 업로드를 건너뜁니다(시크릿 사전등록 필요)."
            exit 0
          fi
          ./gradlew publishToMavenCentral --no-configuration-cache
