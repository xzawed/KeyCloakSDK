name: kotlin-release

# 태그 드리븐 Maven Central(Central Portal) 릴리스. kotlin-v로 시작하는 태그 push에서만 트리거된다.
# ⚠️ 거버넌스: 실제 배포는 사람이 `kotlin-v*` 태그를 push해야만 실행되며(human-gated), publish 잡은
# 아래 4개 GitHub Secrets이 **전부** 설정되어 있어야 동작한다. 하나라도 없으면 publish 스텝은
# 건너뛰지 않고 실패한다(fail-closed) — 특히 서명키가 없는 채로 업로드가 진행되면 green 실행에서
# 서명 없는 아티팩트가 Central Portal에 올라가므로, 미설정은 "스킵할 상황"이 아니라 사고다.
# ⚠️ GitHub Actions는 job-level `if:`에 secrets 컨텍스트를 노출하지 않으므로(github/needs/vars/inputs만)
# 반드시 스텝의 env-매핑된 값으로 가드해야 실제 동작한다:
#   - MAVEN_CENTRAL_USERNAME       : Central Portal(https://central.sonatype.com) 발급 토큰 username
#   - MAVEN_CENTRAL_PASSWORD       : 위 토큰 password
#   - SIGNING_IN_MEMORY_KEY        : 아티팩트 서명용 GPG 개인키(ASCII-armored, 키서버에 공개키 배포 완료 상태)
#   - SIGNING_IN_MEMORY_KEY_PASSWORD : 위 개인키의 패스프레이즈
# 4개 시크릿은 vanniktech `com.vanniktech.maven.publish` 플러그인(build.gradle.kts의 `mavenPublishing`
# 블록 — `publishToMavenCentral()` + `signAllPublications()`)이 인메모리 GPG 서명 + Central Portal 업로드에
# 그대로 소비하는 Gradle 프로젝트 프로퍼티(`mavenCentralUsername`/`mavenCentralPassword`/
# `signingInMemoryKey`/`signingInMemoryKeyPassword`)로, `ORG_GRADLE_PROJECT_` 접두 환경변수를 통해 주입한다
# (Gradle 관용 — `.gitignore`된 `gradle.properties`를 CI에서 대체).
# ⚠️ `publishToMavenCentral`은 Central Portal에 업로드까지만 수행한다 — 실제 공개(release) 버튼은
# Central Portal 콘솔에서 사람이 수동으로 누른다(Java `release.yml`과 동일한 2단계 사람 게이트:
# 1) 태그 push, 2) Portal에서 수동 릴리스).
on:
  push:
    tags: ['kotlin-v*']

# 최소권한: 워크플로 레벨 기본값을 두지 않고 **모든 잡이 자기 권한을 직접 선언**한다. 워크플로 레벨에
# `contents: read`를 두면 그 스코프를 실제로 쓰지 않는 잡까지 토큰에 읽기 권한을 갖기 때문이다
# (SonarQube `githubactions:S7637`. 이 저장소에서 그 규칙이 걸린 워크플로는 정확히 "체크아웃 없는 잡을
# 가진 넷" — java·dotnet·go·php — 이었다. 나머지 다섯은 모든 잡이 체크아웃해서 걸리지 않았다).
# ⚠️ 새 잡에는 반드시 `permissions:`를 함께 적을 것 — 빠뜨리면 워크플로 레벨 기본값이 아니라
# **저장소 기본 권한**(Settings → Actions)을 물려받는다. 그 값은 이 파일 바깥에서 바뀔 수 있다.
jobs:
  # 태그 접미사 = 릴리스 버전. 이 워크플로에서 버전을 유도하는 **유일한** 지점이다 — install-smoke와
  # publish가 각자 태그를 파싱하면 "게이트가 검증한 버전"과 "실제로 게시하는 버전"이 갈릴 수 있다.
  # 태그↔매니페스트 정합성 가드도 여기로 옮겼다: Central Portal은 스테이징된 좌표를 되돌릴 수 없으므로
  # 이 검증은 어떤 게이트보다 앞에 있어야 의미가 있다.
  version:
    runs-on: ubuntu-latest
    # 태그↔매니페스트 가드가 매니페스트를 읽어야 하므로 체크아웃이 필요하다
    permissions:
      contents: read
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # 추출 실패(빈 문자열)도 실패로 취급한다 — 조용히 빈 값이 되면 어떤 값과도 "다르다"고
      # 판정되지 않는 오검증이 생기기 때문이다. (행 앵커 `^version`은 plugins 블록의
      # `kotlin("jvm") version "..."`과 겹치지 않는다.)
      - id: derive
        name: Derive version from tag and verify it matches build.gradle.kts
        run: |
          VERSION="${GITHUB_REF_NAME#kotlin-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME}에서 'kotlin-v' 접두를 벗겨내지 못했다 — 버전 유도 불가(fail-closed)."
            exit 1
          fi
          ACTUAL=$(grep -m1 -E '^version[[:space:]]*=' kotlin/build.gradle.kts | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/' || true)
          if [ -z "$ACTUAL" ]; then
            echo "::error::kotlin/build.gradle.kts에서 version을 추출하지 못했다 — 정합성 검증 불가(fail-closed)."
            exit 1
          fi
          if [ "$VERSION" != "$ACTUAL" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${VERSION} but kotlin/build.gradle.kts declares ${ACTUAL}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} ↔ kotlin/build.gradle.kts ${ACTUAL} 일치"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 게시 직전 마지막 게이트 — 패키징된 산출물을 로컬 레지스트리에 올린 뒤 모노레포 바깥의 깨끗한
  # 컨테이너에서 설치해 quickstart를 돌린다. 소스 테스트가 통과해도 패키징 층(매니페스트 메타데이터·
  # 파일 포함규칙·게시 아티팩트 호환성)의 결함은 여기서만 드러난다 — 레지스트리에 태우기 전 마지막 기회다.
  # ⚠️ `version`을 넘기지 않으면 이 게이트는 태그와 무관한 기본 버전을 검증한다(install-smoke.yml 주석 참고).
  install-smoke:
    needs: version
    # 호출되는 install-smoke.yml이 체크아웃한다. ⚠️ 재사용 워크플로를 부르는 잡에서 `permissions:`를
    # 생략하면 호출된 워크플로는 저장소 기본 권한을 상한으로 받는다(GitHub 문서: "If jobs.<job_id>.permissions
    # is not specified in the calling job, the called workflow will have the default permissions for the
    # GITHUB_TOKEN"). 즉 여기 한 줄이 곧 호출된 워크플로의 권한 상한이다.
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
    with:
      lang: kotlin
      version: ${{ needs.version.outputs.version }}

  # 발행 전 게이트: 태그된 커밋이 green이 아니면 릴리스하지 않는다.
  verify:
    runs-on: ubuntu-latest
    # 체크아웃만 필요하다
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ./gradlew build test koverVerify ktlintCheck

  # 발행 전 게이트(2): koverVerify는 네트워크 경계(AuthClient/admin.*/KeycloakClient)를 omit하므로
  # kotlin-ci.yml과 동일하게 별도 잡으로 실 Keycloak E2E(FullFlowIT)를 돌린다 — publish의 `needs:`에
  # 명시적으로 들어가야 통합 미검증 상태로 Central Portal 업로드가 나가는 경로가 생기지 않는다.
  integration:
    name: Integration (testcontainers, 실제 Keycloak 26.6)
    needs: verify
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → testcontainers-keycloak 동작
    # 체크아웃만 필요하다
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Integration E2E (Docker, 실제 Keycloak 26.6 — FullFlowIT)
        run: ./gradlew integrationTest

  publish:
    needs: [version, verify, integration, install-smoke] # 단위/커버리지/린트 + 통합 E2E + 설치 스모크 전부 통과해야 업로드
    runs-on: ubuntu-latest
    # 체크아웃 + Central Portal 업로드 — GitHub Release를 만들지 않으므로 write는 불필요하다
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      # --no-configuration-cache: vanniktech maven.publish의 서명/업로드 태스크가 구성 캐시와
      # 완전히 호환되지 않는 알려진 제약(플러그인 문서 권고) — 릴리스 1회성 실행이라 비용 무시 가능.
      - name: Publish to Maven Central (Central Portal, in-memory GPG)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        # ⚠️ 4개 시크릿 중 하나라도 미설정이면 업로드하지 않고 **실패**한다(스킵 아님). 특히 서명키
        # 누락을 통과시키면 서명 없는 아티팩트가 Central Portal로 올라가는데 실행은 green이라 아무도
        # 알아채지 못한다. job-level `if:`는 secrets를 못 읽으므로(위 헤더 주석) env-매핑된 값으로 가드한다.
        run: |
          missing=""
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ] || missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] || missing="$missing SIGNING_IN_MEMORY_KEY"
          [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" ] || missing="$missing SIGNING_IN_MEMORY_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::필수 릴리스 시크릿 미설정 —$missing. 자격증명/서명키 없이 Central Portal 업로드를 진행할 수 없다(중단)."
            exit 1
          fi
          ./gradlew publishToMavenCentral --no-configuration-cache
