name: Node CI
on:
  push: { branches: [main], paths: ['node/**', '.github/workflows/node-ci.yml'] }
  pull_request: { branches: [main], paths: ['node/**', '.github/workflows/node-ci.yml'] }
  # 주간 레인 건강검진(환경 드리프트) — 근거는 .claude/rules/ci.md, 슬롯 표는 ci.yml 옆 주석.
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * 1'
# 최소권한: 이 워크플로의 잡은 소스를 읽고 빌드/검사만 한다(체크·코멘트·릴리스 쓰기 없음).
permissions:
  contents: read
jobs:
  build:
    name: Lint + typecheck + unit test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: ['22', '24'] }
    defaults: { run: { working-directory: node } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - name: Prettier (format check)
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Unit tests + 커버리지 게이트(로직 라인≥90 / 브랜치≥85)
        run: npm run test:unit
      - name: 공개 타입 표면 — 하위 라이브러리 타입 누출 (§4)
        # ⚠️ 소스가 아니라 **방출된 .d.ts** 를 본다. 소비자가 보는 것이 그것이고, tsc 가 무엇을
        # 지우는지는 선언을 봐야 안다. 그래서 build 뒤에 돈다(가드는 dist 가 없으면 실패한다).
        run: npm run build && node ../scripts/check-node-public-surface.mjs ..
      - name: npm audit (프로덕션 의존성 취약점 — high 이상)
        run: npm audit --audit-level=high --omit=dev

  integration:
    name: Integration tests (testcontainers, 실제 Keycloak)
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → testcontainers 동작
    defaults: { run: { working-directory: node } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - name: Integration E2E (Docker, 실제 Keycloak 26.6)
        run: npm run test:it
