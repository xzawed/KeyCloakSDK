name: CI
on:
  push: { branches: [main], paths: ['java/**', '.github/workflows/ci.yml'] }
  pull_request: { branches: [main], paths: ['java/**', '.github/workflows/ci.yml'] }
jobs:
  build:
    name: Build & unit test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix: { java: ['21'] }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '${{ matrix.java }}', cache: 'maven' }
      - name: Build & unit test (커버리지 게이트 90/85 포함)
        run: mvn -B -f java/pom.xml verify -DskipITs=true

  integration:
    name: Integration tests (Testcontainers, 실제 Keycloak)
    runs-on: ubuntu-latest   # ubuntu 러너는 Docker 내장 → Testcontainers 동작
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21', cache: 'maven' }
      - name: Full verify (단위 + 통합 IT)
        run: mvn -B -f java/pom.xml verify

  # jackson-databind CVE(2026-54512..54518) 무위험 판정은 "SDK가 default/polymorphic typing을
  # 켜지 않고 커스텀 JAX-RS Jackson provider를 등록하지 않는다"는 불변식에 의존한다(verification-log.md).
  # 문서로만 두면 미래 기여자가 깨뜨릴 수 있으므로 CI에서 소스 스캔으로 강제한다.
  invariant:
    name: Security invariant (Jackson no default/polymorphic typing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 금지 대상은 default/polymorphic typing과 **자체 제작** ObjectMapper/Jackson provider다.
      # 상류 `org.keycloak.admin.client.JacksonProvider`를 그대로 등록하는 것은 오히려 필수다 —
      # 우리가 타임아웃 주입을 위해 커스텀 JAX-RS 클라이언트를 넘기면 admin-client의 자동 등록이
      # 우회되어 NON_NULL·FAIL_ON_UNKNOWN_PROPERTIES=false를 잃기 때문이다(AdminClient 참고).
      # 그 등록은 아래 패턴에 걸리지 않으며, 걸려서도 안 된다.
      - name: Assert SDK source keeps Jackson deserialization safe
        run: |
          hits=$(
            { find java -path '*/src/main/*' -name '*.java'
              find kotlin -path '*/src/main/*' -name '*.kt'
            } | xargs grep -lnE 'activateDefaultTyping|enableDefaultTyping|@JsonTypeInfo|ContextResolver<' 2>/dev/null || true
          )
          if [ -n "$hits" ]; then
            echo "::error::SDK 소스는 Jackson default/polymorphic typing 활성화나 자체 JAX-RS Jackson provider(ContextResolver) 등록을 금지합니다 — jackson-databind CVE 무위험 불변식 위반(docs/governance/verification-log.md). 상류 admin-client의 JacksonProvider 등록은 허용이며 이 패턴에 걸리지 않습니다."
            echo "$hits"
            exit 1
          fi
          echo "OK: no default/polymorphic Jackson typing in java/*/src/main or kotlin/src/main"
