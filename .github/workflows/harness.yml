name: harness
on:
  push:
    paths: ['harness/**', 'go/**', '.github/workflows/harness.yml']
  pull_request:
    paths: ['harness/**', 'go/**', '.github/workflows/harness.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # 매일 03:00 UTC 야간 5언어 비교
permissions:
  contents: read
jobs:
  mvp-go:
    # 빠른 PR 게이트(Go 스모크) — push/PR 트리거에만
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22' }
      - name: 하네스 실행(Go MVP)
        run: cd harness && ./run.sh go
      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-results-go
          path: harness/report/RESULTS.md

  all-langs:
    # 5언어 k6 성능비교(레거시 run.sh) — 수동(workflow_dispatch) + 야간(schedule)에만
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22' }
      - name: 하네스 실행(5개 언어 비교)
        run: cd harness && ./run.sh go dotnet node python java
      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-results-all
          path: harness/report/RESULTS.md

  score-all:
    # 9언어 종합 검증·스코어링(conformance+security+suites+score → SCORECARD.md) — 수동+야간에만
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22' }
      - name: 9언어 종합 검증·스코어링
        # ⚠️ 언어를 인자로 넘기지 않는다 — 스크립트의 기본값이 곧 아홉 언어이고, 여기 다시
        # 적으면 열 번째 언어가 한쪽에만 들어가 **조용히 안 돌아간다**. 인자 문자열이
        # 기본값과 바이트 동일임을 확인하고 지웠다(2026-09-06).
        run: cd harness && ./verify.sh
      - name: 스코어카드 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard
          path: harness/report/SCORECARD.md
      - name: 신호 파일 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signals
          path: harness/report/signals/

  install-all:
    # 9언어 설치·동작 검증(로컬 레지스트리에서 게시 패키지 설치 → quickstart+conformance+security)
    # → INSTALL-MATRIX.md. 수동(workflow_dispatch)+야간(schedule)에만. Docker 빌드 무거워 타임아웃 넉넉히.
    # 부분실패 격리 — 한 언어가 실패해도 나머지 언어는 계속 검증하지만(격리, 매트릭스가 결과 담체),
    # install-verify.sh --strict가 실패 언어가 있으면 exit 1을 내므로 잡은 RED가 된다(PR 0 Task 8 —
    # 이전엔 무조건 exit 0이라 java/php가 publish에서 죽어도 조용한 초록이었다).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: '22' }
      - name: 9언어 설치·동작 검증
        # ⚠️ 위와 같은 이유로 인자를 넘기지 않는다(기본값과 바이트 동일임을 확인했다).
        run: cd harness/install && ./install-verify.sh
      - name: 설치 매트릭스 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: install-matrix
          path: harness/install/report/INSTALL-MATRIX.md
      - name: 설치 신호 파일 업로드
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: install-signals
          path: harness/install/report/signals/
