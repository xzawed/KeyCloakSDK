name: php-release
on:
  push:
    tags: ['php-v*']

# 최소권한: 워크플로 레벨 기본값을 두지 않고 **모든 잡이 자기 권한을 직접 선언**한다. 워크플로 레벨에
# `contents: read`를 두면 그 스코프를 실제로 쓰지 않는 잡까지 토큰에 읽기 권한을 갖기 때문이다
# (SonarQube `githubactions:S7637`. 이 저장소에서 그 규칙이 걸린 워크플로는 정확히 "체크아웃 없는 잡을
# 가진 넷" — java·dotnet·go·php — 이었다. 나머지 다섯은 모든 잡이 체크아웃해서 걸리지 않았다).
# ⚠️ 새 잡에는 반드시 `permissions:`를 함께 적을 것 — 빠뜨리면 워크플로 레벨 기본값이 아니라
# **저장소 기본 권한**(Settings → Actions)을 물려받는다. 그 값은 이 파일 바깥에서 바뀔 수 있다.
jobs:
  # 태그 접미사 = 릴리스 버전. 이 워크플로에서 버전을 유도하는 **유일한** 지점이다 — install-smoke와
  # split이 각자 태그를 파싱하면 "게이트가 검증한 버전"과 "실제로 미러에 태그되는 버전"이 갈릴 수 있다.
  # ⚠️ php에는 태그↔매니페스트 가드가 없다. php/composer.json이 버전을 선언하지 않고(Composer는
  # 태그에서 버전을 읽는다) 릴리스가 미러 저장소에 `v$VERSION` 태그를 **새로 만들기** 때문이다.
  # 하네스도 같은 모양으로 격리 repo에 `v$PKG_VER` 태그를 합성하므로, 버전을 넘겨받지 못하면
  # install-smoke가 그냥 실패하는 게 아니라 **조용히 다른 버전을 검증하고 통과한다**.
  version:
    runs-on: ubuntu-latest
    # 태그 문자열만 파싱한다 — 체크아웃도 API 호출도 없어 토큰 스코프가 전혀 필요없다
    permissions: {}
    outputs:
      version: ${{ steps.derive.outputs.version }}
      # 프리릴리스 여부도 **버전과 같은 지점에서 한 번만** 유도한다. 릴리스 잡이 태그를 다시
      # 파싱하면 "게이트가 검증한 버전"과 "GitHub Release에 붙는 표시"가 갈릴 수 있다 —
      # 버전 스레딩과 정확히 같은 원칙이다(그리고 이 잡은 체크아웃이 없어 공유 스크립트를
      # 부를 수 없다 — `permissions: {}`를 지키려면 판정은 인라인이어야 한다).
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - id: derive
        name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#php-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME}에서 'php-v' 접두를 벗겨내지 못했다 — 버전 유도 불가(fail-closed)."
            exit 1
          fi
          # >>> prerelease-classify — 세 릴리스 워크플로(go·dotnet·php)가 **글자 그대로** 공유하는 블록이다.
          # scripts/test/test-release-prerelease.sh가 이 마커 사이를 떼어내 셋의 동일성을 대조하고 분류표를
          # 실행한다 — 한 곳만 고치면 자가테스트가 빨개진다.
          #
          # 접미사 목록을 박지 않는다. 아홉 언어의 표기가 서로 다르고(SemVer `0.1.0-rc.1` · Maven/Kotlin
          # `0.1.0-RC1`·`-SNAPSHOT` · PEP 440 `0.1.0rc1` · RubyGems `0.1.0.rc1` — DEPLOY.md §7) 목록은
          # 표기가 바뀌는 순간 **조용히** 틀린다. 대신 정식 릴리스의 모양을 정의하고 나머지를 판별한다:
          #   1) 빌드 메타데이터(`+…`)를 먼저 떼어낸다 — SemVer에서 `+` 뒤는 프리릴리스가 아니고
          #      `1.0.0+incompatible`은 **정식** go 모듈 버전이다. 정식이 프리릴리스로 오분류되는 경로는
          #      이것뿐이라, 이 한 줄이 곧 오탐 방지책이다(오탐은 이 커밋이 고치는 버그보다 나쁘다 —
          #      정식 0.1.0이 releases/latest에서 사라진다).
          #   2) 남은 것이 숫자와 점뿐이면(`0.1.0`·`1.0.0`·`0.10.0`·NuGet 4마디 `1.2.3.4`) 정식이다.
          #   3) 하이픈(SemVer 프리릴리스 구분자)이나 알파벳(PEP 440·RubyGems·Maven 표기)이 있으면
          #      프리릴리스다.
          #   4) 둘 다 아니면 판정하지 않고 **실패한다**. 모르는 표기를 정식으로 넘기면 RC가 저장소의
          #      Latest release가 되고(php-v0.1.0-rc.1에서 실제로 일어난 일), 프리릴리스로 넘기면 정식이
          #      숨는다. 어느 쪽으로도 추측하지 않는다.
          CORE="${VERSION%%+*}"
          case "$CORE" in
            '' | *[!0-9.]*) NUMERIC_ONLY=false ;;
            *) NUMERIC_ONLY=true ;;
          esac
          case "$CORE" in
            *-* | *[A-Za-z]*) HAS_MARKER=true ;;
            *) HAS_MARKER=false ;;
          esac
          if [ "$NUMERIC_ONLY" = true ]; then
            PRERELEASE=false
          elif [ "$HAS_MARKER" = true ]; then
            PRERELEASE=true
          else
            echo "::error::버전 '${VERSION}'을 정식(숫자 마디)으로도 프리릴리스(하이픈/알파벳)로도 판정할 수 없다 — GitHub Release 표시를 추측하지 않고 중단한다(fail-closed)."
            exit 1
          fi
          # <<< prerelease-classify
          echo "releasing xzawed/keycloak-sdk ${VERSION} (from tag ${GITHUB_REF_NAME}) — prerelease=${PRERELEASE}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  # 게시 직전 마지막 게이트 — 패키징된 산출물을 로컬 레지스트리에 올린 뒤 모노레포 바깥의 깨끗한
  # 컨테이너에서 설치해 quickstart를 돌린다. 소스 테스트가 통과해도 패키징 층(매니페스트 메타데이터·
  # 파일 포함규칙·게시 아티팩트 호환성)의 결함은 여기서만 드러난다 — 레지스트리에 태우기 전 마지막 기회다.
  install-smoke:
    needs: version
    # 호출되는 install-smoke.yml이 체크아웃한다. ⚠️ 재사용 워크플로를 부르는 잡에서 `permissions:`를
    # 생략하면 호출된 워크플로는 저장소 기본 권한을 상한으로 받는다(GitHub 문서: "If jobs.<job_id>.permissions
    # is not specified in the calling job, the called workflow will have the default permissions for the
    # GITHUB_TOKEN"). 즉 여기 한 줄이 곧 호출된 워크플로의 권한 상한이다.
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
    with:
      lang: php
      version: ${{ needs.version.outputs.version }}

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 검증만 한다 — GitHub Release 생성은 split 잡의 몫
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit && vendor/bin/phpstan analyse && vendor/bin/phpunit --testsuite unit

  # 발행 전 게이트(2): verify의 `--testsuite unit`은 네트워크 경계(AuthClient/Admin/KeycloakClient)를
  # 건드리지 않는다 — php-ci.yml의 integration 잡과 동일한 실 Keycloak E2E를 태그 경로에서도 돌린다.
  # (IT는 Testcontainers가 아니라 `docker` CLI 셸아웃이지만 ubuntu-latest는 Docker가 내장이라 조건 없이
  #  그대로 동작한다 — php-ci.yml의 같은 잡도 `if:` 가드 없이 ubuntu-latest에서 돈다.)
  integration:
    name: Integration (docker CLI 셸아웃, 실제 Keycloak 26.6)
    runs-on: ubuntu-latest
    permissions:
      contents: read # 검증만 한다 — GitHub Release 생성은 split 잡의 몫
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --testsuite integration

  # ⚠️ 왜 subtree split이 필요한가 — Composer의 VCS 드라이버는 저장소 **루트**의 composer.json만
  # 읽는다. 저장소 안의 하위 디렉터리를 패키지 루트로 지정하는 수단이 없고(Packagist도 서브디렉터리를
  # 지원하지 않는다), 이 모노레포 루트에는 composer.json이 아예 없다(php/composer.json 하나뿐).
  # 즉 "태그만 밀면 Packagist가 웹훅으로 알아서 갱신된다"는 성립할 수 없다.
  # 그래서 Packagist에 등록되는 대상은 이 모노레포가 아니라 php/ 하위트리만 떼어낸 **읽기전용 미러**
  # `xzawed/keycloak-sdk-php`이고, Composer가 버전으로 파싱할 수 있도록 접두어 없는 `vX.Y.Z` 태그가
  # 그 저장소에 있어야 한다(`php-vX.Y.Z`는 Composer가 버전으로 파싱하지 못한다).
  # harness/install/publish/php.sh가 로컬 Satis 검증에서 쓰는 전제와 동일하다.
  split:
    name: Split php/ → xzawed/keycloak-sdk-php (Packagist source)
    needs: [version, verify, integration, install-smoke] # 미러 push(=Packagist 게시)는 되돌릴 수 없다 — 세 게이트 통과 후에만
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release create` — 미러 저장소 push는 PHP_SPLIT_TOKEN을 쓰므로 무관하다
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # git subtree split은 전체 히스토리가 필요하다(shallow 체크아웃이면 실패)
          persist-credentials: false
      - name: Split php/ subtree and push it to the mirror repository
        env:
          PHP_SPLIT_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$PHP_SPLIT_TOKEN" ]; then
            echo "::error::PHP_SPLIT_TOKEN 미설정 — xzawed/keycloak-sdk-php로 subtree를 push할 수 없고, 그러면 Packagist 게시 경로가 없다. 배포를 중단한다."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # splitsh-lite가 더 빠르지만 러너에 없는 추가 의존성이라 러너 기본 제공 git subtree를 쓴다.
          git subtree split --prefix=php -b php-split
          REMOTE="https://github.com/xzawed/keycloak-sdk-php.git"
          # ⚠️ 토큰을 remote URL(`https://x-access-token:TOKEN@github.com/...`)에 넣지 않는다 — 그 형태는
          # `git remote -v`·reflog·git 오류 출력에 그대로 남고, URL 안의 자격증명은 정적분석에서도
          # 취약점으로 잡힌다. credential helper가 push 시점에 환경변수에서 읽게 하면 토큰이 URL에도
          # 명령행에도 남지 않는다(헬퍼 본문에는 변수명만 있고 값은 셸이 확장하지 않는다 — 작은따옴표).
          git config --local credential.helper \
            '!f() { echo username=x-access-token; echo "password=$PHP_SPLIT_TOKEN"; }; f'
          # 미러 브랜치는 이 워크플로가 만드는 생성물이라 강제 갱신한다.
          git push --force "$REMOTE" php-split:refs/heads/main
          # ⚠️ 로컬 `git tag v$VERSION`을 만들지 않는다 — 이 모노레포의 `v*` 태그 네임스페이스는 Java
          # SDK가 쓰고 있어 같은 이름이 이미 존재하면 태그 생성이 실패한다. 로컬 브랜치 ref를 원격
          # 태그 ref로 직접 push하면 미러에만 lightweight 태그가 생겨 충돌이 없다.
          # 태그는 강제 갱신하지 않는다 — 이미 존재하면 push가 실패해야 "태워버린 버전"을 사람이
          # 알아챈다(NuGet `--skip-duplicate` 제거와 동일한 원칙).
          git push "$REMOTE" "php-split:refs/tags/v${VERSION}"
          echo "pushed xzawed/keycloak-sdk-php v${VERSION} ($(git rev-parse --short php-split))"
      # ⚠️ `--prerelease`를 붙이지 않으면 GitHub은 RC를 저장소의 **Latest release**로 내건다
      # (php-v0.1.0-rc.1의 첫 실행에서 실제로 그랬다 — 파이프라인은 전부 green이었고 이것만 틀렸다).
      # 불리언은 `--prerelease=true|false`로 **명시**한다: 값이 비거나 오염되면 gh의 pflag가
      # `strconv.ParseBool` 오류로 즉사하므로, 판정이 깨졌을 때 조용히 "정식"으로 흘러가지 않는다.
      # (미러 저장소의 `v${VERSION}` 태그는 영향받지 않는다 — Composer는 태그 문자열에서 스스로
      #  안정성을 읽어 `minimum-stability: stable`에서 RC를 이미 제외한다. 틀린 것은 GitHub 표시뿐이다.)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          {
            printf 'PHP SDK %s — Composer package `xzawed/keycloak-sdk`.\n\n' "${GITHUB_REF_NAME}"
            printf 'Packagist does not watch this monorepo. Composer'"'"'s VCS driver only reads a `composer.json` at the repository root, and there is none here (only `php/composer.json`), so a subdirectory cannot be published directly.\n\n'
            printf 'This release therefore splits `php/` into the read-only mirror repository https://github.com/xzawed/keycloak-sdk-php and tags it `v%s` there. That mirror is what is registered on Packagist; it is generated by this workflow and must not be committed to directly.\n\n' "${VERSION}"
            printf 'Install: `composer require xzawed/keycloak-sdk:^%s`\n' "${VERSION}"
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --prerelease="${PRERELEASE}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
