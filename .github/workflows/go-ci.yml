name: Go CI
on:
  push: { branches: [main], paths: ['go/**', '.github/workflows/go-ci.yml'] }
  pull_request: { branches: [main], paths: ['go/**', '.github/workflows/go-ci.yml'] }
  # 주간 레인 건강검진(환경 드리프트) — 근거는 .claude/rules/ci.md, 슬롯 표는 ci.yml 옆 주석.
  workflow_dispatch:
  schedule:
    - cron: '7 6 * * 1'
# 최소권한: 이 워크플로의 잡은 소스를 읽고 빌드/검사만 한다(체크·코멘트·릴리스 쓰기 없음).
permissions:
  contents: read
jobs:
  build:
    name: Build + lint + unit (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix: { go: ['1.25', '1.26'] } # 최소 지원(go.mod) + 최신 마이너
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '${{ matrix.go }}'
          cache-dependency-path: go/go.sum
      - name: gofmt (format check)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo '::error::gofmt formatting issues'; exit 1; }
      - name: go vet
        run: go vet ./...
      # 린터를 `go run`으로 실행 — 러너의 Go(1.25/1.26)로 빌드되므로 golangci-lint가
      # "built with lower Go than the module's go directive"로 거부하는 결합 문제를 피한다.
      # 버전은 핀한다(재현성 + 공급망: @latest는 실행 시점의 임의 코드를 CI에서 실행하는 위험).
      # Go 체크섬 DB(sum.golang.org)가 핀된 버전의 무결성을 검증한다. (.golangci.yml은 로컬용)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: gosec (보안 린터)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -quiet ./...
      - name: Unit tests + 커버리지 게이트 (로직 ≥90, 네트워크 경계 omit)
        run: |
          go test ./... -coverprofile=cover.out
          # 네트워크 경계(auth/admin/client)는 통합테스트로 검증 → 커버리지 게이트에서 제외
          grep -vE '/(auth|admin|admin_users|admin_clients|admin_realms|admin_roles|admin_groups|client)\.go:' cover.out > cover.logic.out
          pct=$(go tool cover -func=cover.logic.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "logic coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN { exit (p+0 < 90) }' || { echo "::error::logic coverage ${pct}% < 90%"; exit 1; }

  # SECURITY.md가 약속하는 "언어별 의존성 취약점 감사"의 Go 구현(cargo audit·npm audit·composer
  # audit·bundler-audit·pip-audit와 같은 하드 게이트). govulncheck는 vuln.go.dev의 Go 취약점 DB를
  # 대조하되 **실제로 도달 가능한 심볼**만 보고하므로 오탐이 적다(표준 라이브러리 취약점도 포함).
  vulncheck:
    name: govulncheck (의존성·표준 라이브러리 취약점)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          # ⚠️ `check-latest`가 없으면 setup-go가 **러너 툴캐시에 이미 있는** 패치를 그대로 쓴다.
          # 표준 라이브러리 취약점은 패치 릴리스로 고쳐지므로, 캐시가 낡으면 이 게이트는
          # "고쳐진 것을 못 고쳐졌다고" 보고한다 — 2026-08-14에 실제로 그랬다(러너 go1.26.5,
          # 수정본 go1.26.6, 신규 권고 GO-2026-6088·5972·5026 등 5건이 stdlib에서 검출).
          # 다른 잡(build/test 매트릭스)은 소비자 하한을 재현해야 하므로 캐시를 그대로 쓴다 —
          # 최신 패치 강제는 **이 보안 잡에만** 건다.
          check-latest: true
          cache-dependency-path: go/go.sum
      # 위 staticcheck/gosec와 동일한 형태(`go run <pkg>@<버전>`)로 실행한다 — 버전을 핀해 재현성과
      # 공급망을 지키고(무결성은 sum.golang.org가 검증), 별도 설치 단계·GOPATH 조작이 필요없다.
      # 취약점 DB는 실행 시점에 받으므로 도구를 핀해도 탐지 결과가 낡지 않는다.
      # ⚠️ 단 **툴체인 자체**는 낡을 수 있다 — 그래서 위 `check-latest`가 필요하다.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  integration:
    name: Integration (testcontainers, 실제 Keycloak)
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → testcontainers 동작
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - name: Integration E2E (Docker, 실제 Keycloak 26.6)
        run: go test -tags=integration -run TestE2E -count=1 ./...

  api-compat:
    name: gorelease (공개 API 파괴적 변경)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    # ⚠️ **gorelease 의 종료코드를 게이트로 쓰면 안 된다 — 파괴적 변경을 찾아내고도 exit 0 이다.**
    # 실측(변이: `(*Client).Close` 제거): 리포트에 `## incompatible changes / (*Client).Close: removed`
    # 가 나왔는데도 rc=0 이었고, `-version v0.1.2` 를 줘도 "valid semantic version" 으로 통과했다.
    # 이유는 Go 모듈 규약이 **v0.x 를 호환성 보증 대상에서 제외**하기 때문이다 — 즉 이 도구는
    # 1.0 이전에는 종료코드로 아무것도 막지 못한다. 그래서 **리포트 본문**을 근거로 삼는다.
    # 이 형태는 0.x 에서도 지금 바로 작동하고, 1.0 이후에도 그대로 유효하다.
    steps:
      # ⚠️ gorelease 는 더러운 트리를 거부하고(`repo has uncommitted changes`) 기준선 태그를
      # 찾으려면 전체 이력이 필요하다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - run: go install golang.org/x/exp/cmd/gorelease@latest
      - name: gorelease (직전 릴리스 자동 추론 → 비호환 변경 0건)
        run: |
          set -euo pipefail
          # -base 를 주지 않으면 직전 릴리스를 자동 추론한다("Inferred base version") — 태그를
          # 하드코딩하지 않으므로 릴리스마다 갱신할 자리가 없다.
          out="$(gorelease 2>&1)" || true
          echo "$out"
          if printf '%s' "$out" | grep -q '^## incompatible changes'; then
            echo "::error::직전 릴리스 대비 비호환 변경이 있다 — 1.0 은 이것을 major 없이 허용하지 않는다"
            exit 1
          fi
          printf '%s' "$out" | grep -q 'Inferred base version' || {
            echo "::error::기준선을 추론하지 못했다 — 비교가 일어나지 않았으므로 실패로 본다"; exit 1; }
