name: public-install

# **공개 레지스트리에 게시된 SDK** 를 새 소비자처럼 설치해 README 예제를 실 Keycloak 에 대고 돌린다(등록부
# public-registry-install-smoke). 설치 하네스(harness.yml 의 install-all · 릴리스의 install-smoke)는 아티팩트를 빌드해
# **로컬** 레지스트리에 올린 게시 전 판을 잰다 — 게시된 판이 오늘의 생태계(전이 의존 · 레지스트리 처리)에서 설치되고
# 동작하는지는 이 워크플로만 본다. 절차 · 판을 고르는 규칙은 scripts/public-install-smoke.sh 머리가 소유한다.
#
# ⚠️ **required 가 되어서는 안 된다** — 공개 레지스트리 · Keycloak 이미지 · 전이 의존에 기대는 검사다(published-floor.yml 과
# 같은 이유: 네트워크가 흔들리면 저장소가 잠긴다).
# ⚠️ **언어마다 Keycloak 을 새로 띄운다**(잡 하나 = 언어 하나) — php · rust · kotlin 예제가 같은 사용자(demo-user)를 만든다.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 4' # 매주 목요일 05:30 UTC — harness 매일 03:00 · security-audit 월 04:00 · 레인 월 05:07~07:47 · published-floor 화 05:30 · mutation-sweep 수 05:30 과 겹치지 않게
  pull_request:
    branches: [main]
    # ⚠️ 스크립트가 쓰는 파일도 받는다 — 렐름 · 하네스 quickstart · kotlin 감사 init script(scripts/check-workflow-paths.mjs 가
    # 대조한다). 빼면 그 파일만 고친 PR 에서 이 스모크가 돌지 않는다.
    paths: ['.github/workflows/public-install.yml', 'scripts/public-install-smoke.sh', 'harness/keycloak/harness-realm.json', 'harness/install/quickstart/**', 'harness/install/consume/java-quickstart-pom.xml', 'scripts/gradle/osv-audit-init.gradle']

# 최소권한: 소스를 읽고 공개 레지스트리 · 컨테이너 레지스트리에서 받기만 한다.
permissions:
  contents: read

jobs:
  smoke:
    name: 공개 레지스트리 설치 스모크 — ${{ matrix.lang }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lang: [java, python, node, go, dotnet, php, rust, ruby, kotlin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: matrix.lang == 'java' || matrix.lang == 'kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - if: matrix.lang == 'python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - if: matrix.lang == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - if: matrix.lang == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - if: matrix.lang == 'dotnet'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.0.x'
      - if: matrix.lang == 'php'
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer
      - if: matrix.lang == 'rust'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - if: matrix.lang == 'ruby'
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: '3.3'
      - name: Keycloak(하네스 렐름 it-realm)
        run: bash scripts/public-install-smoke.sh keycloak-up
      - name: 공개 레지스트리에서 설치 · README 예제 실행
        env:
          SMOKE_LANG: ${{ matrix.lang }}
        run: bash scripts/public-install-smoke.sh "$SMOKE_LANG"
