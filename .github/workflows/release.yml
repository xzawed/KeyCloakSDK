name: Release

# 태그 드리븐 Maven Central 릴리스 (WBS 7.2). v로 시작하는 태그 push에서만 트리거된다.
# ⚠️ 거버넌스: 실제 배포(mvn ... deploy)는 사람이 태그를 push해야만 실행되며(human-gated),
# 아래 4개 GitHub Secrets이 **전부** 설정되어 있어야 동작한다. 하나라도 없으면 체크아웃 직후
# preflight 스텝이 누락된 이름을 전부 나열하고 실패한다(fail-closed). 예전에는 setup-java/settings.xml
# 준비까지 성공한 뒤 deploy 스텝의 인증/서명 실패로 터졌는데, 그 오류는 원인이 "시크릿 미설정"임을
# 알려주지 않는다(kotlin-release.yml의 publish 잡과 같은 관용으로 맞춘다).
# ⚠️ GitHub Actions는 job-level `if:`에 secrets 컨텍스트를 노출하지 않으므로(github/needs/vars/inputs만)
# 반드시 스텝의 env-매핑된 값으로 가드해야 실제 동작한다:
#   - MAVEN_GPG_PRIVATE_KEY : 아티팩트 서명용 GPG 개인키 (armored, 키서버에 공개키 배포 완료 상태)
#   - MAVEN_GPG_PASSPHRASE  : 위 개인키의 패스프레이즈
#   - CENTRAL_TOKEN_USER    : Central Portal(https://central.sonatype.com) 발급 토큰 username
#   - CENTRAL_TOKEN_PW      : Central Portal 발급 토큰 password
#
# ⚠️ **미납 실측 — 이번 릴리스에서 갚을 것**(#316 이 약속했고 아직 아무 태그도 안 밀렸다).
# setup-java 가 v5 → v6.0.0 으로 옮겨졌는데 이 경로는 `push: tags:` 전용이라 PR 체크가 한 번도
# 건드리지 않았다. **초록만 보지 말고 GPG 임포트 로그를 직접 읽는다**:
#   gh run view <run> --log | grep -E 'Importing private gpg key|Removing private key from isolated GPG home'
# 판정: 뒤 문자열(post 스텝)이 **사후 성공 마커**다 — v6.0.0 은 임포트가 성공해야 STATE_GPG_HOME 을
# 저장하고, cleanup 은 그 state 가 있을 때만 그 줄을 낸다(src/auth.ts:63-66 · cleanup-java.ts:12-17).
# 앞 문자열은 임포트 **직전**에 찍히므로 그것만으로는 성공 증거가 아니다. 키 id·지문은 찍히지 않는다
# (`gpg --batch --import` 를 `silent: true` 로 돌린다) — 지문을 grep 하려 들지 말 것.
# 이 실측을 마치면 이 블록을 지운다.
on:
  push:
    tags: ['v*']

# 최소권한: 워크플로 레벨 기본값을 두지 않고 **모든 잡이 자기 권한을 직접 선언**한다. 워크플로 레벨에
# `contents: read`를 두면 그 스코프를 실제로 쓰지 않는 잡까지 토큰에 읽기 권한을 갖기 때문이다
# (SonarQube `githubactions:S7637`. 이 저장소에서 그 규칙이 걸린 워크플로는 정확히 "체크아웃 없는 잡을
# 가진 넷" — java·dotnet·go·php — 이었다. 나머지 다섯은 모든 잡이 체크아웃해서 걸리지 않았다).
# ⚠️ 새 잡에는 반드시 `permissions:`를 함께 적을 것 — 빠뜨리면 워크플로 레벨 기본값이 아니라
# **저장소 기본 권한**(Settings → Actions)을 물려받는다. 그 값은 이 파일 바깥에서 바뀔 수 있다.
# ⚠️ 같은 릴리스가 **겹쳐 돌지 않게** 한다. `cancel-in-progress: false` 는 의도다 — 게시 도중
# 취소하는 것이 큐에서 기다리는 것보다 나쁘다(반쯤 올라간 아티팩트는 되돌릴 수 없다).
# 그룹 키에 ref 를 넣는다 — 서로 다른 버전은 각자 다른 아티팩트를 올리므로 직렬화할 이유가 없고, 막아야 하는 것은 **같은 태그가 두 번 도는 것**(실패 후 태그를 옮겨 다시 미는 흐름)이다.
# ⚠️ concurrency 가 지켜주는 것은 **실행 중**인 잡뿐이다. 같은 그룹에서 **대기 중**이던 실행은
# 세 번째가 큐에 들어올 때 GitHub 이 취소한다 — 태그를 연달아 셋 밀지 말 것(DEPLOY.md §4).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 태그 접미사 = 릴리스 버전. 이 워크플로에서 버전을 유도하는 **유일한** 지점이다 — install-smoke와
  # deploy가 각자 태그를 파싱하면 "게이트가 검증한 버전"과 "실제로 게시하는 버전"이 갈릴 수 있다.
  # ⚠️ java에는 태그↔매니페스트 가드가 없다. POM이 main에서 -SNAPSHOT을 유지하고 릴리스 때
  # `versions:set`으로 태그값을 **덮어쓰기** 때문이다(아래 release 잡). 그래서 install-smoke가
  # 버전을 넘겨받지 못하면 그냥 실패하는 게 아니라 **조용히 다른 버전을 검증하고 통과한다** —
  # 하네스의 publish/java.sh도 같은 방식으로 버전을 덮어쓰기 때문이다. 이 잡이 그 구멍을 막는다.
  version:
    runs-on: ubuntu-latest
    # 태그 문자열만 파싱한다 — 체크아웃도 API 호출도 없어 토큰 스코프가 전혀 필요없다
    permissions: {}
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      - id: derive
        name: Derive version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 ${GITHUB_REF_NAME}에서 'v' 접두를 벗겨내지 못했다 — 버전 유도 불가(fail-closed)."
            exit 1
          fi
          echo "releasing io.github.xzawed:* version ${VERSION} (from tag ${GITHUB_REF_NAME})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # 게시 직전 마지막 게이트 — 패키징된 산출물을 로컬 레지스트리에 올린 뒤 모노레포 바깥의 깨끗한
  # 컨테이너에서 설치해 quickstart를 돌린다. 소스 테스트가 통과해도 패키징 층(매니페스트 메타데이터·
  # 파일 포함규칙·게시 아티팩트 호환성)의 결함은 여기서만 드러난다 — 레지스트리에 태우기 전 마지막 기회다.
  install-smoke:
    needs: version
    # 호출되는 install-smoke.yml이 체크아웃한다. ⚠️ 재사용 워크플로를 부르는 잡에서 `permissions:`를
    # 생략하면 호출된 워크플로는 저장소 기본 권한을 상한으로 받는다(GitHub 문서: "If jobs.<job_id>.permissions
    # is not specified in the calling job, the called workflow will have the default permissions for the
    # GITHUB_TOKEN"). 즉 여기 한 줄이 곧 호출된 워크플로의 권한 상한이다.
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
    with:
      lang: java
      version: ${{ needs.version.outputs.version }}

  # 발행 전 게이트 — 실제 Keycloak 컨테이너로 통합 E2E를 돌리고, 통과해야만 release 잡이 시작된다.
  # ⚠️ 이 잡은 구조를 위해 존재한다. `mvn -Prelease deploy`도 lifecycle상 verify(failsafe)를 먼저
  # 지나므로 "이미 게이트가 있다"고 볼 수도 있지만, 그 보장은 프로파일·플래그 한 줄로 조용히
  # 사라진다(`-DskipITs` 하나면 끝이다). 나머지 8개 언어는 전부 `needs: integration`으로 게이트를
  # 잡 경계에 명시하고 있어, java만 다른 형태로 남아 있었다 — 같은 관용으로 맞춘다.
  integration:
    name: Integration tests (Testcontainers, 실제 Keycloak)
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → Testcontainers 동작
    # 체크아웃만 필요하다
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: 'temurin', java-version: '21', cache: 'maven' }
      - name: Full verify (단위 + 통합 IT + 커버리지 게이트)
        run: mvn -B -f java/pom.xml verify

  release:
    needs: [version, integration, install-smoke]
    runs-on: ubuntu-latest
    # 체크아웃 + Central Portal 업로드 — GitHub Release를 만들지 않으므로 contents write는 불필요하다.
    # ⚠️ `id-token: write`·`attestations: write`는 **출처 증명(attestation)** 에만 쓴다. 둘은 내용·태그·
    # 패키지를 못 건드리며, 같은 목적을 Release 자산으로 하려면 `contents: write`가 필요해 **더 큰 권한**이
    # 된다. 그래서 이 둘이 최소권한이다(경위: PR #550).
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ⚠️ 4개 시크릿 중 하나라도 미설정이면 아무것도 하기 전에 **실패**한다(스킵 아님). 서명키가
      # 없는 채로 진행되면 setup-java는 GPG 임포트를 조용히 건너뛰고, 한참 뒤 deploy 스텝이 인증/서명
      # 실패로 터지면서 원인이 "시크릿 미설정"임을 알려주지 않는다 — 누락된 이름을 여기서 전부 나열한다.
      # job-level `if:`는 secrets를 못 읽으므로(위 헤더 주석) env-매핑된 값으로 가드한다.
      - name: Preflight — 릴리스 시크릿 4개 존재 확인
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USER: ${{ secrets.CENTRAL_TOKEN_USER }}
          CENTRAL_TOKEN_PW: ${{ secrets.CENTRAL_TOKEN_PW }}
        run: |
          missing=""
          [ -n "$MAVEN_GPG_PRIVATE_KEY" ] || missing="$missing MAVEN_GPG_PRIVATE_KEY"
          [ -n "$MAVEN_GPG_PASSPHRASE" ] || missing="$missing MAVEN_GPG_PASSPHRASE"
          [ -n "$CENTRAL_TOKEN_USER" ] || missing="$missing CENTRAL_TOKEN_USER"
          [ -n "$CENTRAL_TOKEN_PW" ] || missing="$missing CENTRAL_TOKEN_PW"
          if [ -n "$missing" ]; then
            echo "::error::필수 릴리스 시크릿 미설정 —$missing. 자격증명/서명키 없이 Central Portal 업로드를 진행할 수 없다(중단)."
            exit 1
          fi

      # server-id: central → settings.xml에 <server><id>central</id>...</server> 생성,
      # CENTRAL_TOKEN_USER/CENTRAL_TOKEN_PW를 username/password로 주입.
      # gpg-private-key → 개인키를 임포트하고 GPG_PASSPHRASE 환경변수를 서명에 사용.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: central
          server-username: CENTRAL_TOKEN_USER
          server-password: CENTRAL_TOKEN_PW
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # 태그(vX.Y.Z)가 릴리스 버전을 결정한다. POM은 main에서 -SNAPSHOT을 유지하고,
      # 여기서 태그값으로 버전을 덮어써 Central이 요구하는 릴리스(비-SNAPSHOT) 좌표로 배포한다.
      # (Maven Central은 SNAPSHOT 좌표를 거부하므로 이 단계가 없으면 배포가 실패한다.)
      - name: Set release version from tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "Releasing io.github.xzawed:* version $VERSION (from tag $GITHUB_REF_NAME)"
          mvn -B -f java/pom.xml org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Deploy to Maven Central (release profile)
        env:
          CENTRAL_TOKEN_USER: ${{ secrets.CENTRAL_TOKEN_USER }}
          CENTRAL_TOKEN_PW: ${{ secrets.CENTRAL_TOKEN_PW }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -f java/pom.xml -Prelease deploy

      # ⚠️ **deploy 뒤에 건다.** `package` 뒤에 걸고 나서 `deploy`를 부르면 Maven이 라이프사이클을
      # 다시 돌아 **서명한 바이트와 올라간 바이트가 갈릴 수 있다**(두 빌드 다 재현 가능하지 않다).
      # deploy가 업로드하는 것은 `target/`의 그 파일이므로, 그 파일을 그대로 증명한다.
      # 실패해도 Portal은 **스테이징**일 뿐이고 공개는 사람이 누른다 — 빨간 워크플로를 보고
      # 누르지 않으면 되므로 이 순서가 fail-closed다.
      #
      # 무엇을 증명하는가: 「Central의 이 바이트는 이 워크플로가 이 태그에서 만든 것」. 지금까지
      # 저장소가 증명할 수 있던 것은 **태그까지**였다(게시 바이트 오라클 `published-floor.yml`이
      # 클래스 버전은 읽지만, 그 바이트가 우리가 빌드한 것인지는 못 읽는다).
      - name: Attest build provenance (배포한 그 바이트)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'java/*/target/*.jar'
