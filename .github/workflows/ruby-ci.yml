name: ruby-ci
on:
  push:
    paths: ['ruby/**', '.github/workflows/ruby-ci.yml', 'scripts/check-hp-attest.mjs']
  pull_request:
    paths: ['ruby/**', '.github/workflows/ruby-ci.yml', 'scripts/check-hp-attest.mjs']
  # 주간 레인 건강검진(환경 드리프트) — 근거는 .claude/rules/ci.md, 슬롯 표는 ci.yml 옆 주석.
  # ⚠️ 이 레인이 이 장치가 생긴 이유다 — rubocop 1.90.0 파손이 08-24~08-28 나흘간 안 보였고,
  # 태그 푸시가 아니었으면 릴리스 때 처음 드러났을 것이다.
  workflow_dispatch:
  schedule:
    - cron: '27 7 * * 1'
permissions:
  contents: read
jobs:
  build-test:
    name: rubocop + rspec + bundler-audit (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      # ⚠️ 하한 레그가 취소되면 그날 하한 검증이 사라진다 — 근거는 node-ci.yml 주석. 여기가
      # 특히 아픈 자리다: 아래 3.2 레그는 `gem "parallel", "< 2"` 핀과 그 핀을 지키는
      # dependabot `ignore` 가 **대가를 치르고 사는 것**인데, 4.0 이 먼저 깨지면 그 검증만 사라진다.
      fail-fast: false
      matrix:
        # ⚠️ 하한 3.2 는 상류 EOL(2026-03-31)을 지났지만 **올리지 않는다** — 하한을 올리는 것은
        # 소비자를 자르는 것이고, 사람 판정은 「자르지 말고 넓힌다」이다. 그 하한은 공짜가 아니라
        # `gem "parallel", "< 2"` 핀으로 대가를 치르며 실제로 검증되고 있다(.claude/rules/ci.md).
        # 4.0 은 현 최신 안정판이고 지금까지 검증 0 이었다.
        ruby: ['3.2', '3.3', '3.4', '4.0']
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ruby
      - run: bundle exec rubocop
      # attest — 적대 경로 행렬은 여섯 예제가 전부 통과한 뒤에만 $HP_ATTEST_DIR/ruby.json 을 쓴다(근거: ci.yml 의 같은 단계).
      - run: bundle exec rspec           # 단위 71개(integration 태그는 spec_helper가 자동 제외) + 커버리지 게이트(라인≥90/브랜치≥85)
        env:
          HP_ATTEST_DIR: ${{ runner.temp }}/hp-attest
          HP_ATTEST_NONCE: ${{ github.run_id }}.${{ github.run_attempt }}.${{ github.job }}.${{ strategy.job-index }}
      - name: 적대 경로 행렬 attest — 이 실행에서 돌았는가(scripts/check-hp-attest.mjs)
        working-directory: .
        env:
          HP_ATTEST_DIR: ${{ runner.temp }}/hp-attest
          HP_ATTEST_NONCE: ${{ github.run_id }}.${{ github.run_attempt }}.${{ github.job }}.${{ strategy.job-index }}
        run: node scripts/check-hp-attest.mjs "$HP_ATTEST_DIR" --nonce "$HP_ATTEST_NONCE" --lang ruby
      - run: bundle exec bundler-audit check --update

  # ⚠️ **커밋된 락은 소비자에게 닿지 않는다** — 소비자의 `bundle install` 은 런타임 의존을 새로 푼다. 위 매트릭스는 락으로만
  # 돌아서, net-http 0.10.0(net-protocol 0.4.0)이 SDK 의 틀 상한 훅을 깨 HTTP 호출이 전부 ArgumentError 였던 것을 못 봤다
  # (락 없는 야간 하네스만 10-10 부터 봤다 · #776). 이 잡은 런타임 그룹만 새로 풀고(rspec·rubocop 같은 dev 도구는 락 그대로)
  # 단위 시험을 돈다. 하한(3.2)과 최신(4.0) — 새로 푼 판은 루비 판마다 갈린다. 상류가 새 판을 내면 주간 실행이 여기서 운다.
  latest-runtime-deps:
    name: rspec on freshly resolved runtime deps (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '4.0']
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: ruby
      - name: 런타임 그룹만 새로 푼다 — 락과 달라진 판을 찍는다
        run: |
          bundle update --group default
          git --no-pager diff -U0 -- Gemfile.lock | grep -E '^[-+] {4}[a-z]' || echo "(락과 같다)"
      # 이 잡도 단위 스위트를 돈다 — 새로 푼 런타임에서도 행렬이 돌았는지 같은 attest 로 본다(nonce 의 잡 이름이 다르다).
      - run: bundle exec rspec
        env:
          HP_ATTEST_DIR: ${{ runner.temp }}/hp-attest
          HP_ATTEST_NONCE: ${{ github.run_id }}.${{ github.run_attempt }}.${{ github.job }}.${{ strategy.job-index }}
      - name: 적대 경로 행렬 attest — 이 실행에서 돌았는가(scripts/check-hp-attest.mjs)
        working-directory: .
        env:
          HP_ATTEST_DIR: ${{ runner.temp }}/hp-attest
          HP_ATTEST_NONCE: ${{ github.run_id }}.${{ github.run_attempt }}.${{ github.job }}.${{ strategy.job-index }}
        run: node scripts/check-hp-attest.mjs "$HP_ATTEST_DIR" --nonce "$HP_ATTEST_NONCE" --lang ruby

  integration:
    name: Integration (docker CLI 셸아웃, 실제 Keycloak 26.6)
    runs-on: ubuntu-latest # ubuntu 러너는 Docker 내장 → KeycloakContainer(docker run 셸아웃) 동작
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby
      # RUN_INTEGRATION=1 → spec_helper의 SimpleCov minimum_coverage 게이트를 억제(통합 단독 실행 시
      # 브랜치 커버리지가 낮게 나와 process-wide 게이트가 오탐 실패하는 것을 방지 — unit 게이트는 불변).
      - run: RUN_INTEGRATION=1 bundle exec rspec spec/integration --tag integration

  api-compat:
    name: yard diff (공개 API 삭제 검출)
    runs-on: ubuntu-latest
    # ⚠️ **Ruby 에는 japicmp/gorelease 등가물이 없다** — 두 gem 버전을 받아 「공개 심볼 제거 +
    # 시그니처 변경」을 파괴적 변경으로 판정하는 도구가 생태계에 존재하지 않는다(조사 결과).
    # 남은 선택은 부분 도구뿐이라 **얻을 수 있는 만큼만 얻는다**:
    #   yard diff  — 공개 객체의 추가(A)/삭제(D)를 잡는다. **시그니처·arity 변경은 못 잡는다**
    #                (yard 가 "modified" 로 보는 것은 메서드 소스 텍스트다).
    #   rbs diff   — 실험적이고 `--type-name` 을 하나씩 줘야 해서 게이트로 쓰기 어렵다.
    # 그래서 이 게이트는 **다른 여덟 레인보다 약하다**. 1.0 문서에 그 한계를 그대로 적는다 —
    # 「Ruby 는 삭제만 기계로 막고 시그니처 변경은 리뷰가 막는다」.
    #
    # ⚠️ **yard diff 의 종료코드는 게이트가 될 수 없다** — go gorelease · php php-semver-checker 에
    # 이어 세 번째다. 실측(변이 `Masking#mask` → `mask_renamed`): `D KeycloakSdk::Masking#mask` 를
    # 정확히 출력하고도 **exit 0** 이었다. 그래서 `^D ` 줄 수를 근거로 삼는다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: ruby
      - name: yard 설치 (gem 매니페스트를 건드리지 않는다)
        run: gem install yard --no-document -v 0.9.45
      - name: 기준선(직전 정식 릴리스)과 현재의 .yardoc 생성
        env:
          # ⚠️ **직전 정식 릴리스**를 적는다. 릴리스마다 함께 올린다.
          BASELINE: 'ruby-v1.4.0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          git archive "$BASELINE" ruby/lib | tar -x -C "$RUNNER_TEMP/base"
          n=$(find "$RUNNER_TEMP/base" -name '*.rb' | wc -l)
          echo "기준선 파일 $n 개"
          # ⚠️ 추출이 비면 「차이 없음」으로 조용히 통과한다 — 공허성 검사.
          [ "$n" -gt 0 ] || { echo "::error::기준선 추출이 비었다 — 태그가 바뀌었나?"; exit 1; }
          (cd "$RUNNER_TEMP/base/ruby" && yard doc --no-output --no-progress lib >/dev/null)
          (cd ruby && yard doc --no-output --no-progress lib >/dev/null)
          test -d "$RUNNER_TEMP/base/ruby/.yardoc" || { echo "::error::기준선 .yardoc 생성 실패"; exit 1; }
          test -d ruby/.yardoc || { echo "::error::현재 .yardoc 생성 실패"; exit 1; }
      # ⚠️ `.yardoc` 레지스트리는 `private` 메서드도 담는다 — 거르지 않으면 비공개 메서드 하나를 지운 것이 「공개 객체
      # 삭제」로 운다(실측 2026-10-29: `AuthClient#configure_rack_oauth2_timeouts` — `private` 아래). `--query` 는 두
      # 레지스트리를 같은 식으로 거르므로 공개 → 비공개 전환도 D 로 잡힌다. 대조(같은 날): 공개 `Masking.mask` 이름을
      # 바꾼 사본 → `D KeycloakSdk::Masking.mask` · `initialize` 는 yard 가 공개로 본다(남는다).
      - name: 공개 객체 삭제가 있으면 실패
        run: |
          set -euo pipefail
          out="$(yard diff --compact --query 'visibility == :public' "$RUNNER_TEMP/base/ruby/.yardoc" ruby/.yardoc 2>&1)"
          echo "$out"
          if printf '%s\n' "$out" | grep -q '^D '; then
            echo "::error::직전 릴리스에 있던 공개 객체가 사라졌다 — 1.0 은 major 없이 허용하지 않는다"
            printf '%s\n' "$out" | grep '^D '
            exit 1
          fi
          echo "OK: 삭제된 공개 객체 없음"
