# sonar-diag — SonarCloud 진단 조회(일회용, 확인 후 제거한다).
#
# 왜 워크플로여야 하는가: SonarCloud 프로젝트가 **private**이라 토큰 없는 API 조회가
# `Project doesn't exist`로 막힌다. 토큰(`SONAR_TOKEN`)은 저장소 시크릿이고 시크릿은
# Actions 실행 안에서만 풀리므로, 사람이 대시보드를 손으로 읽거나 이 워크플로를 한 번
# 돌리거나 둘 중 하나다. 후자가 결과를 로그로 남겨 **검토 가능**하다.
#
# ⚠️ 이 파일은 **일회용이다.** 같은 목적의 워크플로가 2026-07-06에 `f4067d2`로 들어왔다가
# 같은 날 `8ed38cd`로 제거됐다 — 그 관용을 그대로 따른다. 남겨두면 토큰을 쥐는 잡이
# 상시 존재하게 되고, 아무도 안 보는 진단 워크플로는 썩는다.
#
# ⚠️ `workflow_dispatch`는 **기본 브랜치에 있는 워크플로만** 트리거된다 — 그래서 브랜치에
# 두고 몰래 돌릴 수 없고, 병합 → 실행 → 제거의 3단계가 된다(지난번도 같았다).
#
# 무엇을 뽑는가 — 이슈 #165가 "아직 확인 못 한 것"으로 남긴 두 가지다:
#   (A) new code에 남은 실제 이슈: 룰 키 · 파일:라인 · 심각도 · 메시지
#       ⚠️ 게이트가 깨진 조건은 **Reliability와 Security 둘 다**이므로 둘 다 조회한다.
#          예전 판(f4067d2)은 Security만 봤는데, 지금 main을 빨갛게 하는 조건쌍은
#          `C Reliability on New Code` + `B Security on New Code`다.
#   (B) New Code 정의: 이게 처방을 가른다.
#       - NUMBER_OF_DAYS  → 기준선이 굴러가는데도 안 빠진 것 → 이슈 수정이 유일한 길
#       - PREVIOUS_VERSION → `sonar.projectVersion`이 리포에 없어(grep 0건) 기준선이 첫
#         분석에 못박힘 → **버전 배선이 실제 처방**
name: sonar-diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query SonarCloud (authenticated)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -uo pipefail
          # ⚠️ 시크릿 미설정을 "빈 결과"로 흘려보내지 않는다 — 이 저장소가 반복해서 겪은
          # "아무것도 안 하고 green" 부류다(dotnet/kotlin 릴리스 잡이 그랬다).
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN 미설정 — 진단 불가(중단)."; exit 1
          fi
          base="https://sonarcloud.io/api"
          proj="xzawed_KeyCloakSDK"
          # -u "<token>:" = SonarCloud 토큰 basic 인증(사용자명 자리에 토큰, 비밀번호 공란).
          q() { curl -s -w '\n<<HTTP:%{http_code}>>' -u "$SONAR_TOKEN:" "$1"; }

          echo "===== (B) New Code 정의 — 처방을 가르는 값 ====="
          q "$base/new_code_periods/show?project=$proj&branch=main" | tee /tmp/ncp.txt | tail -1
          jq -r '"  type=\(.type)  value=\(.value // "-")  effectiveValue=\(.effectiveValue // "-")  inherited=\(.inherited // false)"' \
            < /tmp/ncp.txt 2>/dev/null || echo "  (파싱 실패 — 위 원문 참고)"
          echo ""

          echo "===== 품질 게이트 조건별 실측값 ====="
          q "$base/qualitygates/project_status?projectKey=$proj&branch=main" > /tmp/qg.txt
          tail -1 /tmp/qg.txt
          jq -r '.projectStatus | "  status=\(.status)", (.conditions[]? | "  \(.status)  \(.metricKey)  actual=\(.actualValue)  \(.comparator) \(.errorThreshold)")' \
            < /tmp/qg.txt 2>/dev/null || echo "  (파싱 실패 — 위 원문 참고)"
          echo ""

          echo "===== new code 측정값 ====="
          q "$base/measures/component?component=$proj&branch=main&metricKeys=new_reliability_rating,new_security_rating,new_bugs,new_vulnerabilities,new_code_smells,new_coverage,new_duplicated_lines_density" > /tmp/m.txt
          tail -1 /tmp/m.txt
          jq -r '.component.measures[]? | "  \(.metric) = \(.period.value // .value)"' < /tmp/m.txt 2>/dev/null || echo "  (파싱 실패)"
          echo ""

          # (A) — 게이트가 깨진 두 축을 각각 조회한다.
          for QUALITY in RELIABILITY SECURITY; do
            echo "===== (A) $QUALITY — new code, 미해결 ====="
            q "$base/issues/search?componentKeys=$proj&branch=main&impactSoftwareQualities=$QUALITY&inNewCodePeriod=true&resolved=false&ps=100" > /tmp/i.txt
            tail -1 /tmp/i.txt
            jq -r '"  total=\(.total)", (.issues[]? | "  \(.rule) | \(.severity // (.impacts[0].severity // "-")) | \(.component | split(":") | last):\(.line // "-") | \(.message)")' \
              < /tmp/i.txt 2>/dev/null || echo "  (파싱 실패)"
            echo ""
          done

          echo "===== 참고: new code 전체(품질 무관) 상위 30건 ====="
          q "$base/issues/search?componentKeys=$proj&branch=main&inNewCodePeriod=true&resolved=false&ps=30" > /tmp/all.txt
          tail -1 /tmp/all.txt
          jq -r '"  total=\(.total)", (.issues[]? | "  \(.rule) | \(.component | split(":") | last):\(.line // "-")")' \
            < /tmp/all.txt 2>/dev/null || echo "  (파싱 실패)"
