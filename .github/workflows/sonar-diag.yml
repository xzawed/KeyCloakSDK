name: sonar-diag
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query SonarCloud findings (authenticated)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          base="https://sonarcloud.io/api"
          proj="xzawed_KeyCloakSDK"
          echo "===== new_security_rating / new_vulnerabilities / new_security_hotspots (main) ====="
          curl -s -u "$SONAR_TOKEN:" "$base/measures/component?component=$proj&branch=main&metricKeys=new_security_rating,new_vulnerabilities,new_security_hotspots,security_rating,vulnerabilities" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(' ',m.get('metric'),'=',m.get('period',{}).get('value',m.get('value'))) for m in d.get('component',{}).get('measures',[])] or print('  (no measures / error:',str(d)[:200],')')"
          echo ""
          echo "===== VULNERABILITY issues (main, unresolved) ====="
          curl -s -u "$SONAR_TOKEN:" "$base/issues/search?componentKeys=$proj&branch=main&types=VULNERABILITY&resolved=false&ps=50" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('  total=',d.get('total'));[print('  ',i.get('rule'),'|',i.get('component','').split(':')[-1],':',i.get('line'),'|',str(i.get('message'))[:100]) for i in d.get('issues',[])]"
          echo ""
          echo "===== SECURITY-impact issues in NEW code (main) ====="
          curl -s -u "$SONAR_TOKEN:" "$base/issues/search?componentKeys=$proj&branch=main&impactSoftwareQualities=SECURITY&inNewCodePeriod=true&resolved=false&ps=50" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('  total=',d.get('total'));[print('  ',i.get('rule'),'|',i.get('component','').split(':')[-1],':',i.get('line'),'|',str(i.get('message'))[:100]) for i in d.get('issues',[])]"
          echo ""
          echo "===== HOTSPOTS (main) ====="
          curl -s -u "$SONAR_TOKEN:" "$base/hotspots/search?projectKey=$proj&branch=main&ps=50" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('  total=',d.get('paging',{}).get('total'));[print('  ',h.get('ruleKey'),'|',h.get('vulnerabilityProbability'),'|',h.get('component','').split(':')[-1],':',h.get('line'),'|',str(h.get('message'))[:100]) for h in d.get('hotspots',[])]"
