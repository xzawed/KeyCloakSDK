plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "examples/**/*"

# 코드베이스 전반이 double-quote·LF(크로스플랫폼·CI Linux 정렬)
Style/StringLiterals:
  EnforcedStyle: double_quotes
Layout/EndOfLine:
  EnforcedStyle: lf

Metrics/MethodLength:
  Max: 25
Metrics/AbcSize:
  Max: 25
# AuthClient는 8개 인증 흐름(create_authorization_request·exchange_code·refresh·
# client_credentials·access_token·introspect·logout·validate)에 PKCE·nonce 재생방지까지
# 한 파사드에 모으는 관용 SDK 진입점이라 기본 100줄을 소폭 넘는다(자매 SDK의 AuthClient 동형).
# 115 → 140 (2026-10-05): 세 그랜트를 rack-oauth2 의 연결이 아니라 SDK 커넥션으로 직접 보낸다(토큰 응답 1 MiB
# 상한 — rack-oauth2 는 자기 연결로 본문을 통째로 읽는다). 클라이언트 인증·rack-oauth2 의 응답 규칙이 이 클래스로 왔다.
# 140 → 144 (2026-10-22): introspect·logout 경계가 Faraday 밖 예외도 감싸며 SDK 오류를 그대로 통과시키는 두 줄씩
# (net-http 0.10 의 응답 헤더 검증 ArgumentError 가 raw 로 샜다 — `spec/unit/net_http_header_validation_spec.rb`).
# 144 → 142 (2026-10-29): `Rack::OAuth2.http_config` 를 걸던 메서드를 지워 AuthClient 가 137 이다 — 이제 가장 긴
# 클래스는 `spec/support/body_server.rb`(142)라 거기까지만 내린다.
Metrics/ClassLength:
  Max: 142
# 키워드 인자는 이름이 곧 문서화라 위치 인자 목록과 달리 가독성을 해치지 않는다
# (예: Config#initialize의 8개 키워드 인자).
Metrics/ParameterLists:
  CountKeywordArgs: false
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"
Style/Documentation:
  Enabled: false
# spec/unit/ 레이아웃(7개 자매 SDK의 tests/unit/ 동형) — describe 클래스명↔파일경로
# 매칭을 강제하지 않는다(spec/unit/config_spec.rb ↔ describe KeycloakSdk::Config 허용).
RSpec/SpecFilePathFormat:
  Enabled: false
RSpec/ExampleLength:
  Max: 20
  Exclude:
    - "spec/integration/**/*"
RSpec/MultipleExpectations:
  Max: 8
  Exclude:
    - "spec/integration/**/*"
# spec/integration/은 실제 컨테이너 전체수명 E2E 단일 예제(6개 자매 SDK의 단일 E2E 통합테스트와 동형) —
# 컨테이너 기동/종료를 전 예제가 공유해야 하므로 describe 대상 클래스 없음·before(:all)/after(:all)·
# 인스턴스 변수 공유가 구조상 불가피하다.
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
RSpec/BeforeAfterAll:
  Exclude:
    - "spec/integration/**/*"
RSpec/InstanceVariable:
  Exclude:
    - "spec/integration/**/*"
