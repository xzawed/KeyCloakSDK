[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[project]
name = "keycloak-sdk"
version = "0.1.0"
description = "Keycloak SDK for Python — 인증(OIDC) + 관리 API, python-keycloak 래핑"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "xzawed", email = "xzawed31@gmail.com" }]
keywords = ["keycloak", "oidc", "oauth2", "sso", "admin"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
]
dependencies = [
  "python-keycloak>=7.1,<8",
  "joserfc>=1.7",
]

[project.urls]
Homepage = "https://github.com/xzawed/KeyCloakSDK"
Repository = "https://github.com/xzawed/KeyCloakSDK"
Issues = "https://github.com/xzawed/KeyCloakSDK/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "mypy>=2.0",
  "ruff>=0.6",
  "testcontainers[keycloak]>=4.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keycloak_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: 실제 Keycloak 컨테이너 필요(Docker)"]

[tool.coverage.run]
branch = true
source = ["keycloak_sdk"]
omit = [
  "*/auth.py", "*/admin/__init__.py",          # 네트워크 경계 — 통합으로 검증
  "*/aio/auth.py", "*/aio/admin/__init__.py",  # async 네트워크 경계 — 통합으로 검증
]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
