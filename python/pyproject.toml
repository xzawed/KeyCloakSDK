[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[project]
name = "keycloak-sdk"
version = "0.1.0"
description = "Keycloak SDK for Python — auth (OIDC/OAuth2) + Admin REST API, wrapping python-keycloak"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "xzawed", email = "xzawed31@gmail.com" }]
keywords = ["keycloak", "oidc", "oauth2", "sso", "admin"]
classifiers = [
  # ⚠️ 라이선스는 위 `license = "Apache-2.0"`(PEP 639 SPDX 표현식)이 진실 원천이다.
  # `License :: OSI Approved :: ...` 분류자는 Metadata 2.4에서 폐기 예정이고, PEP 639는
  # 표현식이 있을 때 빌드 도구가 분류자 병기를 **오류로 처리할 수 있다(MAY)**고 규정한다.
  # PyPI가 지금 그것을 거부하지는 않지만(실측: twine check --strict 통과) 빌드 도구가 언제든
  # 막을 수 있는 조합이라 분류자 쪽을 지웠다 — 중복 선언이지 추가 정보가 아니었다.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
]
dependencies = [
  "python-keycloak>=7.1,<8",
  "joserfc>=1.7,<2",   # 보안 핵심(JWT 검증) — major 상한 고정으로 예기치 않은 파괴적 변경 차단
]

[project.urls]
# `Homepage`는 표시 전용이라 python/을 가리켜도 안전하다 — PyPI 페이지에서 링크를 누른 소비자가
# 9개 언어 README가 아니라 python/README.md에 닿는다. PyPI의 Trusted Publisher URL 검증은
# 하위경로를 허용하므로(reference path의 subpath면 통과) 초록 체크마크도 그대로 유지된다.
Homepage = "https://github.com/xzawed/KeyCloakSDK/tree/main/python"
# ⚠️ `Repository`는 저장소 **루트**로 둔다. PEP 753의 라벨 정규화에서 이 이름은 well-known `source`
# 버킷(별칭 repository/sourcecode/github)으로 접히며, 자동화 도구가 패키지→저장소 매핑에 쓰는 값이다.
# Ruby/Rust에서 실측된 것과 같은 부류의 조용한 파손(하위경로가 붙으면 owner/repo 파싱이 깨짐)을 피한다.
Repository = "https://github.com/xzawed/KeyCloakSDK"
Issues = "https://github.com/xzawed/KeyCloakSDK/issues"

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "mypy>=2.0",
  "ruff>=0.6",
  "testcontainers[keycloak]>=4.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/keycloak_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: 실제 Keycloak 컨테이너 필요(Docker)"]

[tool.coverage.run]
branch = true
source = ["keycloak_sdk"]
omit = [
  "*/auth.py", "*/admin/__init__.py",          # 네트워크 경계 — 통합으로 검증
  "*/aio/auth.py", "*/aio/admin/__init__.py",  # async 네트워크 경계 — 통합으로 검증
]

[tool.coverage.report]
fail_under = 100    # 로직 모듈 라인/브랜치 100% 강제(경계모듈은 위 omit — 통합테스트로 검증)

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 보안(S/bandit)·현대화(UP)·버그성(B)·간결화(SIM,C4)·async 정합(ASYNC)·불필요코드(PIE)·ruff 고유(RUF)
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PIE", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# 테스트/예제의 assert(S101)·데모용 하드코딩 자격증명(S105/S106)은 의도된 것이므로 허용
"tests/**" = ["S101", "S105", "S106"]
"examples/**" = ["S101", "S105", "S106"]
