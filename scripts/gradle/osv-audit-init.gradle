// OSV 감사 전용 init script — 컨테이너 안에서만 닿는 Maven 저장소를 걷어낸다.
//
// ⚠️ 왜 필요한가: `harness/install/consume/kotlin-app` 은 게시된 SDK 를 compose 서비스
// `mvn-repo-kotlin`(nginx, 평문 HTTP)에서 해석한다. CI 러너에는 그 호스트가 없고, 닿지 않는
// 저장소가 선언돼 있으면 Gradle 은 **뒤의 mavenCentral 로 흘러가지 않고 전부 FAILED 로 끝낸다**
// (실측: 9개 의존 전부 FAILED). 그 저장소만 제거하면 게시된 좌표가 Central 에서 해석된다
// (실측 2026-08-28: FAILED 0 · 트리 352줄 · 좌표 129개).
//
// ⚠️ `allprojects { repositories.removeIf ... }` 를 그냥 쓰면 **안 먹는다** — init script 의
// allprojects 는 빌드 스크립트 본문이 저장소를 선언하기 **전에** 돈다(실측: FAILED 9 그대로).
// `projectsEvaluated` 로 평가가 끝난 뒤에 걷어내야 한다.
//
// 감사는 좌표만 보므로 SDK 를 어느 저장소에서 가져왔는지는 결과에 영향을 주지 않는다.
// 이 파일을 쓰지 않는 `harness/apps/kotlin` 에서는 제거 대상이 없어 무동작이다.
gradle.projectsEvaluated {
    allprojects { p ->
        p.repositories.removeIf {
            it instanceof MavenArtifactRepository && it.url.toString().startsWith('http://mvn-repo-kotlin')
        }
    }
}
